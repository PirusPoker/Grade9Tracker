[package]
name = "grade9-tracker"
version = "1.28.0"
description = "Two-year Edexcel IGCSE study plan with daily sessions, scheduled tests and an automatic fix list."
authors = ["Alastair"]
edition = "2021"

[lib]
name = "grade9_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
tiny_http = "0.12"

# Reading our own token, to notice when we have been started elevated.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
# Reading Outlook over COM (outlook/com.rs). 0.61 is already in the tree via
# tauri, so this only widens its features rather than adding a crate.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
