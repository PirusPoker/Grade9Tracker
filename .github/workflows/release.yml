# Build, sign and publish a release whenever a version tag is pushed.
#
#   1. bump "version" in src-tauri/tauri.conf.json and src-tauri/Cargo.toml
#   2. git tag v1.2.0 && git push --tags
#
# The action uploads the installer, its signature and latest.json to a draft
# GitHub release, which is published only when all of them are present;
# installed copies of the app see latest.json on their next launch and offer
# the update. Two repository secrets are needed:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/grade9tracker.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key's password (empty if none)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Fetch Piper TTS engine and voice
        shell: bash
        run: ./scripts/fetch-tts.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Grade 9 Tracker ${{ github.ref_name }}"
          releaseBody: "See the commit log for what changed."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # GitHub's asset upload fails intermittently on 250MB installers;
          # retry rather than fail the whole run.
          retryAttempts: 3

      # A copy of the installer under a fixed name, so one link always fetches
      # the newest version:
      #   https://github.com/PirusPoker/Grade9Tracker/releases/latest/download/Grade9Tracker-Setup.exe
      - name: Upload the installer under a fixed name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" Grade9Tracker-Setup.exe
          gh release upload "$TAG" Grade9Tracker-Setup.exe --clobber

      # The release stays a draft - invisible to the updater - until every
      # asset is really there. A failed upload then leaves nothing marked
      # Latest, and a rerun simply fills in the missing files.
      - name: Publish once every asset is up
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --json assets -q '.assets[].name' > assets.txt
          cat assets.txt
          for want in 'setup.exe$' 'setup.exe.sig$' '^latest.json$' '^Grade9Tracker-Setup.exe$'; do
            grep -q "$want" assets.txt || { echo "missing asset matching $want"; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
