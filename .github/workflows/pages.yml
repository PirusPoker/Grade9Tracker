# Publish the website on every push to master:
#   /        the download page (docs/)
#   /app/    the browser edition - the interface on top of the Rust core
#            compiled to WebAssembly, installable to a phone's home screen
# scripts/build-web.sh does the assembling; this just runs it and deploys.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      - name: Install wasm-bindgen
        run: |
          VER=$(cargo metadata --manifest-path web/Cargo.toml --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="wasm-bindgen"))')
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/$VER/wasm-bindgen-$VER-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv "wasm-bindgen-$VER-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          wasm-bindgen --version

      - name: Build the site
        run: ./scripts/build-web.sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
