# The web build: the app's pure core (plan, config, course, lessons, papers,
# videos) compiled to WebAssembly so the same interface can run in a browser
# and be added to an iPhone or Android home screen. It reuses the source files
# in ../src-tauri/src by path; nothing is duplicated. Build with
# scripts/build-web.sh; the Pages workflow does the same on every push.
[package]
name = "grade9-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
