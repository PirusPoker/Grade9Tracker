<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 9 Tracker</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
/* Dark, soft and rounded: deep graphite surfaces, a faint aurora behind the
   page, pill buttons and generous corners. Tokens only - nothing below this
   block should name a raw colour. */
:root{
  color-scheme:dark;
  --ground:#131314; --surface:#1E1F20; --surface2:#2A2B2D; --sunken:#19191B; --raised:#303134;
  --ink:#E8EAED; --ink-2:#C4C7C5; --muted:#8E9196; --line:#2E3033; --line-2:#3C3F43; --line-3:#4C5056;
  --accent:#A8C7FA; --accent-ink:#062E6F; --accent-soft:rgba(168,199,250,.13); --accent-soft2:rgba(168,199,250,.22); --accent-line:rgba(168,199,250,.38);
  --solid:#E8EAED; --solid-ink:#131314; --solid-hover:#FFFFFF;
  --good:#6DD58C; --good-soft:rgba(109,213,140,.13); --good-line:rgba(109,213,140,.38);
  --bad:#F2A5A0; --bad-soft:rgba(242,165,160,.13); --bad-line:rgba(242,165,160,.38);
  --warn:#FDD663; --warn-soft:rgba(253,214,99,.11); --warn-line:rgba(253,214,99,.32);
  --maths:#7CACF8; --fpm:#B49BFF; --bus:#FFA45C; --econ:#5DD39E; --cs:#F58FBF; --englit:#E39BFF; --englang:#F6C15A;
  --bio:#6FD68D; --chem:#5FD3E8; --phys:#9DA3FF; --test:#E8EAED; --rest:#6B6F76;
  --r:18px; --r-sm:12px; --r-xs:8px; --navh:58px;
  --glow-a:rgba(66,133,244,.26); --glow-b:rgba(52,168,83,.16); --glow-c:rgba(171,71,188,.18);
  --shadow:0 10px 30px rgba(0,0,0,.28);
  --display:"Segoe UI Variable Display","Segoe UI",-apple-system,"Helvetica Neue",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",-apple-system,"Helvetica Neue",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,ui-monospace,monospace;
}
*{box-sizing:border-box}
/* The aurora: three soft radial washes fixed behind everything, like the gradient header of a notebook. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(1100px 620px at 12% -12%,var(--glow-a),transparent 62%),
  radial-gradient(900px 560px at 88% -8%,var(--glow-b),transparent 62%),
  radial-gradient(900px 520px at 50% 112%,var(--glow-c),transparent 64%)}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-bottom:calc(var(--navh) + 24px);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.18;letter-spacing:-.018em;text-wrap:balance;font-weight:650}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}
a{color:var(--accent);text-underline-offset:2px}

.wrap{max-width:680px;margin:0 auto;padding:24px 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.lift{box-shadow:var(--shadow)}
.stack{display:grid;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--surface2);color:var(--ink-2)}
.pill .dot{width:7px;height:7px;border-radius:50%}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:999px;
  font-weight:600;font-size:14.5px;border:1px solid var(--line-2);background:var(--surface2);color:var(--ink);
  transition:background .12s,border-color .12s}
.btn:hover{background:var(--raised);border-color:var(--line-3)}
.btn.primary{background:var(--solid);color:var(--solid-ink);border-color:var(--solid)}
.btn.primary:hover{background:var(--solid-hover);border-color:var(--solid-hover)}
.btn.done{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.btn.small{padding:6px 13px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(19,19,20,.82);backdrop-filter:saturate(160%) blur(16px);border-top:1px solid var(--line);z-index:10}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected=true]{color:var(--accent)}
.nav button[aria-selected=true]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
/* The hidden attribute must always win, whatever display a class sets. */
[hidden]{display:none!important}
.view[hidden]{display:none}

/* today */
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.weekbar h2{font-size:14px;font-weight:600;flex:1;font-family:var(--body);letter-spacing:0}
.weekbar button{width:34px;height:34px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface2);font-size:17px;color:var(--ink-2)}
.weekbar button:hover:not(:disabled){background:var(--raised)}
.weekbar button:disabled{opacity:.3}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0 18px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 2px;text-align:center;display:grid;gap:5px;justify-items:center}
.day:hover{border-color:var(--line-2)}
.day .dn{font-size:10.5px;font-weight:650;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.day .dd{font-family:var(--display);font-size:15px;font-weight:650}
.day .marks{display:flex;gap:3px;height:6px}
.day .marks i{width:6px;height:6px;border-radius:50%;display:block}
.day .marks i.off{opacity:.22}
.day[aria-selected=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.day.today .dn{color:var(--accent)}
.day.alldone{background:var(--good-soft);border-color:var(--good-line)}

/* session card */
.session{border-top:3px solid var(--c);padding-top:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,var(--surface)),var(--surface) 55%)}
.session .head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.session h2{font-size:21px;margin:0 0 3px}
.session .sub{color:var(--muted);font-size:13.5px;margin-bottom:15px}
.steps{display:grid;gap:11px;margin-bottom:16px}
.step{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;color:var(--muted)}
.step b{display:block;font-weight:650}
.step span{color:var(--muted);font-size:13.5px}
.scores{display:grid;gap:7px;margin:12px 0}
.scores label{display:flex;align-items:center;gap:8px;font-weight:500}
.scores label .s{flex:1;display:flex;align-items:center;gap:8px}
.scores .dot{width:8px;height:8px;border-radius:2px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.fixbanner{background:var(--bad-soft);border:1px solid var(--bad-line);border-radius:var(--r-sm);padding:12px 14px;color:var(--bad);display:flex;gap:10px;align-items:center;font-weight:550;font-size:14px}
.fixbanner button{margin-left:auto;font-weight:650;text-decoration:underline;color:inherit}
.fixlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px}
.fixlist li{display:flex;gap:10px;align-items:center;font-size:14px}
.fixlist input{width:18px;height:18px;accent-color:var(--good)}
.chip{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}

/* subjects */
.srow{display:grid;grid-template-columns:1fr auto;gap:7px 14px;padding:14px 0;border-top:1px solid var(--line);align-items:center;cursor:pointer;width:100%;text-align:left}
.srow:first-child{border-top:0}
.srow:hover .name{color:var(--accent)}
.srow .name{font-weight:650;display:flex;align-items:center;gap:9px;font-size:16px;letter-spacing:-.01em}
.srow .name .dot{width:10px;height:10px;border-radius:50%}
.srow .pct{color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.srow .prog{grid-column:1/-1}
.prog i{display:block;height:100%;border-radius:3px}
.status{font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:999px}
.status.ahead{background:var(--good-soft);color:var(--good)}
.status.ontrack{background:var(--surface2);color:var(--ink-2)}
.status.behind{background:var(--bad-soft);color:var(--bad)}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;margin-bottom:12px;font-size:14px}
.back:hover{color:var(--ink)}
.topic{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0}
.topic input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.topic .t{font-weight:500;font-size:14.5px}
.topic .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.topic.done .t{color:var(--muted);text-decoration:line-through}
.topic .code{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:6px}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.kpi .v{font-family:var(--display);font-size:27px;font-weight:650;letter-spacing:-.03em;line-height:1.1;margin-top:3px}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.trow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.trow:first-child{border-top:0}
.trow .chips{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.stmts{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:15px;background:var(--sunken)}
.stmts>summary{cursor:pointer;padding:10px 13px;display:flex;align-items:center;gap:9px;list-style:none}
.stmts>summary::-webkit-details-marker{display:none}
.stmts>summary::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.stmts[open]>summary::after{transform:rotate(-135deg)}
.stmts>summary:hover{background:var(--surface2)}
.stmts ul{list-style:none;margin:0;padding:0 13px 6px;display:grid;gap:1px}
.stmts label{display:grid;grid-template-columns:auto 2.4em 1fr;gap:9px;align-items:center;padding:5px 0;font-size:13.5px;cursor:pointer}
.stmts input{width:16px;height:16px;accent-color:var(--good)}
.stmts .sc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stmts input:checked ~ span:last-child{color:var(--muted);text-decoration:line-through}
.refs{display:flex;flex-wrap:wrap;gap:5px}
.ref{font-family:var(--mono);font-size:11.5px;padding:3px 7px;border-radius:var(--r-xs);border:1px solid var(--line-2);color:var(--muted);background:var(--surface)}
.ref.part{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.ref.full{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}
.ref.gap{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(12px,1fr));gap:3px;margin:8px 0 4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface2);display:block}

/* guide */
.prose{max-width:64ch;font-size:14.5px}
.prose h3{font-size:16.5px;margin:22px 0 7px}
.prose p{margin:0 0 11px}
.prose ul{margin:0 0 11px;padding-left:19px}
.prose li{margin-bottom:5px}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px}

/* links out to Save My Exams and anywhere else the session sends you */
.links{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.links .btn{text-decoration:none}
.links .btn.go{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.links .btn.go:hover{background:var(--accent-soft2)}
.pinrow{display:flex;gap:7px;margin-bottom:15px}
.obj{margin-bottom:15px}
.obj ul{margin:7px 0 0;padding-left:17px;display:grid;gap:5px}
.obj li{font-size:14px;color:var(--ink-2)}
.obj li::marker{color:var(--muted)}
.watch{display:flex;gap:8px;padding:11px 13px;border-radius:var(--r-sm);background:var(--warn-soft);border:1px solid var(--warn-line);font-size:13.5px;color:var(--ink-2);margin-bottom:15px;line-height:1.5}
.watch b{color:var(--warn);white-space:nowrap}
.sub-ed>summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600;padding:5px 0;list-style:none}
.sub-ed>summary::-webkit-details-marker{display:none}
.sub-ed>summary::before{content:"+ ";font-weight:700}
.sub-ed[open]>summary::before{content:"– "}
.sub-ed>summary:hover{color:var(--ink)}
.sub-ed .inner{display:grid;gap:6px;padding:4px 0 10px}
.selfcheck{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:13px;border-radius:var(--r-sm);background:var(--sunken);border:1px solid var(--line);margin-bottom:12px}
.selfcheck .q{font-weight:650;flex:1;min-width:185px;font-size:14.5px}
.mark{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.mark.got{background:var(--good-soft);color:var(--good)}
.mark.shaky{background:var(--bad-soft);color:var(--bad)}
.streak{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:650;font-size:13.5px}
.streak.cold{background:var(--surface2);color:var(--muted)}
.banner{border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:550;font-size:14px}
.banner.due{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent)}
.banner.warn{background:var(--bad-soft);border:1px solid var(--bad-line);color:var(--bad);align-items:flex-start}
.banner.warn .bt{font-weight:550}.banner.warn .bt small{display:block;font-weight:450;opacity:.85;margin-top:3px;font-size:12.5px}
.banner button{margin-left:auto;font-weight:650;text-decoration:underline;white-space:nowrap;color:inherit}

/* your day — timetable, free time and deadlines read out of Outlook */
.dayplan .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dayplan .top .eyebrow{flex:1}
.dayplan .upd{font-size:12px;color:var(--muted)}
.dayplan .note{font-size:13px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:var(--r-xs);padding:7px 10px;margin-bottom:10px}
.dayplan .sec{margin-top:14px}
.tl{display:grid;margin:0}
.tl .ev{display:grid;grid-template-columns:6.6em 1fr;gap:10px;align-items:baseline;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.tl .ev:first-child{border-top:0}
.tl .ev .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.tl .ev b{font-weight:600}
.tl .ev .loc{color:var(--muted);font-size:13px}
.tl .ev.past{opacity:.45}
.tl .ev.now b{color:var(--accent)}
.tl .ev.free{color:var(--good)}
.tl .ev.free .t{color:var(--good)}
.tl .ev.free.best{background:var(--good-soft);margin:0 -10px;padding:6px 10px;border-radius:var(--r-xs);border-top:0}
.tl .ev.free.best+.ev{border-top:0}
.dl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:9px}
.dl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px}
.dl input{width:18px;height:18px;accent-color:var(--good);margin-top:2px}
.dl .when{font-weight:650;white-space:nowrap;margin-right:6px}
.dl .when.over{color:var(--bad)}
.dl .when.soon{color:var(--accent)}
.dl .who{color:var(--muted);font-size:12.5px}
.dl .snip{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.dl li.done{opacity:.45}
.dl li.done .title{text-decoration:line-through}
.dl.org .title{font-weight:550}
.dl.org.later{opacity:.66}
/* Teams assignments */
.asg{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:13px}
.asg li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px}
.asg input{width:18px;height:18px;accent-color:var(--good);margin-top:2px}
.asg .ah{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.asg .ah .title{font-weight:650}
.asg .who{color:var(--muted);font-size:12.5px}
.asg .snip{color:var(--ink-2);font-size:13px;margin-top:3px;line-height:1.45}
.asg .alinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.asg li.done{opacity:.5}
.asg li.done .title{text-decoration:line-through}
/* The email an item came from, opened inline */
.mailbtn{margin-left:6px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;vertical-align:1px}
.mailbtn:hover,.mailbtn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.mailview{margin-top:8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunken);overflow:hidden}
.mailview .mh{display:grid;gap:2px;padding:10px 12px;border-bottom:1px solid var(--line)}
.mailview .mh b{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
.mailview .mh span{font-size:12px;color:var(--muted)}
.mailview .mb{padding:10px 12px;font-size:13px;line-height:1.5;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto}
.mailview .mf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px}

/* editor */
input[type=text],input[type=search],input[type=date],input[type=url],input[type=number],select,textarea{font:inherit;font-size:14px;padding:9px 14px;
  border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--sunken);color:var(--ink);width:100%;transition:border-color .12s}
input[type=number]{font-family:var(--mono);width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--line-3)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:66px}
.ed{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.ed:first-of-type{border-top:0}
.ed-row{display:grid;gap:7px;align-items:center}
.ed-row.topic{grid-template-columns:5.5em 1fr 4.5em auto;border:0;padding:0}
.ed-row.band{grid-template-columns:1fr 1fr 1fr auto}
.ed-row.block{grid-template-columns:1fr 4.5em 1fr auto}
.ed-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650}
.icon{width:32px;height:32px;border-radius:999px;border:1px solid var(--line-2);display:grid;place-items:center;font-size:15px;color:var(--muted);flex:none;background:var(--surface2)}
.icon:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--surface);overflow:hidden}
.acc[open]{border-color:var(--line-2)}
.acc>summary{cursor:pointer;padding:13px 15px;font-weight:650;display:flex;align-items:center;gap:9px;list-style:none;font-size:15px}
.acc>summary:hover{background:var(--surface2)}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.acc[open]>summary::after{transform:rotate(45deg)}
.acc .body{padding:2px 15px 16px;border-top:1px solid var(--line)}
.savebar{position:sticky;bottom:calc(var(--navh) + 10px);background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r);
  padding:11px 13px;display:flex;gap:9px;align-items:center;box-shadow:var(--shadow);margin-top:16px;z-index:5}
.savebar .msg{font-size:13.5px;color:var(--muted);flex:1}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .4s ease}}

/* day summary */
.daybar{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.daybar>div:first-child{flex:1}
.dsum{font-size:14px;color:var(--ink-2);margin-top:2px}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-2)}

/* compact session rows */
.sess{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,var(--surface)),var(--surface) 45%);border:1px solid var(--line);border-radius:var(--r);position:relative}
.sess .row{display:flex;align-items:stretch;min-height:52px}
.sess .grab{flex:1;display:flex;align-items:center;gap:10px;padding:0 12px 0 0;text-align:left;min-width:0}
.sess .bar{width:4px;align-self:stretch;background:var(--c);border-radius:var(--r) 0 0 var(--r);flex:none;margin-right:10px}
.sess .title{flex:1;font-weight:600;font-size:14.5px;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .mins{font-size:12px;color:var(--muted);flex:none}
.sess .tag{font-size:11px;font-weight:650;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:999px;flex:none}
.sess .tick,.sess .more{width:44px;border-left:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:16px;flex:none}
.sess .tick:hover,.sess .more:hover{background:var(--surface2);color:var(--ink)}
.sess .tick.on{color:var(--good);background:var(--good-soft)}
.sess .tick:disabled{opacity:.3}
.sess .more{border-radius:0 var(--r) var(--r) 0;font-size:18px;letter-spacing:1px}
.sess.isdone .title{color:var(--muted);text-decoration:line-through}
.sess.isskip{opacity:.55}
.sess.isskip .title{text-decoration:line-through}
.sess.open{border-color:var(--line-2);box-shadow:var(--shadow)}
.sess.open .bar{border-radius:var(--r) 0 0 0}
.sess .body{padding:4px 16px 16px 26px;border-top:1px solid var(--line)}
.sess .body .sub{color:var(--muted);font-size:13.5px;margin:8px 0 14px}
.sess .body .steps{margin-top:4px}
.menu{position:absolute;right:8px;top:48px;z-index:6;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r-sm);box-shadow:var(--shadow);display:grid;min-width:210px;padding:5px;animation:pop .1s ease-out}
.menu button{text-align:left;padding:9px 11px;border-radius:var(--r-xs);font-size:13.5px;font-weight:550}
.menu button:hover{background:var(--surface2)}
.menu button.danger{color:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* recall checks */
.review{border-top-width:3px}
.recall{display:grid;gap:4px;margin:0 0 12px}
.rq{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--sunken);border:1px solid var(--line);font-size:14px}
.rq>span:first-child{flex:1}
.rq .yn{display:flex;gap:4px;flex:none}
.rq .yn button{width:30px;height:30px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface2);font-weight:700;color:var(--muted)}
.rq.yes{background:var(--good-soft);border-color:var(--good-line)}
.rq.yes .yn button:first-child{background:var(--good);color:var(--ground);border-color:var(--good)}
.rq.no{background:var(--bad-soft);border-color:var(--bad-line)}
.rq.no .yn button:last-child{background:var(--bad);color:var(--ground);border-color:var(--bad)}
.obj li.gap{color:var(--bad)}

/* cards */
.cards{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:15px;background:var(--sunken)}
.cards>summary{cursor:pointer;padding:10px 13px;display:flex;align-items:center;gap:9px;list-style:none}
.cards>summary::-webkit-details-marker{display:none}
.cards>summary::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
.cards[open]>summary::after{transform:rotate(-135deg)}
.cardrow{display:flex;gap:10px;align-items:center;padding:8px 13px;border-top:1px solid var(--line);font-size:13.5px}
.cardrow>div{flex:1;min-width:0}
.cardrow .f{font-weight:600}
.cardrow .b{color:var(--muted);font-size:13px}
.cardadd{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;padding:10px 13px 4px;border-top:1px solid var(--line)}
.cardadd input{font-size:13px;padding:7px 9px}
.cards>p{padding:0 13px 10px}
.quiz{display:grid;gap:6px;margin:0 0 12px}
.qcard{text-align:left;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface2);display:grid;gap:3px}
.qcard .f{font-weight:650;font-size:14px}
.qcard .hint{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.qcard .b{font-size:13.5px;color:var(--ink-2)}
.qcard.open{border-color:var(--accent);background:var(--accent-soft)}

/* subject page */
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:16px 0 6px;border-top:1px solid var(--line);margin-top:6px}
.sect:first-of-type{border-top:0;margin-top:0;padding-top:4px}
.knowbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.know{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface2);font-size:13px;font-weight:700;color:var(--accent-ink);display:grid;place-items:center}
.know:hover{border-color:var(--accent)}
.know.on{background:var(--accent);border-color:var(--accent)}
.topic .more{width:30px;height:30px;border-radius:var(--r-xs);color:var(--muted);font-size:18px;display:grid;place-items:center}
.topic .more:hover{background:var(--surface2);color:var(--ink)}
.tbody{padding:4px 0 14px 30px;border-top:1px dashed var(--line)}
.examrow{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.examrow input{width:auto}

/* ---------- responsive ----------
   Nothing may force the column wider than the window: every flex and grid
   child that carries text gets min-width:0 so it shrinks and truncates
   instead of pushing the buttons off the right-hand edge. */
.view,.stack,.stack>*,.sess,.sess .row,.sess .grab,.sess .title,.card,.daybar>div,.srow,.srow .name,.topic>div,.rq>span:first-child,.cardrow>div{min-width:0}
.btn{line-height:1.25;text-align:center}
.links .btn,.btn.small{white-space:normal}
img,svg{max-width:100%}
table{max-width:100%}
.tside{display:none}

/* wide: use the space - Today gets the whole week beside the day */
@media (min-width:1000px){
  .wrap{max-width:1180px}
  #view-today{display:grid;grid-template-columns:minmax(0,760px) 340px;gap:28px;align-items:start;justify-content:center}
  .tmain{min-width:0}
  .tside{display:block;position:sticky;top:24px}
  .tside .card{padding:14px 16px}
  .wk{display:grid;gap:6px}
  .wk .wd{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
  .wk .wd:first-child{border-top:0}
  .wk .wd.sel{background:var(--accent-soft);margin:0 -8px;padding:6px 8px;border-radius:var(--r-sm);border-top-color:transparent}
  .wk .wd .d{font-family:var(--display);font-weight:650;font-size:13px;line-height:1.3}
  .wk .wd .d small{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:650}
  .wk .wd .d.today{color:var(--accent)}
  .wk .ws{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:2px 0;min-width:0;text-align:left;width:100%}
  .wk .ws i{width:7px;height:7px;border-radius:2px;flex:none}
  .wk .ws span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wk .ws.done span{color:var(--muted);text-decoration:line-through}
  .wk .ws.skip{opacity:.5}
  .wk .ws:hover span{color:var(--accent)}
  .wk .none{font-size:12px;color:var(--muted)}
  #view-subjects .card.slist{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
  #view-subjects .card.slist .srow:nth-child(2){border-top:0}
  .kpis{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:1400px){
  .wrap{max-width:1240px}
  #view-today{grid-template-columns:minmax(0,800px) 380px}
}

/* narrow: compress the strip, hide the decoration, keep every control reachable */
@media (max-width:560px){
  .wrap{padding:16px 12px}
  .weekbar h2{font-size:13px}
  .days{gap:3px;margin:10px 0 14px}
  .day{padding:6px 1px;gap:3px}
  .day .dn{font-size:9.5px;letter-spacing:.02em}
  .day .dd{font-size:14px}
  .sess .grab{gap:7px}
  .sess .pill{padding:3px 6px;font-size:11.5px}
  .sess .tag{display:none}
  .sess .title{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3;font-size:14px}
  .sess .row{min-height:48px}
  .sess .body{padding:4px 12px 14px 16px}
  .sess .tick,.sess .more{width:40px}
  .card{padding:14px}
  .selfcheck .q{min-width:0;flex-basis:100%}
  .kpi .v{font-size:23px}
  .nav button{font-size:10px}
  .cardadd{grid-template-columns:1fr;gap:5px}
  .rq{padding:7px 8px;font-size:13.5px}
  .knowbar .btn{width:100%}
  .examrow input{flex:1}
  .ed-row.topic{grid-template-columns:4.5em 1fr 4em auto}
}
@media (max-width:420px){
  .day .dn{font-size:8.5px}
  .day .marks{display:none}
  .sess .bar{margin-right:8px}
  .weekbar #printwk{display:none}
  .nav button{font-size:9.5px;padding:8px 2px 9px}
}

/* walkthrough */
.walk{padding:22px}
.walkhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wcode{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:12px}
.wbtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.wbtns .btn{flex:1 1 200px}
.wsub{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.wsub button{color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.wsub button:hover{color:var(--accent)}

.weekbar button{flex:none}
.weekbar .wbtn{width:auto;padding:0 12px;font-size:13px;font-weight:600;white-space:nowrap}
.wk .wd>div{min-width:0}
.wk .ws{max-width:100%}
.tside .card{overflow:hidden}
.dayplan .note{font-size:13px}
.dayplan .note details{margin-top:4px}
.dayplan .note summary{cursor:pointer;font-weight:600;color:var(--warn)}
.dayplan .note summary::-webkit-details-marker{display:none}
.dayplan .note summary::before{content:"How to fix it ›";}
.dayplan .note details[open] summary::before{content:"How to fix it ⌄";}
.dayplan .note details p{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}

/* profiles */
.top{position:sticky;top:0;z-index:9;background:rgba(19,19,20,.72);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1240px;margin:0 auto;padding:0 20px;height:44px}
.top .brand{font-family:var(--display);font-weight:650;font-size:13.5px;letter-spacing:-.01em;color:var(--ink-2)}
.who{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600}
.who:hover{background:var(--raised)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:#6b7280;flex:none;letter-spacing:.02em}
.av.h0{background:#2563EB}.av.h1{background:#7C3AED}.av.h2{background:#E4600C}.av.h3{background:#0B9A63}.av.h4{background:#DB2777}.av.h5{background:#A21CAF}.av.h6{background:#B45309}.av.h7{background:#15803D}.av.h8{background:#0E7490}.av.h9{background:#4338CA}.av.h10{background:#BE123C}.av.h11{background:#4D7C0F}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.pk{background:radial-gradient(640px 240px at 15% -30%,var(--glow-a),transparent 62%),radial-gradient(520px 240px at 95% -20%,var(--glow-b),transparent 62%),var(--surface);border:1px solid var(--line-2);border-radius:24px;width:min(100%,460px);max-height:calc(100vh - 40px);overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.pkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pkhead h2{font-size:20px}
.pklist{display:grid;gap:6px}
.pkrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);text-align:left;width:100%;background:var(--surface2)}
.pkrow:hover{border-color:var(--line-3);background:var(--raised)}
.pkrow.cur{border-color:var(--accent);background:var(--accent-soft)}
.pkrow .av{width:36px;height:36px;font-size:14px}
.pkrow .nm{flex:1;font-weight:650;font-size:15px;min-width:0}
.pkrow .lock{font-size:13px}
.pkpin{display:flex;gap:7px;padding:2px 0 6px 60px}
.pkpin input{width:auto;flex:1;font-family:var(--mono);letter-spacing:.2em}
.pkform{display:grid;gap:6px}
.pkform .ed-lbl{margin-top:6px}
.pkfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.pkmsg{margin:10px 0 0;font-size:13.5px;color:var(--bad);word-break:break-word}
.pkmsg.ok{color:var(--good)}
.pklist.manage{gap:0}
.pkman{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.pkman:first-child{border-top:0}
.pkman .nm{font-weight:650;flex:1;min-width:120px}
.pkman .acts{display:flex;gap:5px;flex-wrap:wrap}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover{background:var(--bad-soft)}
@media (max-width:560px){.top-in{padding:0 12px}.pkpin{padding-left:0}}
@media print{.top,.overlay{display:none!important}}

/* mistakes log */
.mist{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:15px;background:var(--sunken)}
.mist>summary{cursor:pointer;padding:10px 13px;display:flex;align-items:center;gap:9px;list-style:none}
.mist>summary::-webkit-details-marker{display:none}
.mist>summary::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
.mist[open]>summary::after{transform:rotate(-135deg)}
.mist>p{padding:0 13px 10px}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:8px 13px;border-top:1px solid var(--line);font-size:13.5px}
.mrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--good);margin-top:2px;flex:none}
.mrow>div{flex:1;min-width:0}
.mrow .mt{font-weight:500;line-height:1.4}
.mrow .mm{font-size:12px;color:var(--muted);margin-top:2px}
.mrow.fixed .mt{color:var(--muted);text-decoration:line-through}
.mrow .icon{width:26px;height:26px;font-size:13px}
.card>.mrow{padding-left:0;padding-right:0}
.card>.mrow:first-of-type{border-top:0}
.madd{display:flex;gap:6px;padding:10px 13px 4px;border-top:1px solid var(--line)}
.madd input{font-size:13px;padding:7px 9px}
.mquick{display:flex;gap:6px;margin:0 0 12px}
.mquick input{font-size:13px;padding:7px 9px}
.mquickrow{display:grid;gap:6px;margin-top:10px}
.mquickrow .pill{justify-self:start}
.lasttime{border-left:3px solid var(--bad);background:var(--bad-soft);border-radius:var(--r-sm);padding:9px 12px;margin:0 0 12px;font-size:13.5px}
.lasttime b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--bad);margin-bottom:4px}
.lasttime ul{margin:0;padding-left:18px}
.lasttime li{margin:2px 0;color:var(--ink-2)}
@media (max-width:560px){.madd,.mquick{flex-wrap:wrap}.madd .btn,.mquick .btn{width:100%}}

/* quote bank */
.qbhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qbform{margin-bottom:14px}
.qbgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:6px;margin-bottom:6px}
.qbform textarea{min-height:58px;font-size:15px}
.tchips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tchip{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface2);color:var(--ink-2);line-height:1.3}
.tchip:hover{border-color:var(--line-3);background:var(--raised)}
.tchip.on{background:var(--solid);color:var(--solid-ink);border-color:var(--solid)}
.tchip.zero{color:var(--muted);border-style:dashed}
.tchip.on.zero{color:var(--solid-ink);border-style:solid}
.qm .tchip{padding:1px 7px;font-size:11.5px;margin:0 2px 2px 0}
.tmore{margin-top:6px}
.tmore>summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;margin-bottom:5px}
.tmore>summary::-webkit-details-marker{display:none}
.tmore>summary::before{content:"+ "}
.tmore[open]>summary::before{content:"– "}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type,.sect+.qrow{border-top:0}
.qrow>div:first-child{flex:1;min-width:0}
.qrow .qq,.reveal .qq{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.35}
.qrow .qm,.reveal .qm{font-size:12.5px;color:var(--muted);margin-top:3px}
.qrow .qn,.reveal .qn{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.qbtns{display:flex;gap:5px;align-items:center;flex:none}
.qbtns .icon{width:28px;height:28px;font-size:13px}
.qbtns .icon[data-qbedit]:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.gap{font-family:var(--mono);letter-spacing:.08em;color:var(--accent);border-bottom:2px solid var(--accent);line-height:1}
.cloze{font-weight:600}
.reveal{border-left:3px solid var(--good);background:var(--good-soft);border-radius:var(--r-sm);padding:9px 12px;margin:0 0 12px}
.qcard .f .gap{font-size:13px}
@media (max-width:560px){.qbgrid{grid-template-columns:1fr}}
.printquotes{display:none}
@media print{
  .qbscreen{display:none!important}
  .printquotes{display:block}
  .printquotes h1{font-size:16pt;margin:0 0 8px}
  .printquotes h3{font-size:12pt;margin:12px 0 4px;border-bottom:1px solid #000;padding-bottom:2px}
  .printquotes h3 span{font-weight:400;color:#555;font-size:10pt}
  .pq{padding:3px 0;break-inside:avoid}
  .pqq{font-weight:700;font-size:11pt}
  .pqq span{font-weight:400;color:#555;font-size:10pt}
  .pqm{font-size:9.5pt;color:#333;padding-left:14px}
}

/* lessons */
.lesson{max-width:100%;position:relative}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.lhead .wcode{margin-top:0}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}

</div></nav>

<script src="katex/katex.min.js"></script>
<script>
/* ---------- PLAN (built by the Rust backend, see src-tauri/src/plan.rs) ---------- */
const invoke=(cmd,args)=>window.__TAURI__.core.invoke(cmd,args);
let SUBJECTS={},SUBJ_IDS=[],WEEKS=[],TOTAL=0,TESTS=[],TEST_BY_WEEK={},TOPIC_DUE={};
let REVIEW_GAPS=[7,21,56],EXAM_START="2028-05-08",UNSCHEDULED=[];
function applyPlan(plan){
  SUBJECTS={};const byId={};
  plan.subjects.forEach(s=>{const topics=s.topics.map(t=>{const a=[t.code,t.title,t.hours];a.id=t.id;a.subj=t.subj;a.idx=t.idx;a.url=t.url||"";a.objectives=t.objectives||[];a.watch=t.watch||"";a.videos=t.videos||[];a.statements=t.statements||[];a.lesson=!!t.lesson;byId[t.id]=a;return a;});
    SUBJECTS[s.id]={name:s.name,full:s.full,color:s.color,papers:s.papers,spec:s.spec,sections:s.sections,topics,contentEndsWeek:s.contentEndsWeek,resources:s.resources||[],specRefs:s.specRefs||[],pace:s.pace||"ahead"};});
  SUBJ_IDS=plan.subjects.map(s=>s.id);
  WEEKS=plan.weeks.map(w=>{const plan2={};for(const s of SUBJ_IDS){plan2[s]=(w.plan[s]||[]).map(e=>e.kind==="topic"?{kind:"topic",topic:byId[e.topicId],hours:e.hours,partNo:e.partNo,parts:e.parts,final:e.final}:(e.kind==="fixed"?{kind:"fixed",label:e.label,hours:e.hours,note:e.note}:{kind:"rev",section:e.section,hours:e.hours}));}
    return {n:w.n,start:new Date(w.start+"T00:00:00"),type:w.type,label:w.label,year:w.year,block:w.block,last:w.last,first:w.first,termWeek:w.termWeek,plan:plan2};});
  TOTAL=WEEKS.length;TESTS=plan.tests;TEST_BY_WEEK={};TESTS.forEach(t=>(TEST_BY_WEEK[t.week]=TEST_BY_WEEK[t.week]||[]).push(t));
  TOPIC_DUE=plan.topicDue;REVIEW_GAPS=plan.reviewGaps||REVIEW_GAPS;EXAM_START=plan.examStart||EXAM_START;UNSCHEDULED=plan.unscheduled||[];
}
const DAYN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const fmt=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmtLong=d=>d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};

/* ---------- DAYS: turn a week's plan into sessions per day ---------- */
const secName=l=>String(l).replace(/^[0-9][0-9A-Za-z_.]*\s+/,"");

const mins=h=>Math.max(15,Math.round(h*60/15)*15);
const fmtMins=m=>m>=60?`${Math.floor(m/60)}h${m%60?" "+String(m%60).padStart(2,"0"):""}`:`${m} min`;
/* A session key names its week, subject and slot, so a moved session can be
   rebuilt from the week it came from. */
function itemFromKey(key){
  if(key.startsWith("s:")){const[,wn,subj,j]=key.split(":");const w=WEEKS[+wn-1];if(!w||!w.plan[subj])return null;const e=w.plan[subj][+j];if(!e)return null;return {kind:e.kind,subj,entry:e,key,srcWeek:+wn};}
  if(key.startsWith("test:")){const t=TESTS.find(x=>"test:"+x.id===key);return t?{kind:"test",test:t,key,srcWeek:t.week}:null;}
  if(key.startsWith("flash:")){return {kind:"flash",key,srcWeek:+key.split(":")[1]};}
  return null;}
function baseDays(w){
  const days=Array.from({length:7},(_,i)=>({i,date:addDays(w.start,i),items:[]}));
  if(w.type==="exam"){days.forEach(d=>d.items.push({kind:"exam"}));return days;}
  const sessions=[];SUBJ_IDS.forEach(s=>w.plan[s].forEach((e,j)=>sessions.push({kind:e.kind,subj:s,entry:e,key:`s:${w.n}:${s}:${j}`,srcWeek:w.n})));
  if(w.type==="term"||w.type==="summer"){
    // Fixed sessions (the timed piece) take Monday; everything else is spread
    // round-robin over Monday to Saturday so no single day is swamped.
    const fixed=sessions.filter(s=>s.kind==="fixed"),rest=sessions.filter(s=>s.kind!=="fixed");
    fixed.forEach(s=>days[0].items.push(s));
    rest.forEach((ss,i)=>days[i%6].items.push(ss));
    (TEST_BY_WEEK[w.n]||[]).forEach(t=>days[5].items.push({kind:"test",test:t,key:"test:"+t.id,srcWeek:w.n}));
    if(w.type==="term")days[6].items.push({kind:"flash",key:`flash:${w.n}`,srcWeek:w.n});
  }else{
    days[0].items.push({kind:"catchup"});
    (TEST_BY_WEEK[w.n]||[]).forEach(t=>days[1].items.push({kind:"test",test:t,key:"test:"+t.id,srcWeek:w.n}));
  }
  return days;}
function buildDays(w){
  const days=baseDays(w);
  if(w.type==="exam")return days;
  // Apply moves out of this week and within it, and skips.
  days.forEach(d=>{d.items=d.items.filter(it=>{if(!it.key)return true;const mv=state.moves[it.key];if(mv&&mv.week!==w.n)return false;return true;});});
  const within=[];
  days.forEach(d=>{d.items=d.items.filter(it=>{const mv=it.key&&state.moves[it.key];if(mv&&mv.week===w.n&&mv.day!==d.i){within.push({it,from:d.i,to:mv.day});return false;}return true;});});
  within.forEach(({it,from,to})=>{it.movedFrom=DAYN[from];days[to].items.push(it);});
  // Moves into this week from another.
  Object.entries(state.moves).forEach(([key,mv])=>{if(mv.week!==w.n)return;const it=itemFromKey(key);if(!it||it.srcWeek===w.n)return;it.movedFrom=`week ${it.srcWeek}`;days[Math.min(6,mv.day)].items.push(it);});
  days.forEach(d=>d.items.forEach(it=>{if(it.key&&state.skips[it.key])it.skipped=true;}));
  return days;}
function dayMinutes(d){return d.items.filter(it=>!it.skipped).reduce((n,it)=>n+(it.entry?mins(it.entry.hours):(it.test?it.test.mins:(it.kind==="flash"?30:0))),0);}
function dayCounts(d){const live=d.items.filter(it=>!it.skipped&&it.key);return {n:live.length,done:live.filter(itemDone).length};}

/* ---------- STATE ---------- */
const BLANK={topics:{},tests:{},sessions:{},reviews:{},days:{},stmts:{},inbox:{},moves:{},skips:{},cards:{},mistakes:{},examDates:{},quotes:[],lessonQ:{},lessonNotes:{},topicTests:{},papers:{}};
let state={...BLANK};
let LS="grade9-tracker-v2";
let saveTimer=null;
function persist(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const el=document.getElementById("sync");
    try{await window.tracker.save(state);el.textContent="Saved";}catch(e){el.textContent="Couldn't save to file — progress kept in this window only";}},300);}
/* mark: null = not judged, "got" = could do it unaided, "shaky" = couldn't.
   known: ticked as already covered (by school, or before the app) rather than
   worked through here — it skips the content schedule and goes straight to review. */
const T=id=>state.topics[id]||(state.topics[id]={done:false,mark:null,fixed:false});
const TS=id=>state.tests[id]||(state.tests[id]={marks:{},fixed:{}});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function todayWeek(){const now=new Date();let best=WEEKS[0];for(const w of WEEKS){if(w.start<=now)best=w;}return best.n;}
function todayIndex(w){const diff=Math.floor((new Date()-w.start)/86400000);return diff>=0&&diff<7?diff:-1;}
function findTopic(id){for(const s of SUBJ_IDS){const t=SUBJECTS[s].topics.find(t=>t.id===id);if(t)return t;}return null;}
const isSchool=s=>SUBJECTS[s]&&SUBJECTS[s].pace==="school";

/* ---------- STREAK — the only thing being counted ---------- */
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;};
const todayISO=()=>iso(new Date());
function markDay(){state.days[todayISO()]=true;}
function streak(){let n=0,d=new Date();
  if(!state.days[iso(d)])d=addDays(d,-1);
  while(state.days[iso(d)]){n++;d=addDays(d,-1);}
  return n;}
/* The first exam is the earliest date you have written in, else the start of
   the exam block in the calendar. */
function firstExam(){const set=Object.values(state.examDates||{}).filter(Boolean).sort();return set[0]||EXAM_START;}
const daysToExams=()=>Math.max(0,Math.round((new Date(firstExam()+"T00:00:00")-new Date())/86400000));

/* ---------- WHAT NEEDS REDOING ---------- */
function fixList(){const items=[];
  Object.entries(state.topics).forEach(([id,t])=>{if(t.done&&t.mark==="shaky"&&!t.fixed){const tp=findTopic(id);if(tp)items.push({key:"t:"+id,label:`${SUBJECTS[tp.subj].name}: ${tp[1]}`});}});
  Object.entries(state.tests).forEach(([id,t])=>{const test=TESTS.find(x=>x.id===id);if(!test)return;Object.entries(t.marks||{}).forEach(([s,v])=>{if(v==="shaky"&&!(t.fixed||{})[s]&&SUBJECTS[s])items.push({key:"s:"+id+":"+s,label:`${SUBJECTS[s].name}: ${test.title}, week ${test.week}`});});});
  return items;}
function toggleFix(key){const item=fixList().find(f=>f.key===key);
  if(key.startsWith("t:"))T(key.slice(2)).fixed=true;else{const[,id,s]=key.split(":");const ts=TS(id);ts.fixed=ts.fixed||{};ts.fixed[s]=true;}
  if(item)scheduleReview(key,item.label);
  markDay();persist();render();}

/* ---------- SPACED REPETITION ----------
   Anything cleared off the fix list, and anything ticked as already known,
   comes back after 1 week, then 3, then 8, to prove it stuck. */
/* No more than a few checks land on any one day: ticking a whole section as
   known would otherwise dump every one of them on the same morning. */
const PER_DAY=3;
function stagger(date,skipKey){let d=new Date(date);
  for(let i=0;i<60;i++){const day=iso(d);const n=Object.entries(state.reviews).filter(([k,r])=>k!==skipKey&&r.due===day).length;if(n<PER_DAY)return day;d=addDays(d,1);}
  return iso(d);}
function scheduleReview(key,label){
  const r=state.reviews[key]||{stage:0};
  r.label=label;
  r.due=stagger(addDays(new Date(),REVIEW_GAPS[Math.min(r.stage,REVIEW_GAPS.length-1)]),key);
  state.reviews[key]=r;}
function dueReviews(){const t=todayISO();return Object.entries(state.reviews).filter(([,r])=>r.due<=t).map(([key,r])=>({key,...r}));}
function passReview(key){const r=state.reviews[key];if(!r)return;
  r.stage++;
  if(r.stage>=REVIEW_GAPS.length)delete state.reviews[key];
  else r.due=stagger(addDays(new Date(),REVIEW_GAPS[r.stage]),key);
  if(key.startsWith("t:")){const t=T(key.slice(2));t.gaps=[];}
  delete recallMarks[key];markDay();persist();render();}
function failReview(key){const r=state.reviews[key];if(!r)return;
  r.stage=0;r.due=stagger(addDays(new Date(),REVIEW_GAPS[0]),key);
  // A failed recall on a topic is a real gap: it goes on the fix list too.
  if(key.startsWith("t:")){const t=T(key.slice(2));t.done=true;t.mark="shaky";t.fixed=false;
    const m=recallMarks[key]||{};t.gaps=Object.entries(m).filter(([,v])=>v===false).map(([i])=>+i);
    const tp=findTopic(key.slice(2));if(tp)t.gaps.forEach(i=>addMistake(tp.id,tp.objectives[i],"recall"));
    const inp=document.querySelector(`[data-mquick="${CSS.escape(key.slice(2))}"]`);if(inp)addMistake(key.slice(2),inp.value,"recall");}
  delete recallMarks[key];markDay();persist();render();}

function itemDone(it){if(it.kind==="topic")return !!state.sessions[it.key]||T(it.entry.topic.id).done;
  if(it.kind==="test"){const live=it.test.subjects.filter(s=>SUBJECTS[s]);return live.length>0&&live.every(s=>TS(it.test.id).marks[s]!=null);}
  return !!state.sessions[it.key];}
function itemColor(it){return it.subj&&SUBJECTS[it.subj]?SUBJECTS[it.subj].color:(it.kind==="test"?"var(--test)":"var(--rest)");}

/* ---------- LINKS OUT ---------- */
const SHOWN=3;
const openLinks=new Set();
function linkBar(subj,topic,showAll){
  const S=SUBJECTS[subj];if(!S)return "";
  const all=showAll||openLinks.has(subj);
  const rs=all?S.resources:S.resources.slice(0,SHOWN);
  const hidden=S.resources.length-rs.length;
  let html=`<div class="links">`;
  if(topic&&topic.url)html+=`<a class="btn small go" href="${esc(topic.url)}">Open this topic ↗</a>`;
  html+=rs.map(r=>`<a class="btn small" href="${esc(r.url)}">${esc(r.label)} ↗</a>`).join("");
  if(hidden>0)html+=`<button class="btn small" data-morelinks="${esc(subj)}">+${hidden} more</button>`;
  if(topic)html+=`<button class="btn small" data-pin="${esc(topic.id)}">${topic.url?"Change link":"Pin exact link"}</button>`;
  return html+`</div>`;}

/* ---------- SPECIFICATION CHECKLIST ---------- */
const openStmt=new Set();
const stmtKey=(topicId,code)=>topicId+"|"+code;
const stmtDone=(topicId,code)=>!!state.stmts[stmtKey(topicId,code)];
function stmtCounts(topic){const s=(topic&&topic.statements)||[];
  return {done:s.filter(x=>stmtDone(topic.id,x.code)).length,total:s.length};}
function stmtBlock(topic){
  const s=(topic&&topic.statements)||[];if(!s.length)return "";
  const c=stmtCounts(topic);
  return `<details class="stmts" data-stmtbox="${esc(topic.id)}" ${openStmt.has(topic.id)?"open":""}><summary><span class="eyebrow">Specification checklist</span><span class="chip ${c.done===c.total?"ok":""}">${c.done} of ${c.total}</span></summary>
    <ul>`+s.map(x=>`<li><label><input type="checkbox" data-stmt="${esc(stmtKey(topic.id,x.code))}" ${stmtDone(topic.id,x.code)?"checked":""}><span class="sc">${esc(x.code)}</span><span>${esc(x.label)}</span></label></li>`).join("")+`</ul>
    <p class="muted" style="font-size:12.5px;margin:8px 0 0">${topic.subj==="maths"?"Every lettered statement the specification makes for this topic. <b>F</b> is Foundation content and <b>H</b> is Higher — you are examined on both.":topic.subj==="econ"?"Every numbered sub-point the Cambridge syllabus lists for this topic, in its own numbering.":topic.subj==="bus"?"Every outcome AQA lists for this subsection. AQA does not number them, so the letters are this app's, in the order the specification gives them.":topic.subj==="cs"?"Every bullet point OCR lists under this sub-topic. OCR does not number them, so the letters are this app's, in the specification's order - but the count was read from the document.":topic.subj==="fpm"?"Every lettered statement the specification makes for this section, in Pearson's own lettering.":`Every numbered statement the specification makes for this topic. A <b>${{bio:"B",chem:"C",phys:"P"}[topic.subj]||"B, C or P"}</b> suffix marks separate-science-only content — Double Award students skip it; <b>you do it</b>.`} The exact wording is in the <a href="${esc((SUBJECTS[topic.subj]||{}).spec||"")}">official specification ↗</a>.</p></details>`;}

function objBlock(topic){
  if(!topic)return "";
  let html="";const gaps=new Set((T(topic.id).gaps)||[]);
  if(topic.objectives&&topic.objectives.length)
    html+=`<div class="obj"><div class="eyebrow">By the end you should be able to</div><ul>`+topic.objectives.map((o,i)=>`<li class="${gaps.has(i)?"gap":""}">${esc(o)}${gaps.has(i)?` <span class="mark shaky">gap</span>`:""}</li>`).join("")+`</ul></div>`;
  if(topic.watch)html+=`<div class="watch"><b>Watch out</b><span>${esc(topic.watch)}</span></div>`;
  return html;}
function pinRow(topic){
  if(!topic||pinning!==topic.id)return "";
  return `<div class="pinrow"><input type="url" id="pinurl" placeholder="Paste the Save My Exams page for this topic" value="${esc(topic.url||"")}"><button class="btn primary small" data-pinsave="${esc(topic.id)}">Save</button></div>`;}

/* ---------- YOUR OWN CARDS ----------
   Quote → technique → effect for a poem, a formula, a definition. You write
   them; the app quizzes you on them whenever the topic comes up for review.
   Writing the card is most of the learning, which is why none are pre-filled. */
const openCards=new Set(),revealed=new Set();
const cardsOf=id=>state.cards[id]||[];
function cardBlock(topic){
  const cs=cardsOf(topic.id);
  return `<details class="cards" data-cardbox="${esc(topic.id)}" ${openCards.has(topic.id)?"open":""}><summary><span class="eyebrow">Your cards</span><span class="chip">${cs.length}</span></summary>
    ${cs.map((c,i)=>`<div class="cardrow"><div><div class="f">${esc(c.f)}</div><div class="b">${esc(c.b)}</div></div><button class="icon" data-delcard="${esc(topic.id)}|${i}" aria-label="Delete card">×</button></div>`).join("")}
    <div class="cardadd"><input type="text" data-cardf="${esc(topic.id)}" placeholder="${topic.subj==="englit"?"Front — a short quote, 3 to 5 words":"Front — the prompt"}"><input type="text" data-cardb="${esc(topic.id)}" placeholder="${topic.subj==="englit"?"Back — technique, and what it does to the reader":"Back — the answer"}"><button class="btn small" data-addcard="${esc(topic.id)}">Add</button></div>
    <p class="muted" style="font-size:12.5px;margin:6px 0 0">Keep the front short. Cards come up in this topic's recall checks, front first.</p></details>`;}
function quizCards(id){const cs=cardsOf(id);if(!cs.length)return "";
  return `<div class="quiz">`+cs.map((c,i)=>{const k=id+"|"+i,on=revealed.has(k);return `<button class="qcard ${on?"open":""}" data-flip="${esc(k)}"><span class="f">${esc(c.f)}</span>${on?`<span class="b">${esc(c.b)}</span>`:`<span class="hint">tap to reveal</span>`}</button>`;}).join("")+`</div>`;}

/* ---------- MISTAKES LOG ----------
   What actually went wrong, per topic, so it is in front of you the next time
   the topic comes round. Fed three ways: a recall check marked "some gaps"
   logs each objective you could not do; a session or test marked shaky asks
   what dropped the marks; and you can write one under any topic at any time.
   A mistake stays open until you tick it fixed. */
const mistakesOf=key=>state.mistakes[key]||[];
const openMistakes=key=>mistakesOf(key).filter(m=>!m.fixed);
function addMistake(key,text,src,ref){const t=String(text||"").trim();if(!t)return false;
  const list=(state.mistakes[key]=state.mistakes[key]||[]);
  if(list.some(m=>!m.fixed&&m.text===t))return false;
  const m={t:todayISO(),text:t,src:src||"manual",fixed:false};if(ref)m.ref=ref;list.push(m);return true;}
/* Every open mistake in a subject, topic-level and subject-level, newest first. */
function subjectMistakes(subj){const out=[];
  SUBJECTS[subj].topics.forEach(t=>openMistakes(t.id).forEach((m,i)=>out.push({key:t.id,i:mistakesOf(t.id).indexOf(m),m,label:t[1],code:t[0]})));
  openMistakes("subj:"+subj).forEach(m=>out.push({key:"subj:"+subj,i:mistakesOf("subj:"+subj).indexOf(m),m,label:"Tests and papers",code:""}));
  return out.sort((a,b)=>(inReview(a.m)?1:0)-(inReview(b.m)?1:0)||b.m.t.localeCompare(a.m.t));}
/* "Open" means still broken. A mistake that has survived at least one re-test
   is holding, counted apart, so the headline number is what needs work. */
const openMistakeCount=()=>Object.values(state.mistakes).reduce((n,l)=>n+l.filter(m=>!m.fixed&&!inReview(m)).length,0);
const reviewMistakeCount=()=>Object.values(state.mistakes).reduce((n,l)=>n+l.filter(m=>inReview(m)).length,0);
const srcLabel={recall:"recall check",test:"test",session:"session",manual:"note",lesson:"lesson"};
function mistakeRow(key,i,m,label){
  return `<div class="mrow ${m.fixed?"fixed":""}"><input type="checkbox" data-mfix="${esc(key)}|${i}" ${m.fixed?"checked":""} aria-label="Fixed"><div><div class="mt">${esc(m.text)}</div><div class="mm">${label?`${esc(label)} · `:""}${fmt(new Date(m.t+"T00:00:00"))} · ${srcLabel[m.src]||m.src}${fixNote(m)}</div></div><button class="icon" data-mdel="${esc(key)}|${i}" aria-label="Delete">×</button></div>`;}
const openMist=new Set();
function mistakeBlock(key,placeholder){
  const all=mistakesOf(key),live=all.filter(m=>!m.fixed),hold=live.filter(inReview),open=live.filter(m=>!inReview(m));
  return `<details class="mist" data-mistbox="${esc(key)}" ${openMist.has(key)||live.length?"open":""}><summary><span class="eyebrow">Mistakes</span><span class="chip ${open.length?"bad":""}">${open.length?`${open.length} open`:(hold.length?`${hold.length} holding`:(all.length?"all fixed":"none"))}</span></summary>
    ${all.map((m,i)=>mistakeRow(key,i,m,"")).join("")}
    <div class="madd"><input type="text" data-mtext="${esc(key)}" placeholder="${esc(placeholder||"What went wrong? Be specific: the exact step, the exact mistake")}" maxlength="240"><button class="btn small" data-madd="${esc(key)}">Log it</button></div>
    <p class="muted" style="font-size:12.5px;margin:6px 0 0">Tick a mistake when you have fixed it. Open ones show up the next time this topic comes round; ones a test or a paper logged bring their own question back, at ${FIX_GAP_WORDS} days.</p></details>`;}
/* Shown at the top of a recall check: what went wrong last time. */
function lastTimeBlock(key){const open=openMistakes(key).filter(m=>!inReview(m));if(!open.length)return "";
  return `<div class="lasttime"><b>Last time you got wrong</b><ul>${open.map(m=>`<li>${esc(m.text)}</li>`).join("")}</ul></div>`;}
function bindMistakes(root){
  root.querySelectorAll("[data-mistbox]").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)openMist.add(d.dataset.mistbox);else openMist.delete(d.dataset.mistbox);}));

/* ---------- RECALL CHECKS ----------

const recallMarks={};

    body=(topicId?lastTimeBlock(topicId)+lessonNoteBlock(topicId):"")+`<div class="recall">`+tp.objectives.map((o,i)=>`<div class="rq ${m[i]===true?"yes":(m[i]===false?"no":"")}"><span>${esc(o)}</span><span class="yn"><button data-rq="${esc(r.key)}|${i}|1" aria-label="Can do">✓</button><button data-rq="${esc(r.key)}|${i}|0" aria-label="Cannot">✗</button></span></div>`).join("")+`</div>`+quizCards(topicId)+quoteCards(topicId);

/* ---------- YOUR DAY ----------
   Read out of classic Outlook by the Rust side (src-tauri/src/outlook.rs) and
   sifted by rules, not a model (src-tauri/src/today.rs): the timetable, the
   gaps between lessons, deadlines found in teachers' emails, and requests
   with no date. Nothing leaves the machine. */
let DAY=null,DAY_ERR=null,DAY_BUSY=false,ORG_BUSY=false,ORG_SEQ=0,showDoneInbox=false,showAllAsks=false;
const DAY_START=7*60,DAY_END=21*60+30,MIN_SLOT=30,AFTER_SCHOOL=15*60+30,SHOW_AHEAD_DAYS=14,ASKS_SHOWN=4;
// Microsoft Teams assignments, synced in by the browser extension (teams_server.rs).
let TEAMS_ASG=[];
const TEAMS_STALE_DAYS=30;   // hide work due more than a month ago — last term's leftovers Teams never drops
function mapTeams(items){
  const cutoff=Date.now()-TEAMS_STALE_DAYS*864e5;
  return (items||[]).map(t=>{
    const submitted=t.turnedIn||t.completed||t.submission==="submitted"||t.submission==="returned"||t.submission==="excused";
    const links=[]; if(t.webUrl)links.push({label:"Open in Teams",url:t.webUrl});
    const due=t.due?String(t.due).slice(0,10):null;
    return {id:"teams:"+t.id, title:(t.title||"Assignment").trim(), course:"",
      due, description:(t.instructions||"").trim(),
      links, unread:false, teams:true, submitted};
  }).filter(a=>{
    if(!a.id||a.submitted)return false;       // outstanding only; submitted ones drop off
    if(a.due){const d=Date.parse(a.due+"T23:59:59");if(!isNaN(d)&&d<cutoff)return false;}  // drop stale last-term work
    return true;
  }).sort((a,b)=>(a.due||"9999-99-99").localeCompare(b.due||"9999-99-99"));   // soonest first
}
async function loadTeams(){ try{const t=await invoke("teams_assignments");TEAMS_ASG=mapTeams(t&&t.items);}catch(e){TEAMS_ASG=[];} }
// The sync lands while you're in Chrome, so re-read it when you come back to the
// app — otherwise Your day keeps showing the list from when the app started.
async function teamsOnReturn(){
  const before=JSON.stringify(TEAMS_ASG);
  await loadTeams();
  if(view==="today"&&JSON.stringify(TEAMS_ASG)!==before)render();
}
window.addEventListener("focus",teamsOnReturn);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)teamsOnReturn();});
async function loadDay(refresh){
  loadTeams().then(()=>{if(view==="today")render();});   // Teams sync is independent of Outlook
  if(DAY_BUSY||settings.outlook===false)return;
  DAY_BUSY=true;if(view==="today")render();
  try{DAY=await invoke("day_context",{refresh});DAY_ERR=DAY.error||null;}
  catch(e){DAY_ERR=String(e);}
  DAY_BUSY=false;if(view==="today")render();
  organiseDay();
}
/* The now/later split is already shown (built from the dates). This asks the
   local model, in the background, to reword each line — slow and optional, so
   it never blocks the day. A sequence guard drops a stale reply if the day was
   reloaded meanwhile. */
async function organiseDay(){
  if(!settings.aiOrganise||!DAY||DAY.error||!DAY.organised)return;
  const seq=++ORG_SEQ;ORG_BUSY=true;if(view==="today")render();
  let org=null;try{org=await invoke("organise_day");}catch(e){}
  if(seq!==ORG_SEQ)return;                 // a newer load superseded this one
  ORG_BUSY=false;
  if(org&&DAY)DAY.organised=org;
  if(view==="today")render();
}
const hhmm=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const minsOf=d=>d.getHours()*60+d.getMinutes();
const dur=m=>m>=60?(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${m/60}h`):`${m}m`;
/* Events that touch the day, clipped to it, in minutes from midnight. */
function eventsOn(date){
  const d0=new Date(date);d0.setHours(0,0,0,0);const d1=addDays(d0,1);
  return (DAY?DAY.events:[]).map(e=>({...e,s:new Date(e.start),e:new Date(e.end)})).filter(e=>e.s<d1&&e.e>d0)
    .map(e=>({...e,sm:e.s<d0?0:minsOf(e.s),em:e.e>=d1?1440:minsOf(e.e)})).sort((a,b)=>a.sm-b.sm);}
/* The gaps: between lessons, from now if it is today, until DAY_END. */
function freeSlots(evs,isToday){
  let curM=DAY_START;if(isToday)curM=Math.max(curM,Math.ceil(minsOf(new Date())/5)*5);
  const slots=[];
  for(const x of evs.filter(e=>!e.allDay)){if(x.sm-curM>=MIN_SLOT)slots.push({s:curM,e:x.sm});curM=Math.max(curM,x.em);}
  if(DAY_END-curM>=MIN_SLOT)slots.push({s:curM,e:DAY_END});
  return slots;}
/* How long the day's unfinished sessions add up to. */
function needMinutes(d){return d.items.filter(it=>!it.skipped&&!itemDone(it)).reduce((n,it)=>n+(it.entry?mins(it.entry.hours):(it.test?it.test.mins:(it.kind==="flash"?30:0))),0);}
/* First gap after school that fits, else the first that fits, else the longest. */
function bestSlot(slots,need){if(!slots.length||!need)return null;
  return slots.find(x=>x.e-x.s>=need&&x.s>=AFTER_SCHOOL)||slots.find(x=>x.e-x.s>=need)||slots.reduce((a,b)=>b.e-b.s>a.e-a.s?b:a);}
function whenLabel(dateISO){
  const t=new Date(todayISO()+"T00:00:00"),d=new Date(dateISO+"T00:00:00");const n=Math.round((d-t)/86400000);
  if(n<0)return {cls:"over",text:`Overdue · ${fmt(d)}`};
  if(n===0)return {cls:"soon",text:"Today"};
  if(n===1)return {cls:"soon",text:"Tomorrow"};
  if(n<7)return {cls:"",text:DAYN[(d.getDay()+6)%7]};
  return {cls:"",text:fmt(d)};}
const srcName={flag:"flagged",email:"email",calendar:"calendar",task:"task"};
/* The email behind an item. "✉ email" opens it inline from the copy kept with

   real message in Outlook. Items point at it by id: mail:<EntryID> / flag:<EntryID>. */
const OPEN_MAILS=new Set();
const mailEntry=id=>{const m=/^(?:mail|flag):(.+)$/.exec(id||"");return m?m[1]:null;};
function mailBtn(id){const e=mailEntry(id);if(!e||!DAY||!DAY.emails||!DAY.emails[e])return "";const on=OPEN_MAILS.has(id);
  return `<button type="button" class="mailbtn" data-mail="${esc(id)}" aria-expanded="${on}" title="${on?"Hide the email":"Show the email this came from"}">✉ email</button>`;}
function mailView(id){if(!OPEN_MAILS.has(id))return "";const eid=mailEntry(id),e=DAY&&DAY.emails&&DAY.emails[eid];if(!e)return "";
  const t=e.received?new Date(e.received):null,when=t&&!isNaN(t)?t.toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  const body=(e.body||"").trim();
  return `<div class="mailview"><div class="mh"><b>${esc(e.subject||"(no subject)")}</b><span>${esc(e.from||"")}${when?` · ${esc(when)}`:""}</span></div><div class="mb">${body?esc(body):"<i>(no text)</i>"}</div><div class="mf"><button type="button" class="btn small" data-openmail="${esc(eid)}">Open in Outlook ↗</button>${body.length>=2400?`<span class="muted">This is the start of the email — open it in Outlook for the rest.</span>`:""}</div></div>`;}
function asgSection(allAsg){

  const asg=allAsg.filter(x=>showDoneInbox||!done(x.id)),nDone=allAsg.filter(x=>done(x.id)).length;
  let h=`<div class="sec"><div style="display:flex;align-items:center;gap:8px"><span class="eyebrow">Assignments</span>${nDone?`<button class="btn small showdone" style="margin-left:auto">${showDoneInbox?"Hide done":`Show ${nDone} done`}</button>`:""}</div>`;

    return `<li class="${done(a.id)?"done":""}"><input type="checkbox" data-inbox="${esc(a.id)}" ${done(a.id)?"checked":""} aria-label="Done"><div><div class="ah">${w?`<span class="when ${w.cls}">${w.text}</span>`:""}<span class="title">${esc(a.title)}</span>${a.course?`<span class="who">· ${esc(a.course)}</span>`:""}${a.teams?`<span class="who">· Teams</span>`:""}${a.unread?`<span class="who">· unread</span>`:""}${mailBtn(a.id)}</div>${a.description?`<div class="snip">${esc(a.description)}</div>`:""}${a.links&&a.links.length?`<div class="alinks">`+a.links.map(l=>`<a class="btn small" href="${esc(l.url)}">${esc(l.label)} ↗</a>`).join("")+`</div>`:""}${mailView(a.id)}</div></li>`;}).join("")+`</ul>`;

function dayPanel(d,isToday){
  if(settings.outlook===false && !TEAMS_ASG.length)return "";

  if(DAY_ERR){const cut=DAY_ERR.indexOf(". ");const head=cut>0?DAY_ERR.slice(0,cut+1):DAY_ERR,rest=cut>0?DAY_ERR.slice(cut+2):"";
    html+=`<div class="note">${esc(head)}${DAY?" Showing the last copy.":""}${rest?`<details><summary></summary><p>${esc(rest)}</p></details>`:""}</div>`;}
  if(!DAY){html+=asgSection(TEAMS_ASG);if(!TEAMS_ASG.length)html+=`<div class="muted" style="font-size:14px">${DAY_BUSY?"Reading your calendar and inbox from Outlook…":DAY_ERR?"":"Nothing read yet."}</div>`;return html+`</div>`;}
  // timetable + gaps
  const evs=eventsOn(d.date),slots=freeSlots(evs,isToday),need=needMinutes(d),best=bestSlot(slots,need),now=isToday?minsOf(new Date()):-1;
  const rows=[];
  evs.filter(e=>e.allDay).forEach(e=>rows.push({sm:-1,html:`<div class="ev"><span class="t">all day</span><span><b>${esc(e.subject)}</b>${e.location?` <span class="loc">· ${esc(e.location)}</span>`:""}</span></div>`}));
  evs.filter(e=>!e.allDay).forEach(e=>{const past=isToday&&e.em<=now,live=isToday&&e.sm<=now&&now<e.em;
    rows.push({sm:e.sm,html:`<div class="ev ${past?"past":""} ${live?"now":""}"><span class="t">${hhmm(e.sm)}–${hhmm(e.em)}</span><span><b>${esc(e.subject)}</b>${e.location?` <span class="loc">· ${esc(e.location)}</span>`:""}</span></div>`});});
  slots.forEach(x=>{const isBest=best&&x.s===best.s;
    rows.push({sm:x.s+0.5,html:`<div class="ev free ${isBest?"best":""}"><span class="t">${hhmm(x.s)}–${hhmm(x.e)}</span><span><b>${isBest&&need?`Do your ${need} min session here`:"Free"}</b> <span class="loc">· ${dur(x.e-x.s)}</span></span></div>`});});

  // Organised by the local AI (src/ai.rs): the day triaged into "For today"
  // (due now or soon, or a fresh request) and "Later" (still days off, or a

let cur=1,curDay=null,showFix=false,pinning=null,menuKey=null;
const openSess=new Set();let autoOpenedFor="";

/* The whole week at a glance, shown beside the day on a wide window. Click a

/* Everything the week holds, on one page, for printing. */

/* One session. Collapsed to a row; the row opens to the full card. */

/* Pinning writes into the plan itself, so the link survives everything. */
async function pinLink(topicId){

/* ---------- SPEC COVERAGE ---------- */
function coversRef(code,ref){
  if(code===ref)return true;
  const rest=code.slice(ref.length);
  return code.startsWith(ref)&&rest.length>0&&/^[a-z]+$/i.test(rest);}
function coverageCard(subj){
  const S=SUBJECTS[subj];if(!S)return "";

      <p class="muted" style="font-size:13.5px;margin:8px 0 0">These topics were written from knowledge of the course, not from the specification document. Check them against the <a href="${esc(S.spec)}">official specification ↗</a>.</p></div>`;
  const rows=S.specRefs.map(r=>{const ts=S.topics.filter(t=>coversRef(t[0],r));const done=ts.filter(t=>T(t.id).done).length;return {ref:r,n:ts.length,done};});

    <div class="refs">${rows.map(r=>`<span class="ref ${r.n===0?"gap":(r.done===r.n?"full":(r.done?"part":""))}" title="${r.n===0?"No topic covers this":`${r.done} of ${r.n} topics done`}">${esc(r.ref)}</span>`).join("")}</div>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">Filled = finished, half = started, outline = still to come. Coverage is checked by a test whenever the app is built.</p></div>`;}

/* ---------- WHERE AM I UP TO? ----------

/* ---------- LESSONS ----------

   is rendered here: What it is, the method, worked examples, practice
   questions with hidden answers, and where the marks go. Maths is typeset

    if(l.startsWith("|")){flushP(buf);buf=[];const rows=[];while(i<lines.length&&lines[i].startsWith("|")){rows.push(lines[i]);i++;}

      const head=cells(rows[0]),body=rows.slice(1).filter(r=>!/^\|?\s*:?-{2,}/.test(r)).map(cells);

/* Split the file into ordinary Markdown and the four fenced block kinds. */
function parseLesson(text){const out=[];let cur=null,plain=[];

/* Paragraph groups of a block, blank-line separated. A worked example is its

/* A `::: terms` block: one "- **term**: definition" line per key term. */
function lessonTerms(lines){return lines.map(l=>l.match(/^\s*[-*]\s+\*\*(.+?)\*\*\s*:\s*(.+)$/)).filter(Boolean).map(m=>({t:m[1].trim(),d:m[2].trim()}));}
