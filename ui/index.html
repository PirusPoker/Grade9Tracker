<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 9 Tracker</title>
<style>
/* Light only, on purpose: white surfaces, hairline rules, tight corners. */
:root{
  color-scheme:light;
  --ground:#F4F5F7; --surface:#FFFFFF; --surface2:#F4F5F7; --sunken:#FAFAFB;
  --ink:#0E1013; --ink-2:#3A4048; --muted:#6C737C; --line:#E3E5E9; --line-2:#D3D7DD;
  --accent:#1B62F0; --accent-ink:#FFFFFF; --accent-soft:#EBF1FE;
  --solid:#101317; --solid-ink:#FFFFFF;
  --good:#0B7A4B; --good-soft:#E7F6EE; --bad:#CC2B2B; --bad-soft:#FDECEC; --warn:#A76500; --warn-soft:#FDF1DF;
  --maths:#2563EB; --fpm:#7C3AED; --bus:#E4600C; --econ:#0B9A63; --cs:#DB2777; --englit:#A21CAF; --englang:#B45309;
  --bio:#15803D; --chem:#0E7490; --phys:#4338CA; --test:#101317; --rest:#98A0AB;
  --r:8px; --r-sm:6px; --r-xs:4px; --navh:58px;
  --display:"Segoe UI Variable Display","Segoe UI",-apple-system,"Helvetica Neue",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",-apple-system,"Helvetica Neue",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-bottom:calc(var(--navh) + 24px);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.18;letter-spacing:-.018em;text-wrap:balance;font-weight:650}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}
a{color:var(--accent);text-underline-offset:2px}

.wrap{max-width:680px;margin:0 auto;padding:24px 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.lift{box-shadow:0 1px 2px rgba(14,16,19,.04)}
.stack{display:grid;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--r-xs);font-size:12.5px;font-weight:650;background:var(--surface2);color:var(--ink-2)}
.pill .dot{width:7px;height:7px;border-radius:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border-radius:var(--r-sm);
  font-weight:600;font-size:14.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunken);border-color:#BFC5CD}
.btn.primary{background:var(--solid);color:var(--solid-ink);border-color:var(--solid)}
.btn.primary:hover{background:#23282E;border-color:#23282E}
.btn.done{background:var(--good-soft);color:var(--good);border-color:#BFE3D1}
.btn.small{padding:6px 11px;font-size:13.5px;border-radius:var(--r-xs)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);z-index:10}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected=true]{color:var(--ink)}
.nav button[aria-selected=true]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--ink)}
.view[hidden]{display:none}

/* today */
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.weekbar h2{font-size:14px;font-weight:600;flex:1;font-family:var(--body);letter-spacing:0}
.weekbar button{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);font-size:17px;color:var(--ink-2)}
.weekbar button:hover:not(:disabled){background:var(--sunken)}
.weekbar button:disabled{opacity:.3}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0 18px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 2px;text-align:center;display:grid;gap:5px;justify-items:center}
.day:hover{border-color:var(--line-2)}
.day .dn{font-size:10.5px;font-weight:650;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.day .dd{font-family:var(--display);font-size:15px;font-weight:650}
.day .marks{display:flex;gap:3px;height:6px}
.day .marks i{width:6px;height:6px;border-radius:1.5px;display:block}
.day .marks i.off{opacity:.22}
.day[aria-selected=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day.today .dn{color:var(--accent)}
.day.alldone{background:var(--good-soft);border-color:#CDE9DA}

/* session card */
.session{border-top:3px solid var(--c);padding-top:16px}
.session .head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.session h2{font-size:21px;margin:0 0 3px}
.session .sub{color:var(--muted);font-size:13.5px;margin-bottom:15px}
.steps{display:grid;gap:11px;margin-bottom:16px}
.step{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.step .n{width:26px;height:26px;border-radius:var(--r-xs);background:var(--surface2);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;color:var(--muted)}
.step b{display:block;font-weight:650}
.step span{color:var(--muted);font-size:13.5px}
.scores{display:grid;gap:7px;margin:12px 0}
.scores label{display:flex;align-items:center;gap:8px;font-weight:500}
.scores label .s{flex:1;display:flex;align-items:center;gap:8px}
.scores .dot{width:8px;height:8px;border-radius:2px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.fixbanner{background:var(--bad-soft);border:1px solid #F7D4D4;border-radius:var(--r-sm);padding:12px 14px;color:var(--bad);display:flex;gap:10px;align-items:center;font-weight:550;font-size:14px}
.fixbanner button{margin-left:auto;font-weight:650;text-decoration:underline;color:inherit}
.fixlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px}
.fixlist li{display:flex;gap:10px;align-items:center;font-size:14px}
.fixlist input{width:18px;height:18px;accent-color:var(--good)}
.chip{font-family:var(--mono);font-size:11.5px;padding:2px 6px;border-radius:var(--r-xs);background:var(--surface2);color:var(--muted)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}

/* subjects */
.srow{display:grid;grid-template-columns:1fr auto;gap:7px 14px;padding:14px 0;border-top:1px solid var(--line);align-items:center;cursor:pointer;width:100%;text-align:left}
.srow:first-child{border-top:0}
.srow:hover .name{color:var(--accent)}
.srow .name{font-weight:650;display:flex;align-items:center;gap:9px;font-size:16px;letter-spacing:-.01em}
.srow .name .dot{width:10px;height:10px;border-radius:2px}
.srow .pct{color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:5px;background:var(--surface2);border-radius:2px;overflow:hidden}
.srow .prog{grid-column:1/-1}
.prog i{display:block;height:100%;border-radius:2px}
.status{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:var(--r-xs)}
.status.ahead{background:var(--good-soft);color:var(--good)}
.status.ontrack{background:var(--surface2);color:var(--ink-2)}
.status.behind{background:var(--bad-soft);color:var(--bad)}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;margin-bottom:12px;font-size:14px}
.back:hover{color:var(--ink)}
.topic{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0}
.topic input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink)}
.topic .t{font-weight:500;font-size:14.5px}
.topic .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.topic.done .t{color:var(--muted);text-decoration:line-through}
.topic .code{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:6px}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.kpi .v{font-family:var(--display);font-size:27px;font-weight:650;letter-spacing:-.03em;line-height:1.1;margin-top:3px}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.trow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.trow:first-child{border-top:0}
.trow .chips{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.stmts{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:15px;background:var(--sunken)}
.stmts>summary{cursor:pointer;padding:10px 13px;display:flex;align-items:center;gap:9px;list-style:none}
.stmts>summary::-webkit-details-marker{display:none}
.stmts>summary::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.stmts[open]>summary::after{transform:rotate(-135deg)}
.stmts>summary:hover{background:var(--surface2)}
.stmts ul{list-style:none;margin:0;padding:0 13px 6px;display:grid;gap:1px}
.stmts label{display:grid;grid-template-columns:auto 2.4em 1fr;gap:9px;align-items:center;padding:5px 0;font-size:13.5px;cursor:pointer}
.stmts input{width:16px;height:16px;accent-color:var(--good)}
.stmts .sc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stmts input:checked ~ span:last-child{color:var(--muted);text-decoration:line-through}
.refs{display:flex;flex-wrap:wrap;gap:5px}
.ref{font-family:var(--mono);font-size:11.5px;padding:3px 7px;border-radius:var(--r-xs);border:1px solid var(--line-2);color:var(--muted);background:var(--surface)}
.ref.part{background:var(--accent-soft);border-color:#C9DBFC;color:var(--accent)}
.ref.full{background:var(--good-soft);border-color:#BFE3D1;color:var(--good)}
.ref.gap{background:var(--bad-soft);border-color:#F7D4D4;color:var(--bad)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(12px,1fr));gap:3px;margin:8px 0 4px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--surface2);display:block}

/* guide */
.prose{max-width:64ch;font-size:14.5px}
.prose h3{font-size:16.5px;margin:22px 0 7px}
.prose p{margin:0 0 11px}
.prose ul{margin:0 0 11px;padding-left:19px}
.prose li{margin-bottom:5px}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px}

/* links out to Save My Exams and anywhere else the session sends you */
.links{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.links .btn{text-decoration:none}
.links .btn.go{background:var(--accent-soft);color:var(--accent);border-color:#C9DBFC}
.links .btn.go:hover{background:#DFE9FD}
.pinrow{display:flex;gap:7px;margin-bottom:15px}
.obj{margin-bottom:15px}
.obj ul{margin:7px 0 0;padding-left:17px;display:grid;gap:5px}
.obj li{font-size:14px;color:var(--ink-2)}
.obj li::marker{color:var(--muted)}
.watch{display:flex;gap:8px;padding:11px 13px;border-radius:var(--r-sm);background:var(--warn-soft);border:1px solid #F3DFBB;font-size:13.5px;color:#7A4A00;margin-bottom:15px;line-height:1.5}
.watch b{color:var(--warn);white-space:nowrap}
.sub-ed>summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600;padding:5px 0;list-style:none}
.sub-ed>summary::-webkit-details-marker{display:none}
.sub-ed>summary::before{content:"+ ";font-weight:700}
.sub-ed[open]>summary::before{content:"– "}
.sub-ed>summary:hover{color:var(--ink)}
.sub-ed .inner{display:grid;gap:6px;padding:4px 0 10px}
.selfcheck{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:13px;border-radius:var(--r-sm);background:var(--sunken);border:1px solid var(--line);margin-bottom:12px}
.selfcheck .q{font-weight:650;flex:1;min-width:185px;font-size:14.5px}
.mark{font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:var(--r-xs);background:var(--surface2);color:var(--muted)}
.mark.got{background:var(--good-soft);color:var(--good)}
.mark.shaky{background:var(--bad-soft);color:var(--bad)}
.streak{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-xs);background:var(--warn-soft);color:var(--warn);font-weight:650;font-size:13.5px}
.streak.cold{background:var(--surface2);color:var(--muted)}
.banner{border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:550;font-size:14px}
.banner.due{background:var(--accent-soft);border:1px solid #C9DBFC;color:var(--accent)}
.banner button{margin-left:auto;font-weight:650;text-decoration:underline;white-space:nowrap;color:inherit}

/* your day — timetable, free time and deadlines read out of Outlook */
.dayplan .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dayplan .top .eyebrow{flex:1}
.dayplan .upd{font-size:12px;color:var(--muted)}
.dayplan .note{font-size:13px;color:var(--warn);background:var(--warn-soft);border:1px solid #F3DFBB;border-radius:var(--r-xs);padding:7px 10px;margin-bottom:10px}
.dayplan .sec{margin-top:14px}
.tl{display:grid;margin:0}
.tl .ev{display:grid;grid-template-columns:6.6em 1fr;gap:10px;align-items:baseline;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.tl .ev:first-child{border-top:0}
.tl .ev .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.tl .ev b{font-weight:600}
.tl .ev .loc{color:var(--muted);font-size:13px}
.tl .ev.past{opacity:.45}
.tl .ev.now b{color:var(--accent)}
.tl .ev.free{color:var(--good)}
.tl .ev.free .t{color:var(--good)}
.tl .ev.free.best{background:var(--good-soft);margin:0 -10px;padding:6px 10px;border-radius:var(--r-xs);border-top:0}
.tl .ev.free.best+.ev{border-top:0}
.dl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:9px}
.dl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px}
.dl input{width:18px;height:18px;accent-color:var(--good);margin-top:2px}
.dl .when{font-weight:650;white-space:nowrap;margin-right:6px}
.dl .when.over{color:var(--bad)}
.dl .when.soon{color:var(--accent)}
.dl .who{color:var(--muted);font-size:12.5px}
.dl .snip{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.dl li.done{opacity:.45}
.dl li.done .title{text-decoration:line-through}
/* Teams assignments */
.asg{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:13px}
.asg li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px}
.asg input{width:18px;height:18px;accent-color:var(--good);margin-top:2px}
.asg .ah{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.asg .ah .title{font-weight:650}
.asg .who{color:var(--muted);font-size:12.5px}
.asg .snip{color:var(--ink-2);font-size:13px;margin-top:3px;line-height:1.45}
.asg .alinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.asg li.done{opacity:.5}
.asg li.done .title{text-decoration:line-through}

/* editor */
input[type=text],input[type=date],input[type=url],input[type=number],select,textarea{font:inherit;font-size:14px;padding:8px 10px;
  border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);width:100%;transition:border-color .12s}
input[type=number]{font-family:var(--mono);width:100%}
input:hover,select:hover,textarea:hover{border-color:#BFC5CD}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder{color:#A6ADB6}
textarea{resize:vertical;min-height:66px}
.ed{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.ed:first-of-type{border-top:0}
.ed-row{display:grid;gap:7px;align-items:center}
.ed-row.topic{grid-template-columns:5.5em 1fr 4.5em auto;border:0;padding:0}
.ed-row.band{grid-template-columns:1fr 1fr 1fr auto}
.ed-row.block{grid-template-columns:1fr 4.5em 1fr auto}
.ed-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650}
.icon{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line-2);display:grid;place-items:center;font-size:15px;color:var(--muted);flex:none;background:var(--surface)}
.icon:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--surface);overflow:hidden}
.acc[open]{border-color:var(--line-2)}
.acc>summary{cursor:pointer;padding:13px 15px;font-weight:650;display:flex;align-items:center;gap:9px;list-style:none;font-size:15px}
.acc>summary:hover{background:var(--sunken)}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.acc[open]>summary::after{transform:rotate(45deg)}
.acc .body{padding:2px 15px 16px;border-top:1px solid var(--line)}
.savebar{position:sticky;bottom:calc(var(--navh) + 10px);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);
  padding:11px 13px;display:flex;gap:9px;align-items:center;box-shadow:0 4px 16px rgba(14,16,19,.10);margin-top:16px;z-index:5}
.savebar .msg{font-size:13.5px;color:var(--muted);flex:1}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .4s ease}}

/* day summary */
.daybar{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.daybar>div:first-child{flex:1}
.dsum{font-size:14px;color:var(--ink-2);margin-top:2px}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-2)}

/* compact session rows */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative}
.sess .row{display:flex;align-items:stretch;min-height:52px}
.sess .grab{flex:1;display:flex;align-items:center;gap:10px;padding:0 12px 0 0;text-align:left;min-width:0}
.sess .bar{width:4px;align-self:stretch;background:var(--c);border-radius:var(--r) 0 0 var(--r);flex:none;margin-right:10px}
.sess .title{flex:1;font-weight:600;font-size:14.5px;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .mins{font-size:12px;color:var(--muted);flex:none}
.sess .tag{font-size:11px;font-weight:650;color:var(--muted);background:var(--surface2);padding:2px 7px;border-radius:var(--r-xs);flex:none}
.sess .tick,.sess .more{width:44px;border-left:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:16px;flex:none}
.sess .tick:hover,.sess .more:hover{background:var(--sunken);color:var(--ink)}
.sess .tick.on{color:var(--good);background:var(--good-soft)}
.sess .tick:disabled{opacity:.3}
.sess .more{border-radius:0 var(--r) var(--r) 0;font-size:18px;letter-spacing:1px}

<script>
/* ---------- PLAN (built by the Rust backend, see src-tauri/src/plan.rs) ---------- */
const invoke=(cmd,args)=>window.__TAURI__.core.invoke(cmd,args);
let SUBJECTS={},SUBJ_IDS=[],WEEKS=[],TOTAL=0,TESTS=[],TEST_BY_WEEK={},TOPIC_DUE={};
let REVIEW_GAPS=[7,21,56],EXAM_START="2028-05-08",UNSCHEDULED=[];
function applyPlan(plan){
  SUBJECTS={};const byId={};
  plan.subjects.forEach(s=>{const topics=s.topics.map(t=>{const a=[t.code,t.title,t.hours];a.id=t.id;a.subj=t.subj;a.idx=t.idx;a.url=t.url||"";a.objectives=t.objectives||[];a.watch=t.watch||"";a.statements=t.statements||[];byId[t.id]=a;return a;});
    SUBJECTS[s.id]={name:s.name,full:s.full,color:s.color,papers:s.papers,spec:s.spec,sections:s.sections,topics,contentEndsWeek:s.contentEndsWeek,resources:s.resources||[],specRefs:s.specRefs||[],pace:s.pace||"ahead"};});
  SUBJ_IDS=plan.subjects.map(s=>s.id);
  WEEKS=plan.weeks.map(w=>{const plan2={};for(const s of SUBJ_IDS){plan2[s]=(w.plan[s]||[]).map(e=>e.kind==="topic"?{kind:"topic",topic:byId[e.topicId],hours:e.hours,partNo:e.partNo,parts:e.parts,final:e.final}:(e.kind==="fixed"?{kind:"fixed",label:e.label,hours:e.hours,note:e.note}:{kind:"rev",section:e.section,hours:e.hours}));}
    return {n:w.n,start:new Date(w.start+"T00:00:00"),type:w.type,label:w.label,year:w.year,block:w.block,last:w.last,first:w.first,termWeek:w.termWeek,plan:plan2};});
  TOTAL=WEEKS.length;TESTS=plan.tests;TEST_BY_WEEK={};TESTS.forEach(t=>(TEST_BY_WEEK[t.week]=TEST_BY_WEEK[t.week]||[]).push(t));
  TOPIC_DUE=plan.topicDue;REVIEW_GAPS=plan.reviewGaps||REVIEW_GAPS;EXAM_START=plan.examStart||EXAM_START;UNSCHEDULED=plan.unscheduled||[];
}
const DAYN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const fmt=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmtLong=d=>d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};

/* ---------- DAYS: turn a week's plan into sessions per day ---------- */
const secName=l=>String(l).replace(/^[0-9][0-9A-Za-z_.]*\s+/,"");

const mins=h=>Math.max(15,Math.round(h*60/15)*15);
const fmtMins=m=>m>=60?`${Math.floor(m/60)}h${m%60?" "+String(m%60).padStart(2,"0"):""}`:`${m} min`;
/* A session key names its week, subject and slot, so a moved session can be
   rebuilt from the week it came from. */
function itemFromKey(key){
  if(key.startsWith("s:")){const[,wn,subj,j]=key.split(":");const w=WEEKS[+wn-1];if(!w||!w.plan[subj])return null;const e=w.plan[subj][+j];if(!e)return null;return {kind:e.kind,subj,entry:e,key,srcWeek:+wn};}
  if(key.startsWith("test:")){const t=TESTS.find(x=>"test:"+x.id===key);return t?{kind:"test",test:t,key,srcWeek:t.week}:null;}
  if(key.startsWith("flash:")){return {kind:"flash",key,srcWeek:+key.split(":")[1]};}
  return null;}
function baseDays(w){
  const days=Array.from({length:7},(_,i)=>({i,date:addDays(w.start,i),items:[]}));
  if(w.type==="exam"){days.forEach(d=>d.items.push({kind:"exam"}));return days;}
  const sessions=[];SUBJ_IDS.forEach(s=>w.plan[s].forEach((e,j)=>sessions.push({kind:e.kind,subj:s,entry:e,key:`s:${w.n}:${s}:${j}`,srcWeek:w.n})));
  if(w.type==="term"||w.type==="summer"){
    // Fixed sessions (the timed piece) take Monday; everything else is spread
    // round-robin over Monday to Saturday so no single day is swamped.
    const fixed=sessions.filter(s=>s.kind==="fixed"),rest=sessions.filter(s=>s.kind!=="fixed");
    fixed.forEach(s=>days[0].items.push(s));
    rest.forEach((ss,i)=>days[i%6].items.push(ss));
    (TEST_BY_WEEK[w.n]||[]).forEach(t=>days[5].items.push({kind:"test",test:t,key:"test:"+t.id,srcWeek:w.n}));
    if(w.type==="term")days[6].items.push({kind:"flash",key:`flash:${w.n}`,srcWeek:w.n});
  }else{
    days[0].items.push({kind:"catchup"});
    (TEST_BY_WEEK[w.n]||[]).forEach(t=>days[1].items.push({kind:"test",test:t,key:"test:"+t.id,srcWeek:w.n}));
  }
  return days;}
function buildDays(w){
  const days=baseDays(w);
  if(w.type==="exam")return days;
  // Apply moves out of this week and within it, and skips.
  days.forEach(d=>{d.items=d.items.filter(it=>{if(!it.key)return true;const mv=state.moves[it.key];if(mv&&mv.week!==w.n)return false;return true;});});
  const within=[];
  days.forEach(d=>{d.items=d.items.filter(it=>{const mv=it.key&&state.moves[it.key];if(mv&&mv.week===w.n&&mv.day!==d.i){within.push({it,from:d.i,to:mv.day});return false;}return true;});});
  within.forEach(({it,from,to})=>{it.movedFrom=DAYN[from];days[to].items.push(it);});
  // Moves into this week from another.
  Object.entries(state.moves).forEach(([key,mv])=>{if(mv.week!==w.n)return;const it=itemFromKey(key);if(!it||it.srcWeek===w.n)return;it.movedFrom=`week ${it.srcWeek}`;days[Math.min(6,mv.day)].items.push(it);});
  days.forEach(d=>d.items.forEach(it=>{if(it.key&&state.skips[it.key])it.skipped=true;}));
  return days;}
function dayMinutes(d){return d.items.filter(it=>!it.skipped).reduce((n,it)=>n+(it.entry?mins(it.entry.hours):(it.test?it.test.mins:(it.kind==="flash"?30:0))),0);}
function dayCounts(d){const live=d.items.filter(it=>!it.skipped&&it.key);return {n:live.length,done:live.filter(itemDone).length};}

/* ---------- STATE ---------- */
const BLANK={topics:{},tests:{},sessions:{},reviews:{},days:{},stmts:{},inbox:{},moves:{},skips:{},cards:{},examDates:{}};
let state={...BLANK};
let LS="grade9-tracker-v2";
let saveTimer=null;
function persist(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const el=document.getElementById("sync");
    try{await window.tracker.save(state);el.textContent="Saved";}catch(e){el.textContent="Couldn't save to file — progress kept in this window only";}},300);}
/* mark: null = not judged, "got" = could do it unaided, "shaky" = couldn't.
   known: ticked as already covered (by school, or before the app) rather than
   worked through here — it skips the content schedule and goes straight to review. */
const T=id=>state.topics[id]||(state.topics[id]={done:false,mark:null,fixed:false});
const TS=id=>state.tests[id]||(state.tests[id]={marks:{},fixed:{}});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function todayWeek(){const now=new Date();let best=WEEKS[0];for(const w of WEEKS){if(w.start<=now)best=w;}return best.n;}
function todayIndex(w){const diff=Math.floor((new Date()-w.start)/86400000);return diff>=0&&diff<7?diff:-1;}
function findTopic(id){for(const s of SUBJ_IDS){const t=SUBJECTS[s].topics.find(t=>t.id===id);if(t)return t;}return null;}
const isSchool=s=>SUBJECTS[s]&&SUBJECTS[s].pace==="school";

/* ---------- STREAK — the only thing being counted ---------- */
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;};
const todayISO=()=>iso(new Date());
function markDay(){state.days[todayISO()]=true;}
function streak(){let n=0,d=new Date();
  if(!state.days[iso(d)])d=addDays(d,-1);
  while(state.days[iso(d)]){n++;d=addDays(d,-1);}
  return n;}
/* The first exam is the earliest date you have written in, else the start of
   the exam block in the calendar. */
function firstExam(){const set=Object.values(state.examDates||{}).filter(Boolean).sort();return set[0]||EXAM_START;}
const daysToExams=()=>Math.max(0,Math.round((new Date(firstExam()+"T00:00:00")-new Date())/86400000));

/* ---------- WHAT NEEDS REDOING ---------- */
function fixList(){const items=[];
  Object.entries(state.topics).forEach(([id,t])=>{if(t.done&&t.mark==="shaky"&&!t.fixed){const tp=findTopic(id);if(tp)items.push({key:"t:"+id,label:`${SUBJECTS[tp.subj].name}: ${tp[1]}`});}});
  Object.entries(state.tests).forEach(([id,t])=>{const test=TESTS.find(x=>x.id===id);if(!test)return;Object.entries(t.marks||{}).forEach(([s,v])=>{if(v==="shaky"&&!(t.fixed||{})[s]&&SUBJECTS[s])items.push({key:"s:"+id+":"+s,label:`${SUBJECTS[s].name}: ${test.title}, week ${test.week}`});});});
  return items;}
function toggleFix(key){const item=fixList().find(f=>f.key===key);
  if(key.startsWith("t:"))T(key.slice(2)).fixed=true;else{const[,id,s]=key.split(":");const ts=TS(id);ts.fixed=ts.fixed||{};ts.fixed[s]=true;}
  if(item)scheduleReview(key,item.label);
  markDay();persist();render();}

/* ---------- SPACED REPETITION ----------
   Anything cleared off the fix list, and anything ticked as already known,
   comes back after 1 week, then 3, then 8, to prove it stuck. */
/* No more than a few checks land on any one day: ticking a whole section as
   known would otherwise dump every one of them on the same morning. */
const PER_DAY=3;
function stagger(date,skipKey){let d=new Date(date);
  for(let i=0;i<60;i++){const day=iso(d);const n=Object.entries(state.reviews).filter(([k,r])=>k!==skipKey&&r.due===day).length;if(n<PER_DAY)return day;d=addDays(d,1);}
  return iso(d);}
function scheduleReview(key,label){
  const r=state.reviews[key]||{stage:0};
  r.label=label;
  r.due=stagger(addDays(new Date(),REVIEW_GAPS[Math.min(r.stage,REVIEW_GAPS.length-1)]),key);
  state.reviews[key]=r;}
function dueReviews(){const t=todayISO();return Object.entries(state.reviews).filter(([,r])=>r.due<=t).map(([key,r])=>({key,...r}));}
function passReview(key){const r=state.reviews[key];if(!r)return;
  r.stage++;
  if(r.stage>=REVIEW_GAPS.length)delete state.reviews[key];
  else r.due=stagger(addDays(new Date(),REVIEW_GAPS[r.stage]),key);
  if(key.startsWith("t:")){const t=T(key.slice(2));t.gaps=[];}
  delete recallMarks[key];markDay();persist();render();}
function failReview(key){const r=state.reviews[key];if(!r)return;
  r.stage=0;r.due=stagger(addDays(new Date(),REVIEW_GAPS[0]),key);
  // A failed recall on a topic is a real gap: it goes on the fix list too.
  if(key.startsWith("t:")){const t=T(key.slice(2));t.done=true;t.mark="shaky";t.fixed=false;
    const m=recallMarks[key]||{};t.gaps=Object.entries(m).filter(([,v])=>v===false).map(([i])=>+i);}
  delete recallMarks[key];markDay();persist();render();}

function itemDone(it){if(it.kind==="topic")return !!state.sessions[it.key]||T(it.entry.topic.id).done;
  if(it.kind==="test"){const live=it.test.subjects.filter(s=>SUBJECTS[s]);return live.length>0&&live.every(s=>TS(it.test.id).marks[s]!=null);}
  return !!state.sessions[it.key];}
function itemColor(it){return it.subj&&SUBJECTS[it.subj]?SUBJECTS[it.subj].color:(it.kind==="test"?"var(--test)":"var(--rest)");}

/* ---------- LINKS OUT ---------- */
const SHOWN=3;
const openLinks=new Set();
function linkBar(subj,topic,showAll){
  const S=SUBJECTS[subj];if(!S)return "";
  const all=showAll||openLinks.has(subj);
  const rs=all?S.resources:S.resources.slice(0,SHOWN);
  const hidden=S.resources.length-rs.length;
  let html=`<div class="links">`;
  if(topic&&topic.url)html+=`<a class="btn small go" href="${esc(topic.url)}">Open this topic ↗</a>`;
  html+=rs.map(r=>`<a class="btn small" href="${esc(r.url)}">${esc(r.label)} ↗</a>`).join("");
  if(hidden>0)html+=`<button class="btn small" data-morelinks="${esc(subj)}">+${hidden} more</button>`;
  if(topic)html+=`<button class="btn small" data-pin="${esc(topic.id)}">${topic.url?"Change link":"Pin exact link"}</button>`;
  return html+`</div>`;}

/* ---------- SPECIFICATION CHECKLIST ---------- */
const openStmt=new Set();
const stmtKey=(topicId,code)=>topicId+"|"+code;
const stmtDone=(topicId,code)=>!!state.stmts[stmtKey(topicId,code)];
function stmtCounts(topic){const s=(topic&&topic.statements)||[];
  return {done:s.filter(x=>stmtDone(topic.id,x.code)).length,total:s.length};}
function stmtBlock(topic){
  const s=(topic&&topic.statements)||[];if(!s.length)return "";
  const c=stmtCounts(topic);
  return `<details class="stmts" data-stmtbox="${esc(topic.id)}" ${openStmt.has(topic.id)?"open":""}><summary><span class="eyebrow">Specification checklist</span><span class="chip ${c.done===c.total?"ok":""}">${c.done} of ${c.total}</span></summary>
    <ul>`+s.map(x=>`<li><label><input type="checkbox" data-stmt="${esc(stmtKey(topic.id,x.code))}" ${stmtDone(topic.id,x.code)?"checked":""}><span class="sc">${esc(x.code)}</span><span>${esc(x.label)}</span></label></li>`).join("")+`</ul>
    <p class="muted" style="font-size:12.5px;margin:8px 0 0">${topic.subj==="maths"?"Every lettered statement the specification makes for this topic. <b>F</b> is Foundation content and <b>H</b> is Higher — you are examined on both.":`Every numbered statement the specification makes for this topic. A <b>${{bio:"B",chem:"C",phys:"P"}[topic.subj]||"B, C or P"}</b> suffix marks separate-science-only content — Double Award students skip it; <b>you do it</b>.`} The exact wording is in the <a href="${esc((SUBJECTS[topic.subj]||{}).spec||"")}">official specification ↗</a>.</p></details>`;}

function objBlock(topic){
  if(!topic)return "";
  let html="";const gaps=new Set((T(topic.id).gaps)||[]);
  if(topic.objectives&&topic.objectives.length)
    html+=`<div class="obj"><div class="eyebrow">By the end you should be able to</div><ul>`+topic.objectives.map((o,i)=>`<li class="${gaps.has(i)?"gap":""}">${esc(o)}${gaps.has(i)?` <span class="mark shaky">gap</span>`:""}</li>`).join("")+`</ul></div>`;
  if(topic.watch)html+=`<div class="watch"><b>Watch out</b><span>${esc(topic.watch)}</span></div>`;
  return html;}
function pinRow(topic){
  if(!topic||pinning!==topic.id)return "";
  return `<div class="pinrow"><input type="url" id="pinurl" placeholder="Paste the Save My Exams page for this topic" value="${esc(topic.url||"")}"><button class="btn primary small" data-pinsave="${esc(topic.id)}">Save</button></div>`;}

/* ---------- YOUR OWN CARDS ----------
   Quote → technique → effect for a poem, a formula, a definition. You write
   them; the app quizzes you on them whenever the topic comes up for review.
   Writing the card is most of the learning, which is why none are pre-filled. */
const openCards=new Set(),revealed=new Set();
const cardsOf=id=>state.cards[id]||[];
function cardBlock(topic){
  const cs=cardsOf(topic.id);
  return `<details class="cards" data-cardbox="${esc(topic.id)}" ${openCards.has(topic.id)?"open":""}><summary><span class="eyebrow">Your cards</span><span class="chip">${cs.length}</span></summary>
    ${cs.map((c,i)=>`<div class="cardrow"><div><div class="f">${esc(c.f)}</div><div class="b">${esc(c.b)}</div></div><button class="icon" data-delcard="${esc(topic.id)}|${i}" aria-label="Delete card">×</button></div>`).join("")}
    <div class="cardadd"><input type="text" data-cardf="${esc(topic.id)}" placeholder="${topic.subj==="englit"?"Front — a short quote, 3 to 5 words":"Front — the prompt"}"><input type="text" data-cardb="${esc(topic.id)}" placeholder="${topic.subj==="englit"?"Back — technique, and what it does to the reader":"Back — the answer"}"><button class="btn small" data-addcard="${esc(topic.id)}">Add</button></div>
    <p class="muted" style="font-size:12.5px;margin:6px 0 0">Keep the front short. Cards come up in this topic's recall checks, front first.</p></details>`;}
function quizCards(id){const cs=cardsOf(id);if(!cs.length)return "";
  return `<div class="quiz">`+cs.map((c,i)=>{const k=id+"|"+i,on=revealed.has(k);return `<button class="qcard ${on?"open":""}" data-flip="${esc(k)}"><span class="f">${esc(c.f)}</span>${on?`<span class="b">${esc(c.b)}</span>`:`<span class="hint">tap to reveal</span>`}</button>`;}).join("")+`</div>`;}

/* ---------- RECALL CHECKS ----------
   A due review shows the topic's objectives as prompts: can you do each one
   without looking? Mark each, then say whether the whole thing held. */
const recallMarks={};
function reviewCard(r){
  const topicId=r.key.startsWith("t:")?r.key.slice(2):null;const tp=topicId&&findTopic(topicId);
  const S=tp?SUBJECTS[tp.subj]:null;const m=recallMarks[r.key]||(recallMarks[r.key]={});
  const stage=`check ${Math.min(r.stage+1,REVIEW_GAPS.length)} of ${REVIEW_GAPS.length}`;
  let body="";
  if(tp&&tp.objectives.length){
    body=`<div class="recall">`+tp.objectives.map((o,i)=>`<div class="rq ${m[i]===true?"yes":(m[i]===false?"no":"")}"><span>${esc(o)}</span><span class="yn"><button data-rq="${esc(r.key)}|${i}|1" aria-label="Can do">✓</button><button data-rq="${esc(r.key)}|${i}|0" aria-label="Cannot">✗</button></span></div>`).join("")+`</div>`+quizCards(topicId);
  }else body=`<p class="muted" style="font-size:13.5px;margin:0 0 10px">Do a few questions on it from memory, then say honestly whether it held.</p>`;
  const anyNo=Object.values(m).some(v=>v===false);
  return `<div class="card session review" style="--c:${S?S.color:"var(--accent)"}"><div class="head"><span class="pill"><span class="dot" style="background:${S?S.color:"var(--accent)"}"></span>Recall check</span><span class="chip">${stage}</span></div>
    <h2 style="font-size:17px">${esc(r.label)}</h2><div class="sub">Closed book. No notes until you have marked every line.</div>${body}
    <div class="selfcheck"><span class="q">Did it hold?</span><button class="btn small ${anyNo?"":"primary"}" data-pass="${esc(r.key)}">All good</button><button class="btn small ${anyNo?"primary":""}" data-fail="${esc(r.key)}">Some gaps</button></div></div>`;}

/* ---------- YOUR DAY ----------
   Read out of classic Outlook by the Rust side (src-tauri/src/outlook.rs) and
   sifted by rules, not a model (src-tauri/src/today.rs): the timetable, the
   gaps between lessons, deadlines found in teachers' emails, and requests
   with no date. Nothing leaves the machine. */
let DAY=null,DAY_ERR=null,DAY_BUSY=false,showDoneInbox=false,showAllAsks=false;
const DAY_START=7*60,DAY_END=21*60+30,MIN_SLOT=30,AFTER_SCHOOL=15*60+30,SHOW_AHEAD_DAYS=14,ASKS_SHOWN=4;
async function loadDay(refresh){
  if(DAY_BUSY||settings.outlook===false)return;
  DAY_BUSY=true;if(view==="today")render();
  try{DAY=await invoke("day_context",{refresh});DAY_ERR=DAY.error||null;}
  catch(e){DAY_ERR=String(e);}
  DAY_BUSY=false;if(view==="today")render();
}
const hhmm=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const minsOf=d=>d.getHours()*60+d.getMinutes();
const dur=m=>m>=60?(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${m/60}h`):`${m}m`;
/* Events that touch the day, clipped to it, in minutes from midnight. */
function eventsOn(date){
  const d0=new Date(date);d0.setHours(0,0,0,0);const d1=addDays(d0,1);
  return (DAY?DAY.events:[]).map(e=>({...e,s:new Date(e.start),e:new Date(e.end)})).filter(e=>e.s<d1&&e.e>d0)
    .map(e=>({...e,sm:e.s<d0?0:minsOf(e.s),em:e.e>=d1?1440:minsOf(e.e)})).sort((a,b)=>a.sm-b.sm);}
/* The gaps: between lessons, from now if it is today, until DAY_END. */
function freeSlots(evs,isToday){
  let curM=DAY_START;if(isToday)curM=Math.max(curM,Math.ceil(minsOf(new Date())/5)*5);
  const slots=[];
  for(const x of evs.filter(e=>!e.allDay)){if(x.sm-curM>=MIN_SLOT)slots.push({s:curM,e:x.sm});curM=Math.max(curM,x.em);}
  if(DAY_END-curM>=MIN_SLOT)slots.push({s:curM,e:DAY_END});
  return slots;}
/* How long the day's unfinished sessions add up to. */
function needMinutes(d){return d.items.filter(it=>!it.skipped&&!itemDone(it)).reduce((n,it)=>n+(it.entry?mins(it.entry.hours):(it.test?it.test.mins:(it.kind==="flash"?30:0))),0);}
/* First gap after school that fits, else the first that fits, else the longest. */
function bestSlot(slots,need){if(!slots.length||!need)return null;
  return slots.find(x=>x.e-x.s>=need&&x.s>=AFTER_SCHOOL)||slots.find(x=>x.e-x.s>=need)||slots.reduce((a,b)=>b.e-b.s>a.e-a.s?b:a);}
function whenLabel(dateISO){
  const t=new Date(todayISO()+"T00:00:00"),d=new Date(dateISO+"T00:00:00");const n=Math.round((d-t)/86400000);
  if(n<0)return {cls:"over",text:`Overdue · ${fmt(d)}`};
  if(n===0)return {cls:"soon",text:"Today"};
  if(n===1)return {cls:"soon",text:"Tomorrow"};
  if(n<7)return {cls:"",text:DAYN[(d.getDay()+6)%7]};
  return {cls:"",text:fmt(d)};}
const srcName={flag:"flagged",email:"email",calendar:"calendar",task:"task"};
function dayPanel(d,isToday){
  if(settings.outlook===false)return "";
  const upd=DAY?new Date(DAY.fetchedAt):null;
  let html=`<div class="card dayplan"><div class="top"><span class="eyebrow">Your day</span>${upd?`<span class="upd">Outlook · ${upd.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</span>`:""}<button class="btn small" id="dayrefresh" ${DAY_BUSY?"disabled":""}>${DAY_BUSY?"Reading…":"Refresh"}</button></div>`;
  if(DAY_ERR){const cut=DAY_ERR.indexOf(". ");const head=cut>0?DAY_ERR.slice(0,cut+1):DAY_ERR,rest=cut>0?DAY_ERR.slice(cut+2):"";
    html+=`<div class="note">${esc(head)}${DAY?" Showing the last copy.":""}${rest?`<details><summary></summary><p>${esc(rest)}</p></details>`:""}</div>`;}
  if(!DAY){html+=`<div class="muted" style="font-size:14px">${DAY_BUSY?"Reading your calendar and inbox from Outlook…":DAY_ERR?"":"Nothing read yet."}</div></div>`;return html;}
  // timetable + gaps
  const evs=eventsOn(d.date),slots=freeSlots(evs,isToday),need=needMinutes(d),best=bestSlot(slots,need),now=isToday?minsOf(new Date()):-1;
  const rows=[];
  evs.filter(e=>e.allDay).forEach(e=>rows.push({sm:-1,html:`<div class="ev"><span class="t">all day</span><span><b>${esc(e.subject)}</b>${e.location?` <span class="loc">· ${esc(e.location)}</span>`:""}</span></div>`}));
  evs.filter(e=>!e.allDay).forEach(e=>{const past=isToday&&e.em<=now,live=isToday&&e.sm<=now&&now<e.em;
    rows.push({sm:e.sm,html:`<div class="ev ${past?"past":""} ${live?"now":""}"><span class="t">${hhmm(e.sm)}–${hhmm(e.em)}</span><span><b>${esc(e.subject)}</b>${e.location?` <span class="loc">· ${esc(e.location)}</span>`:""}</span></div>`});});
  slots.forEach(x=>{const isBest=best&&x.s===best.s;
    rows.push({sm:x.s+0.5,html:`<div class="ev free ${isBest?"best":""}"><span class="t">${hhmm(x.s)}–${hhmm(x.e)}</span><span><b>${isBest&&need?`Do your ${need} min session here`:"Free"}</b> <span class="loc">· ${dur(x.e-x.s)}</span></span></div>`});});
  rows.sort((a,b)=>a.sm-b.sm);
  if(rows.length)html+=`<div class="tl">${rows.map(r=>r.html).join("")}</div>`;
  else html+=`<div class="muted" style="font-size:14px">Nothing in the calendar for this day.</div>`;
  if(isToday&&need&&!best)html+=`<div class="muted" style="font-size:13px;margin-top:6px">No gap of ${need} minutes left today — do what you can, or catch up tomorrow.</div>`;
  const done=id=>!!state.inbox[id];
  // assignments — recognised from Teams notification emails (src/today.rs)
  const allAsg=DAY.assignments||[],asg=allAsg.filter(x=>showDoneInbox||!done(x.id));
  if(allAsg.length){html+=`<div class="sec"><span class="eyebrow">Assignments</span>`;
    if(!asg.length)html+=`<p class="muted" style="font-size:14px;margin:6px 0 0">All done ✓</p>`;
    else html+=`<ul class="asg">`+asg.map(a=>{const w=a.due?whenLabel(a.due):null;
      return `<li class="${done(a.id)?"done":""}"><input type="checkbox" data-inbox="${esc(a.id)}" ${done(a.id)?"checked":""} aria-label="Done"><div><div class="ah">${w?`<span class="when ${w.cls}">${w.text}</span>`:""}<span class="title">${esc(a.title)}</span>${a.course?`<span class="who">· ${esc(a.course)}</span>`:""}${a.unread?`<span class="who">· unread</span>`:""}</div>${a.description?`<div class="snip">${esc(a.description)}</div>`:""}${a.links&&a.links.length?`<div class="alinks">`+a.links.map(l=>`<a class="btn small" href="${esc(l.url)}">${esc(l.label)} ↗</a>`).join("")+`</div>`:""}</div></li>`;}).join("")+`</ul>`;
    html+=`</div>`;}
  // deadlines
  const limit=iso(addDays(new Date(),SHOW_AHEAD_DAYS));
  const dl=DAY.deadlines.filter(x=>x.date<=limit),later=DAY.deadlines.length-dl.length;
  const dlShow=dl.filter(x=>showDoneInbox||!done(x.id)),dlDone=dl.filter(x=>done(x.id)).length;
  html+=`<div class="sec"><div style="display:flex;align-items:center;gap:8px"><span class="eyebrow">Deadlines</span>${dlDone?`<button class="btn small" id="showdone" style="margin-left:auto">${showDoneInbox?"Hide done":`Show ${dlDone} done`}</button>`:""}</div>`;
  if(!dlShow.length)html+=`<p class="muted" style="font-size:14px;margin:6px 0 0">Nothing found in the last fortnight of email.</p>`;
  else html+=`<ul class="dl">`+dlShow.map(x=>{const w=whenLabel(x.date);
    return `<li class="${done(x.id)?"done":""}"><input type="checkbox" data-inbox="${esc(x.id)}" ${done(x.id)?"checked":""} aria-label="Done"><div><span class="when ${w.cls}">${w.text}</span><span class="title">${esc(x.title)}</span> <span class="who">— ${esc(x.from)}${x.source!=="email"?` · ${srcName[x.source]||x.source}`:""}</span>${x.snippet?`<div class="snip">${esc(x.snippet)}</div>`:""}</div></li>`;}).join("")+`</ul>`;
  if(later)html+=`<p class="muted" style="font-size:12.5px;margin:8px 0 0">+${later} more than ${SHOW_AHEAD_DAYS} days away.</p>`;
  html+=`</div>`;
  // requests with no date
  const acts=DAY.actions.filter(x=>showDoneInbox||!done(x.id)),shown=showAllAsks?acts:acts.slice(0,ASKS_SHOWN);
  if(acts.length)html+=`<div class="sec"><span class="eyebrow">Asked of you</span><ul class="dl">`+shown.map(x=>`<li class="${done(x.id)?"done":""}"><input type="checkbox" data-inbox="${esc(x.id)}" ${done(x.id)?"checked":""} aria-label="Done"><div><span class="title">${esc(x.title)}</span> <span class="who">— ${esc(x.from)}${x.unread?" · unread":""}</span>${x.snippet?`<div class="snip">${esc(x.snippet)}</div>`:""}</div></li>`).join("")+`</ul>${acts.length>ASKS_SHOWN?`<button class="btn small" id="allasks" style="margin-top:10px">${showAllAsks?"Show fewer":`+${acts.length-shown.length} more`}</button>`:""}</div>`;
  return html+`</div>`;}
function bindDay(root){
  root.querySelector("#dayrefresh")?.addEventListener("click",()=>loadDay(true));
  root.querySelector("#showdone")?.addEventListener("click",()=>{showDoneInbox=!showDoneInbox;render();});
  root.querySelector("#allasks")?.addEventListener("click",()=>{showAllAsks=!showAllAsks;render();});
  root.querySelectorAll("[data-inbox]").forEach(cb=>cb.addEventListener("change",()=>{if(cb.checked)state.inbox[cb.dataset.inbox]=true;else delete state.inbox[cb.dataset.inbox];persist();render();}));
}

/* ---------- TODAY VIEW ---------- */
let cur=1,curDay=null,showFix=false,pinning=null,menuKey=null;
const openSess=new Set();let autoOpenedFor="";
function renderToday(){
  const w=WEEKS[cur-1];const days=buildDays(w);const ti=todayIndex(w);
  if(curDay==null)curDay=ti>=0?ti:0;
  const end=addDays(w.start,6);
  let html=`<div class="tmain"><div class="weekbar"><button id="prev" ${cur===1?"disabled":""} aria-label="Previous week">‹</button><h2>Week ${w.n} of ${TOTAL} · Year ${w.year} · ${esc(w.label)}<br><span class="muted" style="font-weight:400">${fmt(w.start)} – ${fmt(end)} ${end.getFullYear()}</span></h2>${cur!==todayWeek()?`<button id="jump" class="wbtn">Today</button>`:""}<button id="printwk" class="wbtn" title="Print this week (P)">Print</button><button id="next" ${cur===TOTAL?"disabled":""} aria-label="Next week">›</button></div>`;
  html+=`<div class="days">`+days.map(d=>{const c=dayCounts(d);const all=c.n>0&&c.done===c.n;return `<button class="day ${d.i===ti?"today":""} ${all?"alldone":""}" data-day="${d.i}" aria-selected="${d.i===curDay}"><span class="dn">${DAYN[d.i]}</span><span class="dd">${d.date.getDate()}</span><span class="marks">${d.items.length?d.items.filter(it=>!it.skipped).slice(0,4).map(it=>`<i style="background:${itemColor(it)}" class="${itemDone(it)?"":"off"}"></i>`).join(""):`<i style="background:var(--rest)" class="off"></i>`}</span></button>`;}).join("")+`</div>`;
  const st=streak();
  html+=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><span class="streak ${st?"":"cold"}">${st?"🔥":"○"} ${st} day${st===1?"":"s"} in a row</span><span class="muted" style="font-size:13px">${daysToExams()} days to exams</span></div>`;
  const fixes=fixList();
  if(fixes.length){html+=`<div class="fixbanner">⚠ ${fixes.length} thing${fixes.length>1?"s":""} to redo <button id="togglefix">${showFix?"Hide":"Show"}</button></div>`;
    if(showFix)html+=`<div class="card" style="margin-top:10px"><div class="eyebrow">Fix list</div><ul class="fixlist">`+fixes.map(f=>`<li><input type="checkbox" data-fix="${esc(f.key)}" aria-label="Fixed"><span>${esc(f.label)}</span></li>`).join("")+`</ul><p class="muted" style="font-size:14px;margin:12px 0 0">Go back over it and do more questions. Tick it when you can do it unaided — it will come back later to check.</p></div>`;
    html+=`<div style="height:14px"></div>`;}
  const d=days[curDay];const c=dayCounts(d);const isToday=cur===todayWeek()&&d.i===ti;
  const due=dueReviews();
  const total=dayMinutes(d)+(isToday?due.length*10:0);
  html+=`<div class="daybar"><div><div class="eyebrow">${isToday?"Today · ":""}${fmtLong(d.date)}</div><div class="dsum">${c.n+(isToday?due.length:0)?`${c.n?`${c.n} session${c.n===1?"":"s"}`:""}${c.n&&isToday&&due.length?" · ":""}${isToday&&due.length?`${due.length} recall check${due.length===1?"":"s"}`:""} · ${fmtMins(total)}${c.n?` · <b>${c.done} done</b>`:""}`:"Nothing planned"}</div></div>${c.n?`<div class="ring" style="--p:${Math.round(100*c.done/c.n)}"><span>${Math.round(100*c.done/c.n)}%</span></div>`:""}</div>`;
  html+=`<div class="stack">`;
  html+=dayPanel(d,isToday);
  if(isToday)due.forEach(r=>html+=reviewCard(r));
  else if(due.length&&cur===todayWeek())html+=`<div class="banner due">↻ ${due.length} recall check${due.length>1?"s":""} waiting on today's page <button id="gotoday">Go to today</button></div>`;
  if(!d.items.length)html+=`<div class="card"><div class="empty">Nothing planned. Rest day — or use it to catch up on anything unticked.</div></div>`;
  // Open the first unfinished session automatically, once per day viewed.
  const dayId=`${w.n}:${d.i}`;
  if(autoOpenedFor!==dayId){autoOpenedFor=dayId;openSess.clear();const first=d.items.find(it=>it.key&&!it.skipped&&!itemDone(it));if(first)openSess.add(first.key);}
  d.items.forEach(it=>html+=renderItem(it,w,d));
  html+=`</div>`;
  html+=`</div>`+weekSide(w,days,ti);
  const el=document.getElementById("view-today");el.innerHTML=html+printWeek(w,days);
  el.querySelectorAll("[data-wday]").forEach(b=>b.addEventListener("click",()=>{curDay=+b.dataset.wday;menuKey=null;render();}));
  el.querySelectorAll("[data-wsess]").forEach(b=>b.addEventListener("click",()=>{const[dd,key]=b.dataset.wsess.split("|");curDay=+dd;openSess.clear();openSess.add(key);autoOpenedFor=`${w.n}:${dd}`;menuKey=null;render();}));
  el.querySelector("#prev")?.addEventListener("click",()=>{cur--;curDay=0;menuKey=null;render();});
  el.querySelector("#next")?.addEventListener("click",()=>{cur++;curDay=0;menuKey=null;render();});
  el.querySelector("#jump")?.addEventListener("click",()=>{cur=todayWeek();curDay=null;render();});
  el.querySelector("#gotoday")?.addEventListener("click",()=>{curDay=ti;render();});
  el.querySelector("#printwk")?.addEventListener("click",()=>window.print());
  el.querySelector("#togglefix")?.addEventListener("click",()=>{showFix=!showFix;render();});
  el.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",()=>{curDay=+b.dataset.day;menuKey=null;render();}));
  bind(el);bindDay(el);
}
/* The whole week at a glance, shown beside the day on a wide window. Click a
   session to jump to it. */
function weekSide(w,days,ti){
  const due=dueReviews().length,tests=(TEST_BY_WEEK[w.n]||[]).length;
  const tot=days.reduce((n,d)=>n+dayMinutes(d),0),done=days.reduce((n,d)=>n+dayCounts(d).done,0),all=days.reduce((n,d)=>n+dayCounts(d).n,0);
  let html=`<aside class="tside"><div class="card"><div class="eyebrow" style="margin-bottom:4px">This week</div><div class="muted" style="font-size:13px;margin-bottom:10px">${all} session${all===1?"":"s"} · ${fmtMins(tot)}${all?` · ${done} done`:""}${due&&cur===todayWeek()?` · <b>${due} recall due</b>`:""}</div><div class="wk">`;
  days.forEach(d=>{const live=d.items.filter(it=>it.key||it.kind==="catchup"||it.kind==="exam");
    html+=`<div class="wd ${d.i===curDay?"sel":""}"><button class="d ${d.i===ti?"today":""}" data-wday="${d.i}"><small>${DAYN[d.i]}</small>${d.date.getDate()}</button><div>`;
    if(!live.length)html+=`<div class="none">—</div>`;
    live.forEach(it=>{if(!it.key){html+=`<div class="ws"><i style="background:var(--rest)"></i><span>${it.kind==="catchup"?"Catch-up week":"Exam season"}</span></div>`;return;}
      html+=`<button class="ws ${itemDone(it)?"done":""} ${it.skipped?"skip":""}" data-wsess="${d.i}|${esc(it.key)}"><i style="background:${itemColor(it)}"></i><span>${esc(sessTitle(it))}</span></button>`;});
    html+=`</div></div>`;});
  html+=`</div></div>`;
  const up=TESTS.filter(t=>t.week>=todayWeek()).slice(0,3);
  if(up.length)html+=`<div class="card" style="margin-top:12px"><div class="eyebrow" style="margin-bottom:6px">Coming up</div>`+up.map(t=>`<div style="font-size:13px;padding:4px 0"><b>${esc(t.title)}</b><span class="muted"> · week ${t.week}</span></div>`).join("")+`</div>`;
  return html+`</aside>`;}
/* Everything the week holds, on one page, for printing. */
function printWeek(w,days){
  return `<div class="printweek"><h1>Week ${w.n} · ${esc(w.label)} · ${fmt(w.start)} – ${fmt(addDays(w.start,6))}</h1>`+days.map(d=>`<div class="pday"><h3>${DAYN[d.i]} ${d.date.getDate()}</h3>`+(d.items.filter(it=>!it.skipped).map(it=>{const t=it.entry&&it.entry.topic;const name=it.subj?SUBJECTS[it.subj].name:(it.kind==="test"?"Test":(it.kind==="flash"?"Cards":(it.kind==="catchup"?"Catch-up":"Exams")));const title=t?t[1]:(it.entry&&it.entry.kind==="rev"?`Recall: ${secName(it.entry.section)}`:(it.entry&&it.entry.label)||(it.test&&it.test.title)||(it.kind==="flash"?"Cards & poems":""));const m=it.entry?mins(it.entry.hours):(it.test?it.test.mins:30);return `<div class="prow"><span class="pn">${esc(name)}</span><span>${esc(title)}</span><span class="pm">${m} min</span><span class="box"></span></div>`;}).join("")||`<div class="prow muted">—</div>`)+`</div>`).join("")+`</div>`;}

/* One session. Collapsed to a row; the row opens to the full card. */
function sessTitle(it){
  if(it.kind==="topic")return it.entry.topic[1];
  if(it.kind==="rev")return (isSchool(it.subj)?"Recall: ":"Past-paper questions: ")+secName(it.entry.section);
  if(it.kind==="fixed")return it.entry.label;
  if(it.kind==="test")return it.test.title;
  if(it.kind==="flash")return "Cards & poems";
  return "";}
function sessMins(it){return it.entry?mins(it.entry.hours):(it.test?it.test.mins:30);}
function menu(it,w,d){
  if(menuKey!==it.key)return "";
  const mv=state.moves[it.key],sk=state.skips[it.key];
  const later=(()=>{const cands=[];for(let i=d.i+1;i<=5;i++)cands.push(i);if(!cands.length)return null;const days=buildDays(w);return cands.sort((a,b)=>dayMinutes(days[a])-dayMinutes(days[b]))[0];})();
  return `<div class="menu">
    ${mv||sk?`<button data-unmove="${esc(it.key)}">↺ Put it back${mv?` (${esc(it.movedFrom||"")})`:""}</button>`:""}
    ${d.i<6?`<button data-move="${esc(it.key)}|${w.n}|${d.i+1}">Do tomorrow</button>`:""}
    ${later!=null&&later!==d.i+1?`<button data-move="${esc(it.key)}|${w.n}|${later}">Later this week (${DAYN[later]})</button>`:""}
    ${w.n<TOTAL?`<button data-move="${esc(it.key)}|${w.n+1}|0">Next week</button>`:""}
    ${sk?"":`<button data-skip="${esc(it.key)}" class="danger">Skip it</button>`}
  </div>`;}
function renderItem(it,w,d){
  if(it.kind==="catchup"||it.kind==="exam")return renderSpecial(it,w);
  const done=itemDone(it),open=openSess.has(it.key)&&!it.skipped,color=itemColor(it);
  const name=it.subj?SUBJECTS[it.subj].name:(it.kind==="test"?"Test":"English & science");
  const tag=it.skipped?`<span class="tag">skipped</span>`:(it.movedFrom?`<span class="tag">from ${esc(it.movedFrom)}</span>`:"");
  const multi=it.kind==="topic"&&it.entry.parts>1;
  let html=`<div class="sess ${done?"isdone":""} ${it.skipped?"isskip":""} ${open?"open":""}" style="--c:${color}">
    <div class="row"><button class="grab" data-open="${esc(it.key)}" aria-expanded="${open}"><span class="bar"></span><span class="pill"><span class="dot" style="background:${color}"></span>${esc(name)}</span><span class="title">${esc(sessTitle(it))}${multi?` <span class="muted">· part ${it.entry.partNo} of ${it.entry.parts}</span>`:""}</span>${tag}<span class="mins num">${sessMins(it)} min</span></button>
    ${it.kind==="test"?"":`<button class="tick ${done?"on":""}" data-sess="${esc(it.key)}" ${it.kind==="topic"?`data-topic="${esc(it.entry.topic.id)}" data-final="${it.entry.final?1:0}"`:""} aria-label="${done?"Done":"Mark as done"}" ${it.skipped?"disabled":""}>✓</button>`}
    <button class="more" data-menu="${esc(it.key)}" aria-label="Move or skip">⋯</button>${menu(it,w,d)}</div>`;
  if(open)html+=`<div class="body">${itemBody(it,w)}</div>`;
  return html+`</div>`;}
function itemBody(it,w){
  if(it.kind==="topic"){const t=it.entry.topic,stt=T(t.id),done=itemDone(it);
    return `<div class="sub">Spec ${esc(t[0])}${it.entry.parts>1&&!it.entry.final?" · carry on where you left off":""}${stt.known?" · ticked as already known":""}</div>
    ${objBlock(t)}${stmtBlock(t)}${cardBlock(t)}${linkBar(it.subj,t)}${pinRow(t)}
    ${done?"":`<div class="steps">
      <div class="step"><span class="n">1</span><div><b>Read the notes · 20 min</b><span>Open the revision notes above for this topic. Then close them and write down what you remember. Fill the gaps.</span></div></div>
      <div class="step"><span class="n">2</span><div><b>Topic questions · 30 min</b><span>${it.subj==="bus"||it.subj==="econ"?"Work through the topic questions, then write one extended answer using a chain of reasoning: point → because → which means → therefore.":it.subj==="cs"?"Work through the topic questions, then 15 minutes of Python on this idea.":"Work through the topic questions, hardest first. The easy ones don't move you towards a 9."}</span></div></div>
      ${it.entry.final?`<div class="step"><span class="n">3</span><div><b>Check yourself · 10 min</b><span>Close everything and do a few more questions from memory. Then answer the question below honestly.</span></div></div>`:""}
    </div>`}
    ${it.entry.final&&done?`<div class="selfcheck"><span class="q">Could you do it without notes?</span><button class="btn small ${stt.mark==="got"?"done":""}" data-mark="${t.id}|got">Yes</button><button class="btn small ${stt.mark==="shaky"?"done":""}" data-mark="${t.id}|shaky">Not really</button>${stt.mark?`<span class="mark ${stt.mark}">${stt.mark==="got"?"Solid":"On the fix list"}</span>`:""}</div>`:""}`;}
  if(it.kind==="rev"){const S=SUBJECTS[it.subj];
    if(isSchool(it.subj)){const known=S.topics.filter(t=>T(t.id).known||T(t.id).done);
      return `<div class="sub">School sets the pace in ${esc(S.name)}, so this is recall, not new content. Closed book.</div>
      <div class="steps"><div class="step"><span class="n">1</span><div><b>Pick a topic school has covered</b><span>${known.length?`You have ticked ${known.length} as known. Take one from this section, or the one you are least sure of.`:`Nothing ticked yet, so the app does not know where you are in ${esc(S.name)}. <button class="btn small" data-walkstart="${esc(it.subj)}" style="margin-top:6px">Where am I up to? ›</button>`}</span></div></div>
      <div class="step"><span class="n">2</span><div><b>Blank page, everything you know · 15 min</b><span>Write it out from memory: definitions, formulae, the diagram, the mark scheme phrases. No notes.</span></div></div>
      <div class="step"><span class="n">3</span><div><b>Check and patch · 15 min</b><span>Open the notes. Anything you missed goes on a card below its topic, and the topic gets marked shaky if it was bad.</span></div></div></div>
      ${linkBar(it.subj,null)}`;}
    return `<div class="sub">Timed. Mark with the mark scheme. Anything you drop, write on a "mistakes" page and re-do next week.</div>${linkBar(it.subj,null)}`;}
  if(it.kind==="fixed")return `<div class="sub">${esc(it.entry.note||"")}</div>${linkBar(it.subj,null)}`;
  if(it.kind==="test"){const t=it.test,ts=TS(t.id);
    return `<div class="sub">${esc(t.desc)}</div>
    <div class="links">${t.subjects.filter(s=>SUBJECTS[s]).flatMap(s=>SUBJECTS[s].resources.filter(r=>/paper|question/i.test(r.label)).map(r=>`<a class="btn small" href="${esc(r.url)}">${esc(SUBJECTS[s].name)}: ${esc(r.label)} ↗</a>`)).join("")}</div>
    <div class="scores">`+t.subjects.filter(s=>SUBJECTS[s]).map(s=>{const m=ts.marks[s];
      return `<label><span class="s"><span class="dot" style="background:${SUBJECTS[s].color}"></span>${SUBJECTS[s].name}</span><button class="btn small ${m==="got"?"done":""}" data-tmark="${t.id}|${s}|got">Solid</button><button class="btn small ${m==="shaky"?"done":""}" data-tmark="${t.id}|${s}|shaky">Shaky</button></label>`;}).join("")+`</div>
    <p class="muted" style="font-size:13px;margin:4px 0 0">Mark it with the mark scheme, then say for each subject whether it held up. Anything shaky goes on the fix list.</p>`;}
  if(it.kind==="flash"){const n=Object.values(state.cards).reduce((a,c)=>a+c.length,0);
    return `<div class="sub">Quick retrieval on your own cards — poems, formulae, definitions. ${n?`You have ${n} card${n===1?"":"s"}.`:"You have no cards yet: add some under any topic."} Then rest — Sunday is yours.</div>`;}
  return "";}
function renderSpecial(it,w){
  if(it.kind==="catchup"){const overdue=[];WEEKS.slice(0,w.n-1).forEach(x=>SUBJ_IDS.forEach(s=>x.plan[s].forEach(e=>{if(e.kind==="topic"&&e.final&&!T(e.topic.id).done)overdue.push(e.topic);})));
    return `<div class="card lift session" style="--c:var(--rest)"><div class="head"><span class="pill">${esc(w.label)}</span></div><h2>Catch-up week</h2><div class="sub">No new content. Clear the fix list, finish anything unticked below, then have a proper rest.${w.type==="summer"?" (Summer sessions appear on weekdays.)":""}</div>
    ${overdue.length?`<div class="eyebrow" style="margin-bottom:6px">Unfinished topics</div>`+overdue.slice(0,10).map(t=>`<div class="topic"><input type="checkbox" data-done="${t.id}" aria-label="Done"><div><div class="t"><span class="code">${esc(t[0])}</span>${esc(t[1])}</div><div class="m">${SUBJECTS[t.subj].name}</div></div><span></span></div>`).join("")+(overdue.length>10?`<p class="muted" style="font-size:14px">+${overdue.length-10} more in Subjects.</p>`:""):`<p style="margin:0" class="muted">Nothing unfinished. Enjoy the break.</p>`}</div>`;}
  return `<div class="card lift session" style="--c:var(--bad)"><h2>Exam season</h2><div class="sub">Write each paper's date into its subject page once the 2028 timetables are published. Between papers: revise only the next paper, briefly, and sleep.</div></div>`;}

function bind(root){
  root.querySelectorAll("[data-walkstart]").forEach(b=>b.addEventListener("click",()=>startWalk(b.dataset.walkstart)));
  root.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.open;if(openSess.has(k))openSess.delete(k);else openSess.add(k);menuKey=null;render();}));
  root.querySelectorAll("[data-menu]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();menuKey=menuKey===b.dataset.menu?null:b.dataset.menu;render();}));
  root.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>{const[key,wk,day]=b.dataset.move.split("|");state.moves[key]={week:+wk,day:+day};delete state.skips[key];menuKey=null;persist();render();}));
  root.querySelectorAll("[data-unmove]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.unmove;delete state.moves[k];delete state.skips[k];menuKey=null;persist();render();}));
  root.querySelectorAll("[data-skip]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.skip;state.skips[k]=true;delete state.moves[k];openSess.delete(k);menuKey=null;persist();render();}));
  root.querySelectorAll("[data-sess]").forEach(b=>b.addEventListener("click",()=>{const key=b.dataset.sess;const on=!state.sessions[key];state.sessions[key]=on;
    if(on)markDay();
    if(b.dataset.topic&&b.dataset.final==="1"){const t=T(b.dataset.topic);t.done=on;if(!on){t.mark=null;t.fixed=false;t.known=false;}}
    if(on)openSess.delete(key);persist();render();}));
  root.querySelectorAll("[data-done]").forEach(cb=>cb.addEventListener("change",()=>{const t=T(cb.dataset.done);t.done=cb.checked;if(cb.checked)markDay();else{t.mark=null;t.fixed=false;t.known=false;}persist();render();}));
  root.querySelectorAll("[data-mark]").forEach(b=>b.addEventListener("click",()=>{const[id,v]=b.dataset.mark.split("|");const t=T(id);
    t.mark=t.mark===v?null:v;if(t.mark!=="shaky")t.fixed=false;markDay();persist();render();}));
  root.querySelectorAll("[data-tmark]").forEach(b=>b.addEventListener("click",()=>{const[id,s,v]=b.dataset.tmark.split("|");const ts=TS(id);ts.marks=ts.marks||{};
    ts.marks[s]=ts.marks[s]===v?null:v;ts.fixed=ts.fixed||{};ts.fixed[s]=false;markDay();persist();render();}));
  root.querySelectorAll("[data-stmtbox]").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)openStmt.add(d.dataset.stmtbox);else openStmt.delete(d.dataset.stmtbox);}));
  root.querySelectorAll("[data-cardbox]").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)openCards.add(d.dataset.cardbox);else openCards.delete(d.dataset.cardbox);}));
  root.querySelectorAll("[data-stmt]").forEach(cb=>cb.addEventListener("change",()=>{
    if(cb.checked){state.stmts[cb.dataset.stmt]=true;markDay();}else delete state.stmts[cb.dataset.stmt];
    persist();render();}));
  root.querySelectorAll("[data-addcard]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.addcard;const f=root.querySelector(`[data-cardf="${CSS.escape(id)}"]`),bk=root.querySelector(`[data-cardb="${CSS.escape(id)}"]`);
    if(!f.value.trim()||!bk.value.trim()){f.focus();return;}(state.cards[id]=state.cards[id]||[]).push({f:f.value.trim(),b:bk.value.trim()});openCards.add(id);markDay();persist();render();
    root.querySelector(`[data-cardf="${CSS.escape(id)}"]`)?.focus();}));
  root.querySelectorAll("[data-cardf],[data-cardb]").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"){const id=i.dataset.cardf||i.dataset.cardb;root.querySelector(`[data-addcard="${CSS.escape(id)}"]`)?.click();}}));
  root.querySelectorAll("[data-delcard]").forEach(b=>b.addEventListener("click",()=>{const[id,i]=b.dataset.delcard.split("|");(state.cards[id]||[]).splice(+i,1);persist();render();}));
  root.querySelectorAll("[data-flip]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.flip;if(revealed.has(k))revealed.delete(k);else revealed.add(k);render();}));
  root.querySelectorAll("[data-rq]").forEach(b=>b.addEventListener("click",()=>{const[key,i,v]=b.dataset.rq.split("|");(recallMarks[key]=recallMarks[key]||{})[i]=v==="1";render();}));
  root.querySelectorAll("[data-fix]").forEach(cb=>cb.addEventListener("change",()=>toggleFix(cb.dataset.fix)));
  root.querySelectorAll("[data-pass]").forEach(b=>b.addEventListener("click",()=>passReview(b.dataset.pass)));
  root.querySelectorAll("[data-fail]").forEach(b=>b.addEventListener("click",()=>failReview(b.dataset.fail)));
  root.querySelectorAll("[data-morelinks]").forEach(b=>b.addEventListener("click",()=>{openLinks.add(b.dataset.morelinks);render();}));
  root.querySelectorAll("[data-pin]").forEach(b=>b.addEventListener("click",()=>{pinning=pinning===b.dataset.pin?null:b.dataset.pin;render();}));
  root.querySelectorAll("[data-pinsave]").forEach(b=>b.addEventListener("click",()=>pinLink(b.dataset.pinsave)));
}
/* Pinning writes into the plan itself, so the link survives everything. */
async function pinLink(topicId){
  const box=document.getElementById("pinurl");if(!box||!CFG)return;
  const url=box.value.trim();
  const[subjId]=topicId.split(":");
  const S=CFG.subjects.find(s=>s.id===subjId);if(!S)return;
  const code=topicId.slice(subjId.length+1);
  const t=S.topics.find(t=>t.code===code);if(!t)return;
  t.url=url;pinning=null;
  try{await invoke("save_config",{config:CFG});await reloadPlan();CFG=await invoke("get_config");}catch(e){}
  render();
}

/* ---------- CATCHING UP ---------- */
async function reloadPlan(){
  try{applyPlan(await invoke("get_plan",{catchUp:state.catchUp||null}));return true;}
  catch(e){return false;}}
function doneList(){const done=[];SUBJ_IDS.forEach(s=>SUBJECTS[s].topics.forEach(t=>{if(T(t.id).done)done.push(t.id);}));return done;}
async function repour(silent){
  const wk=todayWeek();const done=doneList();
  if(!silent&&!confirm(`Re-pour everything you have not finished, starting from week ${wk}?\n\nThe ${done.length} topic${done.length===1?"":"s"} you have already done stay done. Weeks before ${wk} keep their record. You can undo this.`))return;
  state.catchUp={fromWeek:wk,done,at:todayISO()};state.knownDirty=0;
  persist();await reloadPlan();if(!silent){cur=todayWeek();curDay=null;}render();}
const doCatchUp=()=>repour(false);
async function undoCatchUp(){
  if(!confirm("Put the plan back the way it was originally laid out?"))return;
  delete state.catchUp;persist();await reloadPlan();cur=todayWeek();curDay=null;render();}
function behindCount(){const now=todayWeek();
  return SUBJ_IDS.reduce((n,s)=>n+SUBJECTS[s].topics.filter(t=>TOPIC_DUE[t.id]<now&&!T(t.id).done).length,0);}
function catchUpCard(){
  const behind=behindCount(),cu=state.catchUp;
  let html=`<div class="card" style="margin-top:14px"><div class="eyebrow" style="margin-bottom:6px">Falling behind</div>`;
  if(cu)html+=`<p class="muted" style="font-size:13.5px;margin:0 0 10px">Plan re-poured from week ${cu.fromWeek} on ${esc(cu.at||"")}, with ${cu.done.length} topic${cu.done.length===1?"":"s"} already finished at that point.</p>`;
  html+=`<p class="muted" style="font-size:13.5px;margin:0 0 10px">${behind?`${behind} topic${behind===1?" was":"s were"} due by now and ${behind===1?"is":"are"} still unticked.`:"Nothing is overdue."} Catching up moves everything unfinished forward from this week, so a lost month stops counting against you for the rest of the two years.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn small ${behind?"primary":""}" id="catchup">Catch up from week ${todayWeek()}</button>${cu?`<button class="btn small" id="uncatchup">Undo</button>`:""}</div>`;
  if(UNSCHEDULED.length)html+=`<div class="watch" style="margin:12px 0 0"><b>Does not fit</b><span>${UNSCHEDULED.length} topic${UNSCHEDULED.length===1?" no longer fits":"s no longer fit"} before the exams. Raise your weekly hours in Plan, or accept that ${UNSCHEDULED.length===1?"it will":"they will"} not be covered.</span></div>`;
  return html+`</div>`;}

/* ---------- SPEC COVERAGE ---------- */
function coversRef(code,ref){
  if(code===ref)return true;
  const rest=code.slice(ref.length);
  return code.startsWith(ref)&&rest.length>0&&/^[a-z]+$/i.test(rest);}
function coverageCard(subj){
  const S=SUBJECTS[subj];if(!S)return "";
  if(!S.specRefs.length)
    return `<div class="card" style="margin-bottom:14px;border-color:var(--warn)"><div class="eyebrow" style="color:var(--warn)">Not yet checked against the spec</div>
      <p class="muted" style="font-size:13.5px;margin:8px 0 0">These topics were written from knowledge of the course, not from the specification document. Check them against the <a href="${esc(S.spec)}">official specification ↗</a>.</p></div>`;
  const rows=S.specRefs.map(r=>{const ts=S.topics.filter(t=>coversRef(t[0],r));const done=ts.filter(t=>T(t.id).done).length;return {ref:r,n:ts.length,done};});
  const full=rows.filter(r=>r.n>0).length, doneRefs=rows.filter(r=>r.n>0&&r.done===r.n).length;
  return `<div class="card" style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:4px">Specification coverage</div>
    <p class="muted" style="font-size:13.5px;margin:0 0 10px">All ${rows.length} content references in the <a href="${esc(S.spec)}">official specification ↗</a> are covered by a topic${full===rows.length?"":` — ${rows.length-full} are not`}. ${doneRefs} finished so far.</p>
    <div class="refs">${rows.map(r=>`<span class="ref ${r.n===0?"gap":(r.done===r.n?"full":(r.done?"part":""))}" title="${r.n===0?"No topic covers this":`${r.done} of ${r.n} topics done`}">${esc(r.ref)}</span>`).join("")}</div>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">Filled = finished, half = started, outline = still to come. Coverage is checked by a test whenever the app is built.</p></div>`;}

/* ---------- WHERE AM I UP TO? ----------
   The whole course laid out one topic at a time, in specification order.
   "Done this" ticks it as known and shows the next; "Not yet" is where you
   are. Built for Maths, where the user is ahead of school, but works for any
   subject. */
let walk=null; // {subj, idx, stopped, set:[ids ticked during this walk]}
function startWalk(subj){const S=SUBJECTS[subj];const idx=S.topics.findIndex(t=>!T(t.id).known);walk={subj,idx:idx<0?S.topics.length:idx,stopped:false,set:[]};curSubj=subj;knowMode=false;openTopic=null;showView("subjects");}
function renderWalk(el){
  const S=SUBJECTS[walk.subj],n=S.topics.length,kn=S.topics.filter(t=>T(t.id).known).length;
  let html=`<button class="back" id="wback">‹ ${esc(S.name)}</button>`;
  if(walk.idx>=n){
    html+=`<div class="card walk"><div class="eyebrow">${esc(S.name)} · where are you up to?</div><h2 style="font-size:22px;margin:6px 0 8px">That's the whole course</h2>
      <p class="muted" style="font-size:14px;margin:0 0 14px">${kn} of ${n} topics ticked as known. Each comes back for a recall check — the first ones in ${REVIEW_GAPS[0]} days. ${isSchool(walk.subj)?"":"Re-pour the plan so the freed hours go to what is left."}</p>
      <button class="btn primary" id="wdone">Done</button></div>`;
  }else{
    const t=S.topics[walk.idx],rv=state.reviews["t:"+t.id];
    html+=`<div class="card walk"><div class="walkhead"><span class="eyebrow">${esc(S.name)} · where are you up to?</span><span class="chip">${walk.idx+1} of ${n}</span></div>
      <div class="prog" style="margin:8px 0 16px"><i style="width:${Math.round(100*walk.idx/n)}%;background:${S.color}"></i></div>`;
    if(walk.stopped){
      html+=`<div class="eyebrow" style="color:var(--accent)">You are up to here</div><div class="wcode">${esc(t[0])}</div><h2 style="font-size:22px;margin:2px 0 10px">${esc(t[1])}</h2>
        <p class="muted" style="font-size:14px;margin:0 0 14px">${kn} topic${kn===1?"":"s"} before this ${kn===1?"is":"are"} ticked as known and will come back for recall checks, a few a day. This one and everything after it stays unticked${isSchool(walk.subj)?" — tick them as school gets there.":" and the schedule starts from here once you re-pour."}</p>
        <div class="wbtns"><button class="btn primary" id="wstop">Stop here</button><button class="btn" id="wcont">School has skipped around — keep checking the rest</button></div></div>`;
    }else{
      html+=`<div class="wcode">${esc(t[0])}</div><h2 style="font-size:22px;margin:2px 0 12px">${esc(t[1])}</h2>
        ${objBlock(t)}${stmtBlock(t)}
        <div class="wbtns"><button class="btn primary" data-walk="done">✓ Done this — next</button><button class="btn" data-walk="not">Not yet — I'm up to here</button></div>
        <div class="wsub"><button data-walk="skip">Not sure, skip it</button>${walk.set.length||walk.idx>0?`<span>·</span><button data-walk="back">‹ Undo last</button>`:""}${t.known?"":""}</div></div>`;
    }
  }
  el.innerHTML=html;
  el.querySelector("#wback").addEventListener("click",()=>{walk=null;render();});
  el.querySelector("#wdone")?.addEventListener("click",()=>{walk=null;render();});
  el.querySelector("#wstop")?.addEventListener("click",()=>{walk=null;render();});
  el.querySelector("#wcont")?.addEventListener("click",()=>{walk.stopped=false;walk.idx++;render();});
  el.querySelectorAll("[data-walk]").forEach(b=>b.addEventListener("click",()=>{
    const S=SUBJECTS[walk.subj],t=S.topics[walk.idx];
    if(b.dataset.walk==="done"){if(!T(t.id).known){setKnown(t.id,true);walk.set.push(t.id);}walk.idx++;markDay();persist();}
    else if(b.dataset.walk==="not"){walk.stopped=true;}
    else if(b.dataset.walk==="skip"){walk.idx++;}
    else if(b.dataset.walk==="back"&&walk.idx>0){walk.idx--;const p=S.topics[walk.idx];if(walk.set.includes(p.id)){setKnown(p.id,false);walk.set=walk.set.filter(x=>x!==p.id);persist();}}
    render();}));
  bind(el);
}

/* ---------- SUBJECTS ---------- */
let curSubj=null,query="",knowMode=false;
/* Topics grouped under the specification's own sections, by code prefix. */
function sectionOf(S,code){const keys=S.sections.map(l=>l.split(" ")[0]);let best=null;
  for(const k of keys){if(code===k||coversRef(code,k)||code.startsWith(k+".")){if(!best||k.length>best.length)best=k;}}return best;}
function grouped(S){const groups=[];const by={};
  S.topics.forEach(t=>{const k=sectionOf(S,t[0])||"";if(!by[k]){by[k]={key:k,label:S.sections.find(l=>l.split(" ")[0]===k)||(k?k:"Topics"),topics:[]};groups.push(by[k]);}by[k].topics.push(t);});
  return groups;}
function setKnown(id,on){const t=T(id);const tp=findTopic(id);
  if(on){t.done=true;t.known=true;t.knownAt=todayISO();t.mark=null;t.fixed=false;if(tp)scheduleReview("t:"+id,`${SUBJECTS[tp.subj].name}: ${tp[1]}`);}
  else{t.done=false;t.known=false;delete t.knownAt;delete state.reviews["t:"+id];}
  if(tp&&!isSchool(tp.subj))state.knownDirty=(state.knownDirty||0)+1;}

      if(openTopic===t.id)html+=`<div class="tbody">${objBlock(t)}${stmtBlock(t)}${cardBlock(t)}${linkBar(curSubj,t)}${pinRow(t)}</div>`;});});

  el.innerHTML=html;el.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>{cur=+b.dataset.goto;curDay=5;showView("today");}));
  el.querySelector("#catchup")?.addEventListener("click",doCatchUp);
  el.querySelector("#uncatchup")?.addEventListener("click",undoCatchUp);
}
function trow(t){const w=WEEKS[t.week-1],ts=TS(t.id);
  return `<div class="trow"><div><b>${esc(t.title)}</b><div class="muted" style="font-size:13px">Week ${t.week} · Sat ${fmt(addDays(w.start,5))} ${w.start.getFullYear()} · ${t.mins} min</div></div><button class="btn small" data-goto="${t.week}">Open</button><div class="chips">${t.subjects.filter(s=>SUBJECTS[s]).map(s=>{const m=ts.marks[s];return `<span class="chip ${m==="shaky"?"bad":(m==="got"?"ok":"")}">${SUBJECTS[s].name.split(" ")[0]}${m?(m==="got"?" ✓":" ↻"):" –"}</span>`;}).join("")}</div></div>`;}

/* ---------- PLAN EDITOR ----------
   Edits a copy of the configuration in memory and only sends it to Rust on
   Save, which reschedules the whole two years and hands the new plan back. */
let CFG=null,dirty=false,openSubj=null,planMsg="";
let drafting=false,draftName="",draftUrl="",draftText="",draftMsg="";
const PALETTE=["var(--maths)","var(--fpm)","var(--bus)","var(--econ)","var(--cs)"];
const KINDS=[["term","Term"],["half","Half-term"],["holiday","Holiday"],["summer","Summer holiday"],["exam","Exam season"]];
const CODES=["A1","A2","S1","S2","U1","U2","H","X"];
function setPath(path,val){const ks=path.split(".");let o=CFG;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;
  dirty=true;const m=document.getElementById("planmsg");if(m)m.textContent="Unsaved changes";}
function delPath(path){const ks=path.split(".");let o=CFG;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];const k=ks[ks.length-1];
  if(Array.isArray(o))o.splice(+k,1);else delete o[k];dirty=true;}

function renderPlan(){

    html+=`<details class="acc" ${openSubj===i?"open":""} data-acc="${i}"><summary><span class="dot" style="width:12px;height:12px;border-radius:4px;background:${esc(s.color)}"></span>${esc(s.name)} <span class="muted" style="font-weight:400;font-size:14px">${s.topics.length} topics</span></summary><div class="body">
