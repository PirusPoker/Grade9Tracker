      <div class="ed"><span class="ed-lbl">Every term week, regardless</span>
        ${(s.weekly||[]).map((wk,j)=>`<div class="ed-row" style="grid-template-columns:1fr 4.5em auto"><input type="text" data-p="subjects.${i}.weekly.${j}.label" value="${esc(wk.label)}" aria-label="Session"><input type="number" min="0.25" step="0.25" data-p="subjects.${i}.weekly.${j}.hours" data-num="1" value="${wk.hours}" aria-label="Hours"><button class="icon" data-del="subjects.${i}.weekly.${j}" aria-label="Remove">×</button></div><textarea data-p="subjects.${i}.weekly.${j}.note" placeholder="What to do in it" style="font-size:13px;min-height:44px">${esc(wk.note||"")}</textarea>`).join("")}
        <button class="btn small" data-add="weekly:${i}">+ Add a fixed weekly session</button>
        <span class="muted" style="font-size:13px">A timed writing piece, a past paper — anything that should happen every week whatever the topics are doing.</span></div>
      <div class="ed"><span class="ed-lbl">Where its sessions send you</span>
        ${s.resources.map((r,j)=>`<div class="ed-row" style="grid-template-columns:8em 1fr auto"><input type="text" data-p="subjects.${i}.resources.${j}.label" value="${esc(r.label)}" aria-label="Label"><input type="url" data-p="subjects.${i}.resources.${j}.url" value="${esc(r.url)}" aria-label="Link"><button class="icon" data-del="subjects.${i}.resources.${j}" aria-label="Remove">×</button></div>`).join("")}
        <button class="btn small" data-add="res:${i}">+ Add a link</button>
        <span class="muted" style="font-size:13px">Save My Exams needs your own account — these only open the right page of it.</span></div>
      <div class="ed"><span class="ed-lbl">Hours a week</span>
        <div class="ed-row band muted" style="font-size:12px"><span>From week</span><span>In term</span><span>In summer</span><span></span></div>
        ${s.rates.map((b,j)=>`<div class="ed-row band"><input type="number" min="1" step="1" data-p="subjects.${i}.rates.${j}.fromWeek" data-num="1" value="${b.fromWeek}"><input type="number" min="0" step="0.5" data-p="subjects.${i}.rates.${j}.term" data-num="1" value="${b.term}"><input type="number" min="0" step="0.5" data-p="subjects.${i}.rates.${j}.summer" data-num="1" value="${b.summer}"><button class="icon" data-del="subjects.${i}.rates.${j}" aria-label="Remove">×</button></div>`).join("")}
        <button class="btn small" data-add="rate:${i}">+ Change the hours from a week on</button></div>
      <div class="ed"><span class="ed-lbl">Topics — in the order you will learn them</span>
        ${s.topics.map((t,j)=>`<div style="padding:3px 0"><div class="ed-row topic"><input type="text" data-p="subjects.${i}.topics.${j}.code" value="${esc(t.code)}" aria-label="Spec code"><input type="text" data-p="subjects.${i}.topics.${j}.title" value="${esc(t.title)}" aria-label="Topic"><input type="number" min="0.5" step="0.5" data-p="subjects.${i}.topics.${j}.hours" data-num="1" value="${t.hours}" aria-label="Hours"><button class="icon" data-del="subjects.${i}.topics.${j}" aria-label="Remove">×</button></div><details class="sub-ed"><summary>Link &amp; course notes${(t.objectives||[]).length?` · ${t.objectives.length} objectives`:""}${t.url?" · linked":""}</summary><div class="inner"><input type="url" data-p="subjects.${i}.topics.${j}.url" value="${esc(t.url||"")}" placeholder="Exact link for this topic" style="font-size:13px"><textarea data-p="subjects.${i}.topics.${j}.objectives" data-lines="1" placeholder="What you must be able to do — one per line" style="font-size:13px">${esc((t.objectives||[]).join("\n"))}</textarea><input type="text" data-p="subjects.${i}.topics.${j}.watch" value="${esc(t.watch||"")}" placeholder="The mark people drop on this topic" style="font-size:13px"></div></details></div>`).join("")}
        <button class="btn small" data-add="topic:${i}">+ Add a topic</button></div>
      <button class="btn small" data-delsubj="${i}">Delete this subject</button>
    </div></details>`;});
  html+=`<button class="btn wide" data-add="subject" style="margin-bottom:8px">+ Add a subject by hand</button>
  <details class="acc" id="drafter" ${drafting?"open":""}><summary>✦ Draft a subject from a specification</summary><div class="body">
    <p class="muted" style="font-size:13.5px;margin:10px 0 12px">Give it a public spec page — a Pearson or AQA syllabus, an exam-board topic list — and it drafts the topics, hours, objectives and common mistakes for you. For a PDF, or anything behind a login, copy the spec text and paste it in the box instead. Save My Exams pages need an account, so they will not work here.</p>
    <div class="ed" style="border:0;padding:0">
      <input type="text" id="dname" placeholder="Subject name, e.g. Physics" value="${esc(draftName)}">
      <input type="url" id="durl" placeholder="https://qualifications.pearson.com/…" value="${esc(draftUrl)}">
      <textarea id="dtext" placeholder="…or paste the specification text here">${esc(draftText)}</textarea>
      <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="dgo">Draft it</button><span class="muted" style="font-size:13.5px" id="dmsg">${esc(draftMsg)}</span></div>
    </div></div></details>
  <div style="height:14px"></div>

  <div class="eyebrow" style="margin-bottom:8px">Term dates</div>
  <div class="card" style="margin-bottom:22px"><p class="muted" style="font-size:13px;margin:0 0 12px">Each row is a run of weeks starting on a Monday. Only weeks marked <b>Term</b> get new topics. The block code decides where mocks land: end-of-term mocks go at the end of A2, S2 and U2.</p>`;
  CFG.blocks.forEach((b,i)=>{
    html+=`<div class="ed"><div class="ed-row block"><input type="date" data-p="blocks.${i}.start" value="${esc(b.start)}" aria-label="First Monday"><input type="number" min="1" max="60" data-p="blocks.${i}.weeks" data-num="1" value="${b.weeks}" aria-label="Weeks"><select data-p="blocks.${i}.kind" aria-label="Kind">${KINDS.map(k=>`<option value="${k[0]}" ${b.kind===k[0]?"selected":""}>${k[1]}</option>`).join("")}</select><button class="icon" data-del="blocks.${i}" aria-label="Remove">×</button></div>
      <div class="ed-row" style="grid-template-columns:1fr 6em 5em"><input type="text" data-p="blocks.${i}.label" value="${esc(b.label)}" aria-label="Label"><select data-p="blocks.${i}.block" aria-label="Block code">${CODES.map(c=>`<option value="${c}" ${b.block===c?"selected":""}>${c}</option>`).join("")}</select><input type="number" min="7" max="13" data-p="blocks.${i}.year" data-num="1" value="${b.year}" aria-label="Year group"></div></div>`;});
  html+=`<button class="btn small" data-add="block">+ Add a block</button></div>

  <div class="eyebrow" style="margin-bottom:8px">Review</div>
  <div class="card" style="margin-bottom:22px">
    <div class="ed"><span class="ed-lbl">Anything shaky comes back after (days)</span><div class="ed-row" style="grid-template-columns:repeat(3,1fr)">${CFG.reviewGaps.map((g,i)=>`<input type="number" min="1" max="365" data-p="reviewGaps.${i}" data-num="1" value="${g}">`).join("")}</div><span class="muted" style="font-size:13px">Clear something off the fix list and it returns after the first gap, then the second, then the third — and is done.</span></div>
  </div>

  <div class="savebar"><span class="msg" id="planmsg">${planMsg||(dirty?"Unsaved changes":"Saved")}</span><button class="btn small" id="resetplan">Reset</button><button class="btn primary small" id="saveplan">Save plan</button></div>`;

  el.innerHTML=html;
  el.querySelectorAll("[data-p]").forEach(inp=>{const h=()=>setPath(inp.dataset.p, inp.dataset.num ? (inp.value===""?0:+inp.value) : (inp.dataset.lines ? inp.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean) : inp.value));
    inp.addEventListener("input",h);inp.addEventListener("change",h);});
  el.querySelectorAll("[data-acc]").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)openSubj=+d.dataset.acc;else if(openSubj===+d.dataset.acc)openSubj=null;}));
  el.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{delPath(b.dataset.del);render();}));
  el.querySelectorAll("[data-delsubj]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.delsubj;
    if(!confirm(`Delete ${CFG.subjects[i].name} and all its topics from the plan?`))return;
    CFG.subjects.splice(i,1);openSubj=null;dirty=true;render();}));
  el.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{
    const [what,idx]=b.dataset.add.split(":");
    if(what==="subject"){CFG.subjects.push({id:"s"+Date.now().toString(36),name:"New subject",full:"",color:"var(--rest)",papers:"",spec:"",sections:["Past papers"],topics:[{code:"1",title:"First topic",hours:2,url:"",objectives:[],watch:""}],rates:[{fromWeek:1,term:1,summer:0.5}],resources:[],pace:"ahead",weekly:[]});openSubj=CFG.subjects.length-1;}
    else if(what==="topic"){CFG.subjects[+idx].topics.push({code:"",title:"New topic",hours:1,url:"",objectives:[],watch:""});openSubj=+idx;}
    else if(what==="rate"){const r=CFG.subjects[+idx].rates;r.push({fromWeek:(r.length?r[r.length-1].fromWeek:0)+1,term:1,summer:0.5});openSubj=+idx;}
    else if(what==="weekly"){(CFG.subjects[+idx].weekly=CFG.subjects[+idx].weekly||[]).push({label:"Timed piece",hours:1,note:""});openSubj=+idx;}
    else if(what==="res"){CFG.subjects[+idx].resources.push({label:"Notes",url:"https://www.savemyexams.com/"});openSubj=+idx;}
    else if(what==="block"){const last=CFG.blocks[CFG.blocks.length-1];CFG.blocks.push({start:last?last.start:iso(new Date()),weeks:1,kind:"term",label:"New block",year:last?last.year:10,block:"A1"});}
    dirty=true;render();}));
  el.querySelector("#drafter")?.addEventListener("toggle",function(){drafting=this.open;});
  ["dname","durl","dtext"].forEach(id=>el.querySelector("#"+id)?.addEventListener("input",e=>{
    if(id==="dname")draftName=e.target.value;else if(id==="durl")draftUrl=e.target.value;else draftText=e.target.value;}));
  el.querySelector("#dgo")?.addEventListener("click",async()=>{
    const btn=el.querySelector("#dgo"),msg=el.querySelector("#dmsg");
    if(!draftName.trim()){msg.textContent="Give the subject a name first.";return;}

    btn.disabled=true;msg.textContent="Reading the spec and drafting… this takes a minute.";
    try{
      const d=await invoke("draft_subject",{name:draftName.trim(),url:draftUrl.trim(),text:draftText.trim()});
      CFG.subjects.push({
        id:"s"+Date.now().toString(36),
        name:d.name||draftName.trim(), full:d.full||"", color:PALETTE[CFG.subjects.length%PALETTE.length],

        topics:(d.topics||[]).map(t=>({code:String(t.code??""),title:String(t.title??""),
          hours:Math.min(5,Math.max(0.5,Number(t.hours)||1)), url:"",
          objectives:Array.isArray(t.objectives)?t.objectives.map(String):[], watch:String(t.watch??"")})),
        rates:[{fromWeek:1,term:1,summer:0.5}], resources:[], pace:"ahead", weekly:[]});
      openSubj=CFG.subjects.length-1;dirty=true;
      draftName="";draftUrl="";draftText="";drafting=false;
      const n=CFG.subjects[openSubj].topics.length;
      planMsg=`Drafted ${n} topic${n===1?"":"s"} — check them over, then Save plan.`;
      render();}
    catch(e){msg.textContent=String(e);btn.disabled=false;}});
  el.querySelector("#saveplan").addEventListener("click",async()=>{
    const btn=el.querySelector("#saveplan");btn.disabled=true;el.querySelector("#planmsg").textContent="Saving…";
    try{await invoke("save_config",{config:CFG});await reloadPlan();CFG=await invoke("get_config");
      dirty=false;planMsg="Saved — the schedule has been rebuilt";
      if(cur>TOTAL)cur=TOTAL;if(curSubj&&!SUBJECTS[curSubj])curSubj=null;
      render();}
    catch(e){planMsg="";el.querySelector("#planmsg").textContent="Couldn't save: "+String(e);btn.disabled=false;}});
  el.querySelector("#resetplan").addEventListener("click",async()=>{
    if(!confirm("Throw away your changes and go back to the built-in plan? Your ticks are kept."))return;
    try{await invoke("reset_config");await reloadPlan();CFG=await invoke("get_config");
      dirty=false;openSubj=null;planMsg="Back to the built-in plan";
      if(cur>TOTAL)cur=TOTAL;curSubj=null;render();}
    catch(e){el.querySelector("#planmsg").textContent="Couldn't reset: "+String(e);}});
  planMsg="";
}

/* ---------- GUIDE ---------- */
function renderGuide(){
  const n=SUBJ_IDS.length,ahead=SUBJ_IDS.filter(s=>!isSchool(s)).map(s=>SUBJECTS[s].name),school=SUBJ_IDS.filter(isSchool).map(s=>SUBJECTS[s].name);
  document.getElementById("view-guide").innerHTML=`<h1 style="font-size:24px;margin-bottom:14px">How this works</h1><div class="card prose">
  <p><b>The goal:</b> grade 9s across ${n} GCSEs and IGCSEs. The app doesn't teach you and doesn't set questions. It works out <b>what you should be doing this week</b>, puts the day's sessions in front of you, and sends you to the right page to do them.</p>
  <h3>Two kinds of subject</h3>
  <p><b>Running ahead</b> (${ahead.join(", ")||"none"}): the app schedules every topic in order, so school lessons become revision. These can be <i>behind</i>.</p>
  <p><b>School-paced</b> (${school.join(", ")||"none"}): school teaches the content; your weekly sessions are closed-book <b>recall</b> of what it has covered. These are never behind. Go to <b>Subjects</b> and tick topics as <b>known</b> when school finishes them — each comes back for a recall check after ${REVIEW_GAPS.join(", then ")} days, which is how something learned in Year 10 is still there in May 2028. Change which is which in <b>Plan</b>.</p>
  <h3>Each day</h3><p>Open <b>Today</b>. The day's sessions are one line each — tap one to open it, tick it when done. The <b>⋯</b> on any session moves it to tomorrow, later in the week or next week, or skips it. Recall checks that are due appear at the top of today's page.</p>
  <ul><li><b>Mon–Sat:</b> sessions, spread so no day is swamped. The timed writing piece is on Monday.</li><li><b>Saturday:</b> the test, if there is one.</li><li><b>Sunday:</b> half an hour on your own cards, then rest.</li><li><b>Holidays:</b> no new topics. Catch up, clear the fix list, rest.</li></ul>
  <h3>Recall checks</h3><p>A due check shows the topic's objectives as prompts: can you do each one without looking? Mark each ✓ or ✗, then say whether it held. <b>Some gaps</b> puts it on the fix list with the gaps marked, and brings it back in a week.</p>
  <h3>Your cards</h3><p>Under any topic you can write cards — a short quote on the front, the technique and its effect on the back; a formula; a definition. They come up in that topic's recall checks, front first. Nothing is pre-filled on purpose: writing the card is most of the learning.</p>
  <h3>Already ahead?</h3><p>In <b>Subjects</b>, open a subject and hit <b>Where am I up to?</b> The course is laid out one topic at a time in specification order, with its objectives and checklist: <b>Done this</b> ticks it as known and shows the next; <b>Not yet</b> is where you are. Or use <b>Tick what you already know</b> to tick from the list, a section at a time. Anything ticked counts as done, leaves the schedule, and goes straight into recall. For subjects the app runs ahead in, a bar then offers to <b>re-pour</b> the plan so those hours go to what is left.</p>
  <h3>Tests</h3>
  <ul><li><b>Retrieval test</b> — every other Saturday. Do you still remember it?</li><li><b>Timed paper section</b> — end of each half-term. Can you do it at exam speed?</li><li><b>Mock</b> — end of each term, full papers at Easter 2028.</li></ul>
  <h3>No scores</h3><p>Nothing here gives you a mark or predicts a grade. After a topic or a test you answer one question: <b>could you do it without notes?</b> If not, it goes on the fix list, and it comes back to be checked. The <b>streak</b> is the only number kept: days you did something.</p>
  <h3>Profiles</h3><p>The name at the top right is who is signed in. Click it to switch, add a profile, set a PIN, or export one. Each profile keeps its own progress, plan, known topics and cards, all on this PC. To move a profile to another computer, <b>Export</b> it here and <b>Import</b> the file there. A PIN only stops someone else on this PC opening the wrong profile; the files themselves are in the app data folder either way.</p>
  <h3>Window size</h3><p>Make the window wide and Today shows the whole week beside the day, with every session one click away. Make it narrow and everything compresses to fit — nothing is ever pushed off the edge.</p>
  <h3>Keyboard</h3><p><b>1–5</b> switch tabs · <b>← →</b> change week · <b>T</b> today · <b>P</b> print the week · <b>Ctrl+K</b> search · <b>Esc</b> closes a menu.</p>
  <h3>Changing the plan</h3><p>The <b>Plan</b> tab is the whole thing laid bare — subjects, who sets their pace, every topic and its hours, fixed weekly sessions, where the links point, and your term dates. Change anything and save; the two years reschedule around it and your ticks stay put. Reset puts the built-in plan back.</p>
  <h3>If you fall behind</h3><p>Use the next holiday to catch up — the plan finishes content early on purpose. If you lose more than that, <b>Progress → Catch up</b> re-pours everything unfinished from this week onwards. If the remaining work no longer fits before the exams, the app names exactly which topics don't fit rather than quietly dropping them.</p>
  <h3>Specification checklists</h3><p>Maths, Biology, Chemistry and Physics topics carry every individual statement the exam board makes for that topic, with a tick each — 242 for Maths, 176 for Biology, 182 for Chemistry, 195 for Physics. The numbering was read out of each specification by machine and a test fails the build if a single one goes missing. In the sciences, a <b>B</b>, <b>C</b> or <b>P</b> suffix marks content only separate-science students are examined on — 142 statements that Double Award students never see, and you do. The other subjects are checked at section level.</p>
  <h3>Exam dates</h3><p>Each subject page has a <b>First exam</b> box. The 2028 timetables are not published yet; when they are, write the dates in and the countdown uses the earliest.</p>
  <h3>Your day</h3><p>The card at the top of <b>Today</b> is read straight out of classic Outlook on this computer — your timetable, the gaps between lessons where the session fits, and anything a teacher's email says is due ("hand in by Friday", "know by 6pm tomorrow"). It is done with rules, not AI, so it is free, works offline and nothing leaves the machine; the sentence each deadline came from is shown so a wrong guess is obvious. Tick things off as you do them. Newsletters are ignored. Flag an email in Outlook with a date and it shows up too.</p>
  <p class="muted" style="font-size:13px">Term dates are typical English ones — change them in Plan to match your school.</p></div>
  <div class="card" style="margin-top:14px"><h3 style="font-size:18px;margin:0 0 8px">Drafting new subjects</h3>
  <p class="muted" style="font-size:13.5px;margin:0 0 10px">The Plan tab can draft a whole subject — topics, hours, objectives — from a public specification page. That one feature calls the Anthropic API with your own key from <a href="https://console.anthropic.com">console.anthropic.com</a>, and costs a few pence each time. Everything else in the app works offline and needs no key.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="password" id="apikey" placeholder="sk-ant-…" value="${esc(settings.apiKey||"")}" style="flex:1;min-width:220px"><button class="btn primary" id="savekey">Save</button></div>
  <p class="muted" style="font-size:13px;margin:10px 0 0">Stored in plain text in settings.json next to your progress. Leave it blank if you would rather not.</p></div>

  <div class="card" style="margin-top:14px"><h3 style="font-size:18px;margin:0 0 8px">Outlook</h3>
  <label style="display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer"><input type="checkbox" id="outlookon" ${settings.outlook===false?"":"checked"} style="width:18px;height:18px;accent-color:var(--ink)">Read my timetable and deadlines from classic Outlook</label>
  <p class="muted" style="font-size:13px;margin:8px 0 0">Needs classic Outlook signed in on this computer. The new Outlook does not let other programs read it. Nothing is sent anywhere.</p>
  <p class="muted" style="font-size:13px;margin:8px 0 0">If Outlook pops up <i>"A program is trying to access email address information"</i>, that is this app reading your own inbox. Tick <b>Allow access for</b> (1 minute is plenty — a read takes under a second) and click Allow. To stop it asking for good you have to launch Outlook once as administrator (right‑click Outlook → <b>Run as administrator</b>), then File → Options → Trust Center → Trust Center Settings → Programmatic Access → <b>Never warn me about suspicious activity</b> → OK, and reopen Outlook normally. Outlook asks because it can't confirm the antivirus status to its own satisfaction; Windows Defender is on and up to date.</p></div>

  <div class="card" style="margin-top:14px"><h3 style="font-size:18px;margin:0 0 8px">Your data</h3>
  <p class="muted" style="font-size:13px;margin:0 0 12px" id="statepath"></p>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn small" id="backup">Back up now</button><span class="muted" style="font-size:13px" id="backupmsg">Saves a dated copy of your progress and plan.</span></div></div>`;
  document.getElementById("savekey").addEventListener("click",async()=>{
    settings.apiKey=document.getElementById("apikey").value.trim();
    try{await invoke("set_settings",{settings});document.getElementById("savekey").textContent="Saved ✓";setTimeout(render,900);}
    catch(e){document.getElementById("savekey").textContent="Failed";}});
  document.getElementById("outlookon").addEventListener("change",async e=>{
    settings.outlook=e.target.checked;
    try{await invoke("set_settings",{settings});}catch(err){}
    if(settings.outlook){DAY_ERR=null;loadDay(false);}});
  document.getElementById("backup").addEventListener("click",async()=>{const m=document.getElementById("backupmsg");m.textContent="Backing up…";
    try{m.textContent="Saved to "+await window.tracker.backup();}catch(e){m.textContent="Couldn't back up: "+String(e);}});
  window.tracker.statePath().then(p=>{const el=document.getElementById("statepath");if(el)el.textContent="Everything is saved in: "+p;}).catch(()=>{});
}

/* ---------- VIEWS ---------- */
let view="today";
function showView(v){view=v;document.querySelectorAll(".nav [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));document.querySelectorAll(".view").forEach(s=>s.hidden=(s.id!=="view-"+v));render();window.scrollTo({top:0});}
function render(){({today:renderToday,subjects:renderSubjects,progress:renderProgress,plan:renderPlan,guide:renderGuide})[view]();}
document.querySelectorAll(".nav [role=tab]").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));

/* ---------- KEYBOARD ----------
   1-5 switch tabs. On Today: left and right change week, T jumps to today,
   P prints the week. Ctrl+K searches from anywhere. Escape closes menus. */
document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"")||(e.target&&e.target.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();curSubj=null;showView("subjects");const b=document.getElementById("findbox");if(b){b.focus();b.select();}return;}
  if(e.key==="Escape"){if(menuKey){menuKey=null;render();}if(typing)e.target.blur();return;}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  const tabs=["today","subjects","progress","plan","guide"];
  if(/^[1-5]$/.test(e.key)){showView(tabs[+e.key-1]);return;}
  if(view!=="today")return;
  if(e.key==="ArrowLeft"&&cur>1){cur--;curDay=0;menuKey=null;render();}
  else if(e.key==="ArrowRight"&&cur<TOTAL){cur++;curDay=0;menuKey=null;render();}
  else if(e.key.toLowerCase()==="t"){cur=todayWeek();curDay=null;render();}
  else if(e.key.toLowerCase()==="p"){window.print();}
});
document.addEventListener("click",e=>{if(menuKey&&!e.target.closest(".menu")&&!e.target.closest("[data-menu]")){menuKey=null;render();}});

/* ---------- PROFILES ----------
   Several people on one PC, each with their own progress, plan, known topics
   and cards. Everything below talks to profiles.rs; switching reloads the app
   so nothing from one person can bleed into another. */
let PROFILES=null,PROFILE=null,pick={open:false,forced:false,sel:null,pin:"",msg:"",manage:false,adding:false,newName:"",newPin:""};
async function loadProfiles(){
  try{PROFILES=await invoke("list_profiles");PROFILE=PROFILES.profiles.find(p=>p.id===PROFILES.current)||PROFILES.profiles[0]||null;}
  catch(e){PROFILES=null;PROFILE=null;}}
const errText=e=>String(e).replace(/^Error:[ ]*/,"");

const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const hue=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))%360;return h;};
function renderTop(){
  const el=document.getElementById("top");if(!el)return;
  if(!PROFILE){el.hidden=true;return;}
  el.hidden=false;
  el.innerHTML=`<div class="top-in"><span class="brand">Grade 9 Tracker</span><button class="who" id="who" title="Switch profile"><span class="av" style="--h:${hue(PROFILE.id)}">${esc(initials(PROFILE.name))}</span>${esc(PROFILE.name)}<span class="muted">▾</span></button></div>`;
  el.querySelector("#who").addEventListener("click",()=>showPicker(false));}
function showPicker(forced){pick={open:true,forced,sel:null,pin:"",msg:"",manage:false,adding:!PROFILES||!PROFILES.profiles.length,newName:"",newPin:""};renderPicker();}
function closePicker(){if(pick.forced)return;pick.open=false;renderPicker();}
async function choose(p){
  if(p.hasPin&&!pick.pin){pick.sel=p.id;pick.msg="";renderPicker();const i=document.getElementById("pinbox");if(i)i.focus();return;}
  try{await invoke("switch_profile",{id:p.id,pin:p.hasPin?pick.pin:null});}
  catch(e){pick.msg=errText(e);pick.pin="";renderPicker();const i=document.getElementById("pinbox");if(i)i.focus();return;}
  // A different person: start clean so nothing of the last one is still in memory.
  remember(p.id);location.reload();}
/* The choice holds for this run of the app, so a reload does not ask again. */
function remember(id){try{sessionStorage.setItem("g9-chosen",id);}catch(e){}}
function renderPicker(){
  const el=document.getElementById("picker");if(!el)return;
  if(!pick.open){el.hidden=true;el.innerHTML="";return;}
  el.hidden=false;
  const ps=PROFILES?PROFILES.profiles:[];
  const me=PROFILE&&PROFILE.id;
  let html=`<div class="pk"><div class="pkhead"><h2>${pick.forced?"Who is studying?":"Profiles"}</h2>${pick.forced?"":`<button class="btn small" id="pkclose">Close</button>`}</div>`;
  if(!pick.manage&&!pick.adding){
    html+=`<div class="pklist">`+ps.map(p=>`<button class="pkrow ${p.id===me?"cur":""}" data-choose="${esc(p.id)}"><span class="av" style="--h:${hue(p.id)}">${esc(initials(p.name))}</span><span class="nm">${esc(p.name)}${p.id===me?`<span class="muted"> · signed in</span>`:""}</span>${p.hasPin?`<span class="lock" title="Has a PIN">🔒</span>`:""}</button>
      ${pick.sel===p.id?`<div class="pkpin"><input type="password" inputmode="numeric" id="pinbox" placeholder="PIN" maxlength="8" value="${esc(pick.pin)}" autocomplete="off"><button class="btn primary small" data-go="${esc(p.id)}">Open</button></div>`:""}`).join("")+`</div>`;
    if(pick.msg)html+=`<p class="pkmsg">${esc(pick.msg)}</p>`;
    html+=`<div class="pkfoot"><button class="btn small" id="pkadd">+ New profile</button><button class="btn small" id="pkimport">Import a profile file</button><input type="file" id="pkfile" accept=".json" hidden>${ps.length?`<button class="btn small" id="pkmanage" style="margin-left:auto">Manage</button>`:""}</div>
      <p class="muted" style="font-size:12.5px;margin:12px 0 0">Each profile has its own progress, plan, known topics and cards. Everything stays on this PC. Anyone using the Save My Exams links needs their own Save My Exams login.</p>`;
  }else if(pick.adding){
    html+=`<div class="pkform"><label class="ed-lbl">Name</label><input type="text" id="pkname" placeholder="Your name" maxlength="40" value="${esc(pick.newName)}">
      <label class="ed-lbl">PIN — optional, 4 to 8 digits</label><input type="password" inputmode="numeric" id="pknewpin" placeholder="Leave blank for none" maxlength="8" value="${esc(pick.newPin)}" autocomplete="off">
      ${pick.msg?`<p class="pkmsg">${esc(pick.msg)}</p>`:""}
      <div class="pkfoot"><button class="btn primary" id="pkcreate">Create and open</button>${ps.length?`<button class="btn" id="pkback">Back</button>`:""}</div>
      <p class="muted" style="font-size:12.5px;margin:10px 0 0">A PIN only stops someone else on this PC opening your profile by mistake. Forget it and the files are still yours — they are in the app data folder.</p></div>`;
  }else{
    html+=`<div class="pklist manage">`+ps.map(p=>`<div class="pkman"><span class="av" style="--h:${hue(p.id)}">${esc(initials(p.name))}</span><span class="nm">${esc(p.name)}${p.hasPin?" 🔒":""}</span>
      <span class="acts"><button class="btn small" data-rename="${esc(p.id)}">Rename</button><button class="btn small" data-pin="${esc(p.id)}">${p.hasPin?"Change PIN":"Set PIN"}</button><button class="btn small" data-export="${esc(p.id)}">Export</button>${ps.length>1?`<button class="btn small danger" data-delete="${esc(p.id)}">Delete</button>`:""}</span></div>`).join("")+`</div>`;
    if(pick.msg)html+=`<p class="pkmsg ${/^(Exported|Saved|Deleted)/.test(pick.msg)?"ok":""}">${esc(pick.msg)}</p>`;
    html+=`<div class="pkfoot"><button class="btn small" id="pkback">Back</button></div>`;
  }
  el.innerHTML=html+`</div>`;
  const q=s=>el.querySelector(s);
  q("#pkclose")?.addEventListener("click",closePicker);
  el.onclick=e=>{if(e.target===el)closePicker();};
  el.querySelectorAll("[data-choose]").forEach(b=>b.addEventListener("click",()=>choose(ps.find(p=>p.id===b.dataset.choose))));
  el.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{pick.pin=(q("#pinbox")||{}).value||"";choose(ps.find(p=>p.id===b.dataset.go));}));
  q("#pinbox")?.addEventListener("keydown",e=>{if(e.key==="Enter"){pick.pin=e.target.value;choose(ps.find(p=>p.id===pick.sel));}});
  q("#pkadd")?.addEventListener("click",()=>{pick.adding=true;pick.msg="";renderPicker();q("#pkname")?.focus();});
  q("#pkmanage")?.addEventListener("click",()=>{pick.manage=true;pick.msg="";renderPicker();});
  q("#pkback")?.addEventListener("click",()=>{pick.manage=false;pick.adding=false;pick.msg="";renderPicker();});
  q("#pkname")?.addEventListener("input",e=>pick.newName=e.target.value);
  q("#pknewpin")?.addEventListener("input",e=>pick.newPin=e.target.value);
  q("#pkcreate")?.addEventListener("click",async()=>{
    try{const id=await invoke("create_profile",{name:pick.newName,pin:pick.newPin||null});remember(id);location.reload();}
    catch(e){pick.msg=errText(e);renderPicker();}});
  q("#pkname")?.addEventListener("keydown",e=>{if(e.key==="Enter")q("#pkcreate")?.click();});
  q("#pkimport")?.addEventListener("click",()=>q("#pkfile").click());
  q("#pkfile")?.addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;
    try{const bundle=JSON.parse(await f.text());const id=await invoke("import_profile",{bundle});await invoke("switch_profile",{id,pin:null});remember(id);location.reload();}
    catch(err){pick.msg="Could not import: "+errText(err);renderPicker();}});
  el.querySelectorAll("[data-rename]").forEach(b=>b.addEventListener("click",async()=>{const p=ps.find(x=>x.id===b.dataset.rename);const name=prompt("New name for "+p.name+":",p.name);if(name==null)return;
    try{await invoke("rename_profile",{id:p.id,name});await loadProfiles();renderTop();pick.msg="Saved.";renderPicker();}catch(err){pick.msg=errText(err);renderPicker();}}));
  el.querySelectorAll("[data-pin]").forEach(b=>b.addEventListener("click",async()=>{const p=ps.find(x=>x.id===b.dataset.pin);
    const old=p.hasPin?prompt("Current PIN for "+p.name+":"):null;if(p.hasPin&&old==null)return;
    const nw=prompt(p.hasPin?"New PIN (blank to remove):":"PIN for "+p.name+" (4 to 8 digits):");if(nw==null)return;
    try{await invoke("set_pin",{id:p.id,old,new:nw||null});await loadProfiles();pick.msg="Saved.";renderPicker();}catch(err){pick.msg=errText(err);renderPicker();}}));
  el.querySelectorAll("[data-export]").forEach(b=>b.addEventListener("click",async()=>{
    try{const path=await invoke("export_profile",{id:b.dataset.export});pick.msg="Exported to "+path+" — copy that file to the other PC and use Import there.";renderPicker();}catch(err){pick.msg=errText(err);renderPicker();}}));
  el.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",async()=>{const p=ps.find(x=>x.id===b.dataset.delete);
    if(!confirm("Delete the profile \""+p.name+"\"? Its files are moved aside, not destroyed, but the app will no longer show it."))return;
    const pin=p.hasPin?prompt("PIN for "+p.name+":"):null;if(p.hasPin&&pin==null)return;
    try{await invoke("delete_profile",{id:p.id,pin});if(PROFILE&&PROFILE.id===p.id){try{sessionStorage.removeItem("g9-chosen");}catch(e){}location.reload();return;}await loadProfiles();renderTop();pick.msg="Deleted.";renderPicker();}catch(err){pick.msg=errText(err);renderPicker();}}));
}

/* ---------- STARTUP: who is here, then their plan, then their progress ---------- */
let settings={};
const tracker={
  load:()=>invoke("load_state"), save:(s)=>invoke("save_state",{state:s}),
  statePath:()=>invoke("state_path"), backup:()=>invoke("backup")
};
window.tracker=tracker;
async function boot(){
  LS="grade9-tracker-v2:"+(PROFILE?PROFILE.id:"me");
  try{const raw=localStorage.getItem(LS);if(raw)state=Object.assign({...BLANK},JSON.parse(raw));}catch(e){}
  // Progress first: it carries the catch-up snapshot the plan is built from.
  try{const saved=await tracker.load();
    if(saved)state=Object.assign({...BLANK},saved);
    document.getElementById("sync").textContent="Saved";}catch(e){}
  if(!await reloadPlan()){
    document.getElementById("view-today").innerHTML='<div class="card"><div class="empty">Could not build the plan.</div></div>';return;}
  try{CFG=await invoke("get_config");}catch(e){}
  try{settings=await invoke("get_settings")||{};}catch(e){}
  cur=todayWeek();
  renderTop();
  render();
  loadDay(false);
}
(async()=>{
  await loadProfiles();
  let chosen=null;try{chosen=sessionStorage.getItem("g9-chosen");}catch(e){}
  // More than one person, or a PIN on the current one: ask who is here first -
  // unless they just chose, in which case this is the reload that follows.
  if(PROFILES&&chosen!==PROFILES.current&&(PROFILES.profiles.length>1||(PROFILE&&PROFILE.hasPin))){renderTop();showPicker(true);return;}
  await boot();
})();
// Open web links in the system browser rather than inside the app window.
document.addEventListener("click",e=>{const a=e.target.closest("a[href^='http']");if(a){e.preventDefault();window.__TAURI__.opener.openUrl(a.href);}});
</script>
