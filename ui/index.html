  return `<div class="card taught" style="--c:${S.color}"><div class="eyebrow" style="margin-bottom:4px">Taught in the app</div><div style="font-size:14px">${n===S.topics.length?"Every topic":`${n} of ${S.topics.length} topics`} in ${esc(S.name)} has a lesson: explanation, worked examples and practice questions, offline, with a notebook beside it. ${done?`<b>${done} of ${n} done.</b> `:""}${isSchool(subj)?"To have the app schedule the lessons as sessions, set this subject to app-paced in <b>Plan</b>.":"Each scheduled session opens straight into its lesson."}</div>
    ${first?`<div class="links" style="margin-top:10px"><button class="btn small primary" data-lesson="${esc(first.id)}">${done?"Continue":"Start"}: ${esc(first[0])} ${esc(first[1])}</button></div>`:""}</div>`;}

/* ---------- QUOTE BANK (English Literature) ----------
   Closed-book exams: the quotes you can produce from memory are the marks.
   One place for all of them, by text and by theme, with a gap-fill test that
   keeps asking the ones you cannot yet produce. Nothing is pre-filled -
   choosing and writing the quote is where the learning happens; the texts
   and the themes examiners expect are laid out so the gaps are obvious. */
const QB_TEXTS=[
  {id:"mac",name:"Macbeth",by:"Shakespeare",kind:"play",topics:["englit:3.1.1a","englit:3.1.1b","englit:3.1.1c","englit:3.1.1d","englit:3.1.1e","englit:3.1.1f"],where:"Act and scene, and who says it — e.g. 1.7 Macbeth",
    themes:["Ambition","Power and kingship","Guilt","The supernatural","Gender","Appearance and reality","Violence","Fate and free will","Loyalty and betrayal"]},
  {id:"acc",name:"A Christmas Carol",by:"Dickens",kind:"novel",topics:["englit:3.1.2a","englit:3.1.2b","englit:3.1.2c","englit:3.1.2d","englit:3.1.2e"],where:"Stave, and who — e.g. Stave 1 narrator",
    themes:["Poverty","Social responsibility","Redemption","Family","Isolation","Time and memory","Greed","Christmas spirit"]},
  {id:"aic",name:"An Inspector Calls",by:"Priestley",kind:"play",topics:["englit:3.2.1a","englit:3.2.1b","englit:3.2.1c","englit:3.2.1d","englit:3.2.1e"],where:"Act, and who — e.g. Act 3 Inspector",
    themes:["Responsibility","Class","Gender","Age and generation","Capitalism and socialism","Guilt","Power","Appearance and reality"]},
  {id:"oz",name:"Ozymandias",by:"Shelley",kind:"poem",topics:["englit:3.2.2a"],themes:["Power of humans","Pride","Power of nature","Time"]},
  {id:"lon",name:"London",by:"Blake",kind:"poem",topics:["englit:3.2.2b"],themes:["Power of humans","Individual experience","Place","Anger"]},
  {id:"pre",name:"Extract from The Prelude",by:"Wordsworth",kind:"poem",topics:["englit:3.2.2c"],themes:["Power of nature","Memory","Individual experience","Fear"]},
  {id:"mld",name:"My Last Duchess",by:"Browning",kind:"poem",topics:["englit:3.2.2d"],themes:["Power of humans","Pride","Gender","Control"]},
  {id:"clb",name:"The Charge of the Light Brigade",by:"Tennyson",kind:"poem",topics:["englit:3.2.2e"],themes:["Reality of war","Power of humans","Pride","Loss and absence"]},
  {id:"exp",name:"Exposure",by:"Owen",kind:"poem",topics:["englit:3.2.2f"],themes:["Reality of war","Power of nature","Effects of conflict","Individual experience"]},
  {id:"sti",name:"Storm on the Island",by:"Heaney",kind:"poem",topics:["englit:3.2.2g"],themes:["Power of nature","Fear","Place"]},
  {id:"bay",name:"Bayonet Charge",by:"Hughes",kind:"poem",topics:["englit:3.2.2h"],themes:["Reality of war","Individual experience","Fear","Power of nature"]},
  {id:"rem",name:"Remains",by:"Armitage",kind:"poem",topics:["englit:3.2.2i"],themes:["Effects of conflict","Guilt","Memory","Reality of war"]},
  {id:"pop",name:"Poppies",by:"Weir",kind:"poem",topics:["englit:3.2.2j"],themes:["Loss and absence","Effects of conflict","Memory","Individual experience"]},
  {id:"wph",name:"War Photographer",by:"Duffy",kind:"poem",topics:["englit:3.2.2k"],themes:["Effects of conflict","Memory","Guilt","Individual experience"]},
  {id:"tis",name:"Tissue",by:"Dharker",kind:"poem",topics:["englit:3.2.2l"],themes:["Power of humans","Power of nature","Identity","Control"]},
  {id:"emi",name:"The Émigrée",by:"Rumens",kind:"poem",topics:["englit:3.2.2m"],themes:["Memory","Identity","Place","Loss and absence"]},
  {id:"com",name:"Checking Out Me History",by:"Agard",kind:"poem",topics:["englit:3.2.2n"],themes:["Identity","Power of humans","Anger","Memory"]},
  {id:"kam",name:"Kamikaze",by:"Garland",kind:"poem",topics:["englit:3.2.2o"],themes:["Individual experience","Power of nature","Loss and absence","Identity","Memory"]},
];
const QB_BY_ID={};QB_TEXTS.forEach(t=>QB_BY_ID[t.id]=t);
const qbText=id=>QB_BY_ID[id]||{id,name:"Unknown text",by:"",kind:"poem",topics:[],themes:[]};
const quotes=()=>state.quotes||(state.quotes=[]);
const quotesOfText=tid=>quotes().filter(q=>q.text===tid);
const quotesForTopic=topicId=>quotes().filter(q=>qbText(q.text).topics.includes(topicId));
const qbSolid=q=>(q.ok||0)>=3;
/* All themes in use: the built-in ones per text plus anything typed in. */
function qbThemes(){const seen=new Map();QB_TEXTS.forEach(t=>t.themes.forEach(th=>seen.set(th,(seen.get(th)||0))));
  quotes().forEach(q=>(q.themes||[]).forEach(th=>seen.set(th,(seen.get(th)||0)+1)));
  if(qb&&qb.form&&qb.form.extra)qb.form.extra.forEach(th=>{if(!seen.has(th))seen.set(th,0);});return seen;}
/* Gap-fill: blank about a third of the meaningful words, the same ones every
   time for a given quote, so the test is stable and the reveal is a check. */
function qbCloze(q){const words=String(q).split(/(\s+)/);let h=0;for(const c of String(q))h=(h*31+c.charCodeAt(0))>>>0;
  const cand=[];words.forEach((w,i)=>{if(/[A-Za-zÀ-ÿ]{4,}/.test(w))cand.push(i);});
  if(!cand.length)words.forEach((w,i)=>{if(/[A-Za-zÀ-ÿ]/.test(w))cand.push(i);});
  const n=Math.max(1,Math.round(cand.length/3)),step=Math.max(1,Math.floor(cand.length/n));const pick=new Set();
  for(let k=0;k<n;k++)pick.add(cand[(h+k*step)%cand.length]);
  return words.map((w,i)=>pick.has(i)?`<span class="gap">${"_".repeat(Math.max(3,w.replace(/[^A-Za-zÀ-ÿ']/g,"").length))}</span>${esc(w.replace(/^.*?([^A-Za-zÀ-ÿ']*)$/,"$1"))}`:esc(w)).join("");}
/* Recall checks on an English Literature topic show that text's quotes as
   gap-fills, weakest first, up to six. */
function quoteCards(topicId){const qs=quotesForTopic(topicId).slice().sort((a,b)=>(a.ok||0)-(b.ok||0)).slice(0,6);if(!qs.length)return "";
  return `<div class="quiz">`+qs.map(q=>{const k="q|"+q.id,on=revealed.has(k);return `<button class="qcard ${on?"open":""}" data-flip="${esc(k)}"><span class="hint">${esc(qbText(q.text).name)}${q.who?" · "+esc(q.who):""}</span><span class="f">${on?"“"+esc(q.q)+"”":"“"+qbCloze(q.q)+"”"}</span>${on?`<span class="b">${(q.themes||[]).map(esc).join(" · ")}${q.note?(q.themes&&q.themes.length?" — ":"")+esc(q.note):""}</span>`:`<span class="hint">tap to reveal</span>`}</button>`;}).join("")+`</div>`;}

let qb=null; // {text, theme, add, edit, quiz, form:{text,q,who,themes,note}}
function openQuoteBank(text){qb={text:text||null,theme:null,add:!quotes().length,edit:null,quiz:null,form:{text:text||(QB_TEXTS[0].id),q:"",who:"",themes:[],note:""}};
  if(text)qb.form.themes=[];curSubj="englit";knowMode=false;openTopic=null;walk=null;showView("subjects");}
function qbFiltered(){return quotes().filter(q=>(!qb.text||q.text===qb.text)&&(!qb.theme||(q.themes||[]).includes(qb.theme)));}
function qbStatus(q){return qbSolid(q)?`<span class="chip ok">solid</span>`:((q.ok||0)>0?`<span class="chip">${q.ok} in a row</span>`:(q.last?`<span class="chip bad">not yet</span>`:`<span class="chip">new</span>`));}
function qbRow(q){const T=qbText(q.text);
  return `<div class="qrow"><div><div class="qq">“${esc(q.q)}”</div><div class="qm">${esc(q.who||"")}${(q.themes||[]).length?`${q.who?" · ":""}${q.themes.map(t=>`<button class="tchip" data-qbtheme="${esc(t)}">${esc(t)}</button>`).join("")}`:""}</div>${q.note?`<div class="qn">${esc(q.note)}</div>`:""}</div><div class="qbtns">${qbStatus(q)}<button class="icon" data-qbedit="${esc(q.id)}" aria-label="Edit">✎</button><button class="icon" data-qbdel="${esc(q.id)}" aria-label="Delete">×</button></div></div>`;}
function qbForm(){const f=qb.form,T=qbText(f.text),editing=!!qb.edit;const all=[...qbThemes().keys()];const own=T.themes,rest=all.filter(t=>!own.includes(t));
  const chip=t=>`<button class="tchip ${f.themes.includes(t)?"on":""}" data-qbtog="${esc(t)}">${esc(t)}</button>`;
  return `<div class="card qbform"><div class="eyebrow" style="margin-bottom:8px">${editing?"Edit quote":"Add a quote"}</div>
    <div class="qbgrid"><select id="qbtext">${["play","novel","poem"].map(k=>`<optgroup label="${k==="poem"?"Power and Conflict":(k==="play"?"Plays":"Novel")}">${QB_TEXTS.filter(t=>t.kind===k).map(t=>`<option value="${t.id}" ${t.id===f.text?"selected":""}>${esc(t.name)}${t.kind==="poem"?" — "+esc(t.by):""}</option>`).join("")}</optgroup>`).join("")}</select>
    <input type="text" id="qbwho" value="${esc(f.who)}" placeholder="${esc(T.where||"Where in the poem — e.g. line 1, or the ending")}" maxlength="80"></div>
    <textarea id="qbq" placeholder="The quote, word for word. Short — 3 to 8 words is what you can actually reproduce in an exam" maxlength="300">${esc(f.q)}</textarea>
    <div class="eyebrow" style="margin:10px 0 5px">Themes · ${T.name}</div><div class="tchips">${own.map(chip).join("")}</div>
    ${rest.length?`<details class="tmore"><summary>Other themes</summary><div class="tchips">${rest.map(chip).join("")}</div></details>`:""}
    <div class="tchips" style="margin-top:6px"><input type="text" id="qbnewtheme" placeholder="Your own theme" maxlength="40" style="max-width:220px"><button class="btn small" id="qbaddtheme">Add theme</button></div>
    <input type="text" id="qbnote" value="${esc(f.note)}" placeholder="Technique and what it does — the sentence you would write about it" maxlength="240" style="margin-top:10px">
    <div class="wbtns" style="margin-top:12px"><button class="btn primary" id="qbsave">${editing?"Save":"Add quote"}</button><button class="btn" id="qbcancel">${editing?"Cancel":"Close"}</button></div></div>`;}
function qbReadForm(el){const f=qb.form;f.text=el.querySelector("#qbtext").value;f.q=el.querySelector("#qbq").value;f.who=el.querySelector("#qbwho").value;f.note=el.querySelector("#qbnote").value;}
function renderQuoteBank(el){
  const S=SUBJECTS.englit,all=quotes(),solid=all.filter(qbSolid).length;
  if(qb.quiz){renderQuoteQuiz(el);return;}
  const list=qbFiltered();const themes=qbThemes();
  let html=`<div class="qbscreen"><button class="back" id="qbback">‹ ${esc(S?S.name:"English Literature")}</button>
    <div class="qbhead"><div><h1 style="font-size:24px">Quote bank</h1><p class="muted" style="font-size:13.5px;margin:4px 0 0">${all.length?`${all.length} quote${all.length===1?"":"s"} · ${solid} solid · ${all.length-solid} still to learn`:"Closed book: what you can write from memory is what you can use."}</p></div>
    <div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn small ${qb.add||qb.edit?"":"primary"}" id="qbadd">+ Add</button><button class="btn small" id="qbtest" ${list.length?"":"disabled"}>Test me${list.length&&(qb.text||qb.theme)?` · ${list.length}`:""}</button><button class="btn small" id="qbprint" ${all.length?"":"disabled"}>Print</button></div></div>`;
  if(qb.add||qb.edit)html+=qbForm();
  // Texts as filters, with counts: a zero is a poem you have nothing for.
  const cnt=t=>quotesOfText(t.id).length;
  if(all.length){const th=[...themes.entries()].filter(([t,n])=>n||(qb.text&&qbText(qb.text).themes.includes(t)));
    html+=`<div class="card" style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:6px">By text</div><div class="tchips"><button class="tchip ${!qb.text?"on":""}" data-qbtext="">All · ${all.length}</button>${QB_TEXTS.map(t=>`<button class="tchip ${qb.text===t.id?"on":""} ${cnt(t)?"":"zero"}" data-qbtext="${t.id}">${esc(t.name)} · ${cnt(t)}</button>`).join("")}</div>
    ${th.length?`<div class="eyebrow" style="margin:12px 0 6px">By theme</div><div class="tchips"><button class="tchip ${!qb.theme?"on":""}" data-qbtheme="">All</button>${th.map(([t,n])=>`<button class="tchip ${qb.theme===t?"on":""} ${n?"":"zero"}" data-qbtheme="${esc(t)}">${esc(t)}${n?` · ${n}`:""}</button>`).join("")}</div>`:""}</div>`;}
  if(!all.length){html+=`<div class="card"><div class="empty">No quotes yet. Add one from whichever text you are studying this week — three per poem is a good target, and one per theme for each of the three set texts.</div></div>`;}
  else if(!list.length){html+=`<div class="card"><div class="empty">Nothing here yet for that filter.</div></div>`;}
  else if(qb.text){const T=qbText(qb.text);html+=`<div class="card"><div class="sect" style="padding-top:0"><span>${esc(T.name)} · ${esc(T.by)}</span><span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${list.length} quote${list.length===1?"":"s"}</span></div>${list.map(qbRow).join("")}</div>`;}
  else{html+=`<div class="card">`;QB_TEXTS.forEach(T=>{const qs=list.filter(q=>q.text===T.id);if(!qs.length)return;html+=`<div class="sect"><span>${esc(T.name)}</span><span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${qs.length}</span></div>`+qs.map(qbRow).join("");});html+=`</div>`;}
  html+=`<p class="muted" style="font-size:12.5px;margin:12px 0 0">Solid means three right in a row in a test. A poem with no quotes shows as a zero above — that is the one to read next. Quotes also come up in that text's recall checks.</p></div>`+printQuotes();
  el.innerHTML=html;
  el.querySelector("#qbback").addEventListener("click",()=>{qb=null;render();});
  el.querySelector("#qbadd").addEventListener("click",()=>{qb.edit=null;qb.add=!qb.add;if(qb.add)qb.form={text:qb.text||qb.form.text||QB_TEXTS[0].id,q:"",who:"",themes:[],note:""};render();setTimeout(()=>document.getElementById("qbq")?.focus(),0);});
  el.querySelector("#qbtest").addEventListener("click",()=>startQuoteQuiz("gap"));
  el.querySelector("#qbprint").addEventListener("click",()=>window.print());
  el.querySelectorAll("[data-qbtext]").forEach(b=>b.addEventListener("click",()=>{qb.text=b.dataset.qbtext||null;if(qb.add&&!qb.edit){qbReadForm(el);if(qb.text&&qb.form.text!==qb.text){qb.form.text=qb.text;qb.form.themes=[];}}render();}));
  el.querySelectorAll("[data-qbtheme]").forEach(b=>b.addEventListener("click",()=>{if(qb.add||qb.edit)qbReadForm(el);qb.theme=b.dataset.qbtheme||null;render();}));
  el.querySelectorAll("[data-qbedit]").forEach(b=>b.addEventListener("click",()=>{const q=quotes().find(x=>x.id===b.dataset.qbedit);if(!q)return;qb.edit=q.id;qb.add=false;qb.form={text:q.text,q:q.q,who:q.who||"",themes:(q.themes||[]).slice(),note:q.note||""};render();window.scrollTo({top:0});}));
  el.querySelectorAll("[data-qbdel]").forEach(b=>b.addEventListener("click",()=>{const i=quotes().findIndex(x=>x.id===b.dataset.qbdel);if(i>=0)quotes().splice(i,1);if(qb.edit===b.dataset.qbdel){qb.edit=null;}persist();render();}));
  if(qb.add||qb.edit){
    el.querySelector("#qbtext").addEventListener("change",e=>{qbReadForm(el);if(qb.form.text!==e.target.value)qb.form.themes=[];qb.form.text=e.target.value;render();setTimeout(()=>document.getElementById("qbq")?.focus(),0);});
    el.querySelectorAll("[data-qbtog]").forEach(b=>b.addEventListener("click",()=>{qbReadForm(el);const t=b.dataset.qbtog;const i=qb.form.themes.indexOf(t);if(i>=0)qb.form.themes.splice(i,1);else qb.form.themes.push(t);render();}));
    el.querySelector("#qbaddtheme").addEventListener("click",()=>{qbReadForm(el);const inp=el.querySelector("#qbnewtheme");const t=inp.value.trim().replace(/\s+/g," ");if(!t){inp.focus();return;}
      const have=[...qbThemes().keys()].find(x=>x.toLowerCase()===t.toLowerCase())||t;if(!qb.form.themes.includes(have))qb.form.themes.push(have);
      // Keep a typed theme even before any quote carries it, by pinning it on the form.
      qb.form.extra=[...new Set([...(qb.form.extra||[]),have])];render();});
    el.querySelector("#qbnewtheme").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();el.querySelector("#qbaddtheme").click();}});
    el.querySelector("#qbcancel").addEventListener("click",()=>{qb.add=false;qb.edit=null;render();});
    el.querySelector("#qbsave").addEventListener("click",()=>{qbReadForm(el);const f=qb.form;const q=f.q.trim().replace(/^["“”']+|["“”']+$/g,"").trim();
      if(!q){el.querySelector("#qbq").focus();return;}
      const dup=quotes().find(x=>x.text===f.text&&x.q.toLowerCase()===q.toLowerCase()&&x.id!==qb.edit);if(dup){el.querySelector("#qbq").focus();el.querySelector("#qbq").select();return;}
      if(qb.edit){const x=quotes().find(x=>x.id===qb.edit);if(x){x.text=f.text;x.q=q;x.who=f.who.trim();x.themes=f.themes.slice();x.note=f.note.trim();}qb.edit=null;}
      else{quotes().push({id:"q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:f.text,q,who:f.who.trim(),themes:f.themes.slice(),note:f.note.trim(),added:todayISO(),ok:0,last:""});
        qb.form={text:f.text,q:"",who:"",themes:[],note:"",extra:f.extra};}
      markDay();persist();render();setTimeout(()=>document.getElementById("qbq")?.focus(),0);});
    el.querySelector("#qbq").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();el.querySelector("#qbsave").click();}});
    el.querySelector("#qbnote").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();el.querySelector("#qbsave").click();}});
  }
}
/* The printed sheet: every quote in the current filter, grouped by text,
   with the themes and the note - one page to read the night before. */
function printQuotes(){const list=qbFiltered();
  return `<div class="printquotes"><h1>Quote bank${qb.text?" · "+esc(qbText(qb.text).name):""}${qb.theme?" · "+esc(qb.theme):""}</h1>`+QB_TEXTS.map(T=>{const qs=list.filter(q=>q.text===T.id);if(!qs.length)return "";
    return `<h3>${esc(T.name)} <span>${esc(T.by)}</span></h3>`+qs.map(q=>`<div class="pq"><div class="pqq">“${esc(q.q)}”${q.who?` <span>— ${esc(q.who)}</span>`:""}</div><div class="pqm">${(q.themes||[]).map(esc).join(" · ")}${q.note?(q.themes&&q.themes.length?" — ":"")+esc(q.note):""}</div></div>`).join("");}).join("")+`</div>`;}

/* Test: weakest first, then the ones not seen for longest. Got it three times
   running and it is solid; miss it once and it starts again. */
function startQuoteQuiz(mode,ids){const pool=(ids?quotes().filter(q=>ids.includes(q.id)):qbFiltered()).slice();
  pool.sort((a,b)=>((a.ok||0)-(b.ok||0))||String(a.last||"").localeCompare(String(b.last||""))||(Math.random()-.5));
  qb.quiz={mode,ids:pool.map(q=>q.id),i:0,shown:false,right:[],wrong:[]};render();}
function renderQuoteQuiz(el){const z=qb.quiz,S=SUBJECTS.englit;
  let html=`<button class="back" id="qzback">‹ Quote bank</button>`;
  if(z.i>=z.ids.length){
    const n=z.right.length+z.wrong.length;
    html+=`<div class="card walk"><div class="eyebrow">Quote test</div><h2 style="font-size:22px;margin:6px 0 8px">${z.wrong.length?`${z.right.length} of ${n}`:(n?"All of them":"Nothing to test")}</h2>
      <p class="muted" style="font-size:14px;margin:0 0 14px">${z.wrong.length?`${z.wrong.length} to go back over. They come first next time, and in that text's recall checks.`:(n?"Every one right. They stay in the rotation — three in a row makes one solid.":"")}</p>
      <div class="wbtns">${z.wrong.length?`<button class="btn primary" id="qzagain">Again — just the ${z.wrong.length} I missed</button>`:""}<button class="btn ${z.wrong.length?"":"primary"}" id="qzdone">Done</button></div></div>`;
  }else{
    const q=quotes().find(x=>x.id===z.ids[z.i]);if(!q){z.i++;render();return;}const T=qbText(q.text);
    html+=`<div class="card walk"><div class="walkhead"><span class="eyebrow">Quote test · ${z.mode==="theme"?"from the theme":"fill the gaps"}</span><span class="chip">${z.i+1} of ${z.ids.length}</span></div>
      <div class="prog" style="margin:8px 0 16px"><i style="width:${Math.round(100*z.i/z.ids.length)}%;background:${S?S.color:"var(--accent)"}"></i></div>
      <div class="wcode">${esc(T.name)}${T.kind==="poem"?" · "+esc(T.by):""}${q.who?" · "+esc(q.who):""}</div>`;
    if(z.mode==="theme")html+=`<h2 style="font-size:20px;margin:2px 0 12px">${(q.themes||[]).length?esc(q.themes.join(" · ")):"A quote from this text"}</h2><p class="muted" style="font-size:14px;margin:0 0 12px">Say the quote out loud, or write it down, then check.</p>`;
    else html+=`<h2 class="cloze" style="font-size:20px;margin:2px 0 12px">“${z.shown?esc(q.q):qbCloze(q.q)}”</h2>`;
    if(z.shown)html+=`<div class="reveal">${z.mode==="theme"?`<div class="qq">“${esc(q.q)}”</div>`:""}${(q.themes||[]).length?`<div class="qm">${q.themes.map(esc).join(" · ")}</div>`:""}${q.note?`<div class="qn">${esc(q.note)}</div>`:""}</div>

function subjectReadiness(s){const S=SUBJECTS[s];
  const sittings=papersOf(s).flatMap(p=>paperHist(p.id).map(h=>({...h,p:p.id}))).sort((a,b)=>a.d.localeCompare(b.d));
  const latestByPaper={};sittings.forEach(h=>{latestByPaper[h.p]=h;});const latest=Object.values(latestByPaper);
  const grade=latest.length?Math.round(latest.reduce((n,h)=>n+h.g,0)/latest.length):null;
  const last=sittings.length?sittings[sittings.length-1]:null;
  const weakBand=last&&last.b?Object.keys(last.b).sort((a,b)=>last.b[a]-last.b[b])[0]:null;
  const tested=S.topics.map(t=>lastTest(t.id)).filter(Boolean);
  const testAvg=tested.length?Math.round(tested.reduce((n,h)=>n+h.pct,0)/tested.length):null;
  const shaky=S.topics.filter(t=>{const h=lastTest(t.id);return h&&h.pct<60;}).length;
  const ms=subjectMistakes(s),hold=ms.filter(x=>inReview(x.m)).length,open=ms.length-hold,due=fixDueList(s).length;
  const done=S.topics.filter(t=>T(t.id).done).length;
  const ed=state.examDates[s]||firstExam();const days=Math.max(0,Math.round((new Date(ed+"T00:00:00")-new Date())/86400000));
  const unsat=papersOf(s).filter(p=>!paperHist(p.id).length);
  const nextPaper=unsat.length?unsat[0]:papersOf(s).slice().sort((a,b)=>(lastPaper(a.id).d).localeCompare(lastPaper(b.id).d))[0];
  return {grade,trend:sittings.slice(-6).map(h=>h.g),last,weakBand,tested:tested.length,testAvg,shaky,open,hold,due,done,days,nextPaper};}

        r.open||r.hold?`${r.open?`<b>${r.open}</b> open mistake${r.open===1?"":"s"}`:"nothing open"}${r.hold?` · <b>${r.hold}</b> holding`:""}${r.due?` · <b>${r.due}</b> due for re-test`:""}`:"no open mistakes",

  el.querySelectorAll("[data-subj]").forEach(b=>b.addEventListener("click",()=>{curSubj=b.dataset.subj;knowMode=false;showView("subjects");}));
  bind(el);
  el.querySelector("#catchup")?.addEventListener("click",doCatchUp);
  el.querySelector("#uncatchup")?.addEventListener("click",undoCatchUp);
}
function trow(t){const w=WEEKS[t.week-1],ts=TS(t.id);

let drafting=false,draftName="",draftUrl="",draftText="",draftMsg="";
const PALETTE=["var(--maths)","var(--fpm)","var(--bus)","var(--econ)","var(--cs)"];
const KINDS=[["term","Term"],["half","Half-term"],["holiday","Holiday"],["summer","Summer holiday"],["exam","Exam season"]];
const CODES=["A1","A2","S1","S2","U1","U2","H","X"];
function setPath(path,val){const ks=path.split(".");let o=CFG;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;
  dirty=true;const m=document.getElementById("planmsg");if(m)m.textContent="Unsaved changes";}
function delPath(path){const ks=path.split(".");let o=CFG;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];const k=ks[ks.length-1];
  if(Array.isArray(o))o.splice(+k,1);else delete o[k];dirty=true;}

/* ---------- GUIDE ---------- */
function renderGuide(){
  const n=SUBJ_IDS.length,ahead=SUBJ_IDS.filter(s=>!isSchool(s)).map(s=>SUBJECTS[s].name),school=SUBJ_IDS.filter(isSchool).map(s=>SUBJECTS[s].name);
  document.getElementById("view-guide").innerHTML=`<h1 style="font-size:24px;margin-bottom:14px">How this works</h1><div class="card prose">
  <p><b>The goal:</b> grade 9s across ${n} GCSEs and IGCSEs. It works out <b>what you should be doing this week</b>, puts the day's sessions in front of you, and sends you to the right page to do them. Where a subject has been written up (Maths, Further Maths, Economics, Business, Computer Science, Biology, Chemistry, Physics, English Literature and English Language so far), it teaches it too: every topic has a lesson with worked examples and practice questions, and a notebook beside it.</p>
  <h3>Two kinds of subject</h3>
  <p><b>Running ahead</b> (${ahead.join(", ")||"none"}): the app schedules every topic in order, so school lessons become revision. These can be <i>behind</i>.</p>
  <p><b>School-paced</b> (${school.join(", ")||"none"}): school teaches the content; your weekly sessions are closed-book <b>recall</b> of what it has covered. These are never behind. Go to <b>Subjects</b> and tick topics as <b>known</b> when school finishes them — each comes back for a recall check after ${REVIEW_GAPS.join(", then ")} days, which is how something learned in Year 10 is still there in May 2028. Change which is which in <b>Plan</b>.</p>
  <h3>Each day</h3><p>Open <b>Today</b>. The day's sessions are one line each — tap one to open it, tick it when done. The <b>⋯</b> on any session moves it to tomorrow, later in the week or next week, or skips it. Recall checks that are due appear at the top of today's page.</p>
  <ul><li><b>Mon–Sat:</b> sessions, spread so no day is swamped. The timed writing piece is on Monday.</li><li><b>Saturday:</b> the test, if there is one.</li><li><b>Sunday:</b> half an hour on your own cards, then rest.</li><li><b>Holidays:</b> no new topics. Catch up, clear the fix list, rest.</li></ul>
  <h3>Recall checks</h3><p>A due check shows the topic's objectives as prompts: can you do each one without looking? Mark each ✓ or ✗, then say whether it held. <b>Some gaps</b> puts it on the fix list with the gaps marked, and brings it back in a week.</p>
  <h3>Mistakes log</h3><p>What actually went wrong, kept per topic. A recall check marked <b>Some gaps</b> logs every objective you could not do; a session or test marked shaky asks what dropped the marks; and you can write one under any topic. Open mistakes appear at the top of that topic's next recall check as <b>Last time you got wrong</b>, and each subject page lists all of its open ones so you can read them before a test. Tick a mistake when you can do it without the slip.</p>
  <h3>Your cards</h3><p>Under any topic you can write cards — a short quote on the front, the technique and its effect on the back; a formula; a definition. They come up in that topic's recall checks, front first. Nothing is pre-filled on purpose: writing the card is most of the learning.</p>
  <h3>Lessons</h3><p>For Maths, Further Maths, Economics, Business, Computer Science, Biology, Chemistry, Physics, English Literature and English Language, every topic carries its own lesson inside the app — no hunting for videos or notes. Open one from the session in <b>Today</b>, from the topic in <b>Subjects</b>, or from the walkthrough. Each lesson has the same shape: <b>What it is</b>, <b>How to do it</b> as numbered steps, worked examples with every line shown, <b>Try these</b> — practice questions with the answer hidden until you tap, then <b>Got it</b> or <b>Not yet</b> (Not yet goes straight into the mistakes log for that topic) — and <b>Where the marks go</b>, the errors examiners see most. Every number in the answers was checked by computer. <b>Cover the working</b> turns each worked example into a step-by-step reveal, so you attempt each line before you see it. <b>Notes</b> opens your own notebook beside the lesson — it autosaves, anything you highlight in the lesson can be added with one tap, the first line can become a card, and the notes come back on that topic's recall checks. <b>Print</b> gives you the lesson with every answer shown as a revision sheet. When you can do the questions without looking, tick the topic at the bottom and it joins the recall rotation. Lessons work offline; the maths is typeset locally.</p>
  <h3>End-of-topic tests</h3><p>Every lesson ends with <b>Take the test</b> (also under <b>Test</b> in the lesson's top bar, and on the topic row once you have taken one). It is closed book and timed: the questions appear with no answers and a clock, you write every answer on paper, then <b>Mark it</b> shows the answers and you give yourself the marks. 80% or more is <b>Secure</b> — tick the topic and it joins recall; below that, everything you dropped is already in the mistakes log, so read those, go back over that part of the lesson, and retake. Attempts are kept, so the subject page shows your last score on each topic and the lesson shows the run of attempts.</p>
  <h3>Mock papers</h3><p>Each subject page has a <b>Mock papers</b> card: original exam-style papers, written for this app rather than copied from past papers, that mix topics the way a real paper does and climb from grade 4–5 questions through 6–7 to 8–9, so the last section is where the top grades are decided. A paper runs on the clock for its real duration; you write everything on paper, then <b>Mark it</b> shows the mark scheme (points for short questions, level descriptors for essays) and you give yourself the marks. The percentage becomes a <b>grade estimate</b> using that subject's real grade boundaries — each board's published June 2025 and June 2026 boundaries averaged, so a Computer Science 7 needs about 78% while a Maths 7 needs about 58%, just as in the real exams. Boundaries shift a few marks each year, so treat the estimate as give or take a grade. You also get a breakdown by band, so you can see whether the marks went at the start or at the top end. Every dropped question goes to the mistakes log under the subject. <b>Print the paper</b> on the screen before you start it, and you can sit it at a desk with a pen the way you will in the hall - the printout has the questions and the marks and nothing else, and <b>Print the mark scheme</b> on the results screen gives you the answers to mark from. Sit a paper once the topics it covers are done, fix what it exposes, and sit it again a week or two later. Every paper question names the topics it draws on, so a dropped question is logged under those topics and the results page lists the <b>lessons to reopen</b> with the marks each one cost.</p>
  <h3>Fix-it: re-testing mistakes on widening gaps</h3><p>A mistake logged by a topic test or a mock paper remembers the question. The next day it is <b>due</b>: the subject page's mistakes card and the retrieval session on Today show <b>Re-test N dropped questions</b>, which brings those questions back closed-book, soonest due first, a dozen at a time.</p><p>Full marks does not tick it off — it moves the question on to a <b>longer gap</b>. The gaps widen: <b>1 day, then 3, then 8, then 21</b>. Hold it at all four and the mistake is ticked off for good; it has survived three weeks, which is the point at which it is actually yours. Drop marks and it comes back sooner — part marks slip back one gap, a blank starts the ladder again. A mistake part-way up the ladder shows as <b>holding</b> rather than open, so the open count is what still needs work.</p><p>Why widening gaps: answering something right the day after you got it wrong proves almost nothing, because it is still in your head from reading the answer. Each longer gap forces you to retrieve it from cold, and retrieving it from cold is what makes it stick. That is the loop: test, drop, reopen the lesson, then re-test at 1, 3, 8 and 21 days until it holds.</p>
  <h3>Exam readiness</h3><p>The top of <b>Progress</b> pulls the tests and papers together, one line per subject, weakest first: your <b>grade estimate</b> (the average of your latest sitting of each mock paper) with the run of grades from every sitting, how many topics you have tested closed-book and their average, open mistakes and how many are due for a re-test, which band the last paper was weakest on, and days to the exam. The buttons take you straight to the re-test, the next paper, or the subject.</p>
  <h3>Quote bank</h3><p>English Literature is closed book, so the quotes you can write from memory are the marks. <b>Subjects → Eng Literature → Quote bank</b> keeps every quote in one place: pick the text, type the quote, tag its themes and write the one sentence you would say about it. Every set text and all fifteen Power and Conflict poems are listed with a count, so a poem you have nothing for shows as a zero. <b>Test me</b> blanks out a third of the words and asks you to fill them in — or, switched round, gives you the theme and asks for the quote. Three right in a row makes a quote solid; one miss puts it back to the front. Quotes also come up in that text's recall checks, and <b>Print</b> gives you the lot on one sheet for the night before. Nothing is pre-filled: choosing the quote is the learning.</p>
  <h3>Already ahead?</h3><p>In <b>Subjects</b>, open a subject and hit <b>Where am I up to?</b> The course is laid out one topic at a time in specification order, with its objectives and checklist: <b>Done this</b> ticks it as known and shows the next; <b>Not yet</b> is where you are. Or use <b>Tick what you already know</b> to tick from the list, a section at a time. Anything ticked counts as done, leaves the schedule, and goes straight into recall. For subjects the app runs ahead in, a bar then offers to <b>re-pour</b> the plan so those hours go to what is left.</p>
  <h3>Tests</h3>
  <ul><li><b>Retrieval test</b> — every other Saturday. Do you still remember it?</li><li><b>Timed paper section</b> — end of each half-term. Can you do it at exam speed?</li><li><b>Mock</b> — end of each term, full papers at Easter 2028.</li></ul>
  <h3>No scores</h3><p>Nothing here gives you a mark or predicts a grade. After a topic or a test you answer one question: <b>could you do it without notes?</b> If not, it goes on the fix list, and it comes back to be checked. The <b>streak</b> is the only number kept: days you did something.</p>
  <h3>Profiles</h3><p>The name at the top right is who is signed in. Click it to switch, add a profile, set a PIN, or export one. Each profile keeps its own progress, plan, known topics, cards, quotes and lesson notes, all on this PC. To move a profile to another computer, <b>Export</b> it here and <b>Import</b> the file there. A PIN only stops someone else on this PC opening the wrong profile; the files themselves are in the app data folder either way.</p>
  <h3>Window size</h3><p>Make the window wide and Today shows the whole week beside the day, with every session one click away. Make it narrow and everything compresses to fit — nothing is ever pushed off the edge.</p>
  <h3>Keyboard</h3><p><b>1–5</b> switch tabs · <b>← →</b> change week · <b>T</b> today · <b>P</b> print the week · <b>Ctrl+K</b> search · <b>Esc</b> closes a menu.</p>
  <h3>Changing the plan</h3><p>The <b>Plan</b> tab is the whole thing laid bare — subjects, who sets their pace, every topic and its hours, fixed weekly sessions, where the links point, and your term dates. Change anything and save; the two years reschedule around it and your ticks stay put. Reset puts the built-in plan back.</p>
  <h3>If you fall behind</h3><p>Use the next holiday to catch up — the plan finishes content early on purpose. If you lose more than that, <b>Progress → Catch up</b> re-pours everything unfinished from this week onwards. If the remaining work no longer fits before the exams, the app names exactly which topics don't fit rather than quietly dropping them.</p>
  <h3>Specification checklists</h3><p>Every subject except English carries every individual statement the exam board makes for each topic, with a tick each — 242 for Maths, 43 Further Maths, 176 Biology, 182 Chemistry, 195 Physics, 113 Economics, 125 Business, 89 Computer Science (OCR J277). Where the board numbers its statements (all but Business) the numbering was read out of the document by machine and a test fails the build if one goes missing. AQA does not number Business outcomes and OCR does not number the Computer Science bullets, so those letters are the app's own, in the order each specification lists them - though the Computer Science counts were read from the document. In the sciences, a <b>B</b>, <b>C</b> or <b>P</b> suffix marks content only separate-science students sit — 142 statements Double Award students never see, and you do. English is texts and skills rather than statements, so it is checked at section level.</p>
  <h3>Exam dates</h3><p>Each subject page has a <b>First exam</b> box. The 2028 timetables are not published yet; when they are, write the dates in and the countdown uses the earliest.</p>
  <h3>Your day</h3><p>The card at the top of <b>Today</b> is read straight out of classic Outlook <b>while you have it open</b> on this computer — your timetable, the gaps between lessons where the session fits, and anything a teacher's email says is due ("hand in by Friday", "know by 6pm tomorrow"). It is done with rules, not AI, so it is free, works offline and nothing leaves the machine; the sentence each deadline came from is shown so a wrong guess is obvious. Tick things off as you do them. Newsletters are ignored. Flag an email in Outlook with a date and it shows up too.</p>
  <p class="muted" style="font-size:13px">Term dates are typical English ones — change them in Plan to match your school.</p></div>
  <div class="card" style="margin-top:14px"><h3 style="font-size:18px;margin:0 0 8px">Drafting new subjects</h3>
  <p class="muted" style="font-size:13.5px;margin:0 0 10px">The Plan tab can draft a whole subject — topics, hours, objectives — from a public specification page. That one feature calls the Anthropic API with your own key from <a href="https://console.anthropic.com">console.anthropic.com</a>, and costs a few pence each time. Everything else in the app works offline and needs no key.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="password" id="apikey" placeholder="sk-ant-…" value="${esc(settings.apiKey||"")}" style="flex:1;min-width:220px"><button class="btn primary" id="savekey">Save</button></div>
  <p class="muted" style="font-size:13px;margin:10px 0 0">Stored in plain text in settings.json next to your progress. Leave it blank if you would rather not.</p></div>

  <div class="card" style="margin-top:14px"><h3 style="font-size:18px;margin:0 0 8px">Outlook</h3>

  <p class="muted" style="font-size:13px;margin:8px 0 0">Needs classic Outlook <b>open and signed in</b> on this computer — the planner reads your day from it while it's running and never starts it for you, so if the card says "Classic Outlook isn't open", just open Outlook and press Refresh. The new Outlook and the web version don't let other programs read them. Nothing is sent anywhere.</p>
  <p class="muted" style="font-size:13px;margin:8px 0 0">If Outlook pops up <i>"A program is trying to access email address information"</i>, that is this app reading your own inbox. Tick <b>Allow access for</b> (1 minute is plenty — a read takes under a second) and click Allow. To stop it asking for good you have to launch Outlook once as administrator (right‑click Outlook → <b>Run as administrator</b>), then File → Options → Trust Center → Trust Center Settings → Programmatic Access → <b>Never warn me about suspicious activity</b> → OK, and reopen Outlook normally. Outlook asks because it can't confirm the antivirus status to its own satisfaction; Windows Defender is on and up to date.</p></div>

  <div class="card" style="margin-top:14px"><h3 style="font-size:18px;margin:0 0 8px">Microsoft Teams</h3>
  <p class="muted" style="font-size:13.5px;margin:0 0 10px">Open Teams in its own window inside this app and sign in once — the login sticks between launches, so there's no separate browser to keep logging into. This is where your assignments live; a later update will read them straight into <b>Your day</b>.</p>
  <button class="btn" id="openteams2">Open Teams ↗</button></div>

  <div class="card" style="margin-top:14px"><h3 style="font-size:18px;margin:0 0 8px">Organise my day with AI</h3>
  <label style="display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer"><input type="checkbox" id="aion" ${settings.aiOrganise?"checked":""} style="width:18px;height:18px;accent-color:var(--ink)">Let a local AI summarise my emails and put each thing on the day it matters</label>
  <p class="muted" style="font-size:13px;margin:8px 0 0">Runs a small model (<span class="num">${esc(settings.aiModel||"llama3.2:3b")}</span>) through <a href="https://ollama.com">Ollama</a> on this computer — free, and nothing leaves the machine. It only loads for the second or two a refresh takes and then frees the memory, so it won't get in the way of a game. Set it up once: install Ollama, then run <span class="num">ollama pull ${esc(settings.aiModel||"llama3.2:3b")}</span>. If it's off or not installed, the app just falls back to the plain list. The AI only ever reshuffles and shortens what the rules already found — it can't invent tasks.</p></div>

  <div class="card" style="margin-top:14px"><h3 style="font-size:18px;margin:0 0 8px">Updates</h3>
  <label style="display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer"><input type="checkbox" id="autoupdon" ${AUTO_UPD?"checked":""} style="width:18px;height:18px;accent-color:var(--ink)">Install updates automatically</label>
  <p class="muted" style="font-size:13px;margin:8px 0 0">The app checks for a new version while it's open and whenever you come back to it, so a fresh release shows up without reopening. With this on it downloads and installs in the background, waiting until you're not mid‑lesson so the restart never interrupts you. It always jumps straight to the newest version. With this off, a bar offers the update and you choose when.</p></div>

/* ---------- VIEWS ---------- */
let view="today";
function showView(v){view=v;document.querySelectorAll(".nav [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));document.querySelectorAll(".view").forEach(s=>s.hidden=(s.id!=="view-"+v));render();window.scrollTo({top:0});}
function render(){({today:renderToday,subjects:renderSubjects,progress:renderProgress,plan:renderPlan,guide:renderGuide})[view]();}
document.querySelectorAll(".nav [role=tab]").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));

/* ---------- KEYBOARD ----------
   1-5 switch tabs. On Today: left and right change week, T jumps to today,
   P prints the week. Ctrl+K searches from anywhere. Escape closes menus. */
document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"")||(e.target&&e.target.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();curSubj=null;showView("subjects");const b=document.getElementById("findbox");if(b){b.focus();b.select();}return;}
  if(e.key==="Escape"){if(menuKey){menuKey=null;render();}if(typing)e.target.blur();return;}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  const tabs=["today","subjects","progress","plan","guide"];
  if(/^[1-5]$/.test(e.key)){showView(tabs[+e.key-1]);return;}
  if(view!=="today")return;
  if(e.key==="ArrowLeft"&&cur>1){cur--;curDay=0;menuKey=null;render();}
  else if(e.key==="ArrowRight"&&cur<TOTAL){cur++;curDay=0;menuKey=null;render();}
  else if(e.key.toLowerCase()==="t"){cur=todayWeek();curDay=null;render();}
  else if(e.key.toLowerCase()==="p"){window.print();}
});
document.addEventListener("click",e=>{if(menuKey&&!e.target.closest(".menu")&&!e.target.closest("[data-menu]")){menuKey=null;render();}});

   Several people on one PC, each with their own progress, plan, known topics
   and cards. Everything below talks to profiles.rs; switching reloads the app
   so nothing from one person can bleed into another. */
let PROFILES=null,PROFILE=null,pick={open:false,forced:false,sel:null,pin:"",msg:"",manage:false,adding:false,newName:"",newPin:""};
async function loadProfiles(){
  try{PROFILES=await invoke("list_profiles");PROFILE=PROFILES.profiles.find(p=>p.id===PROFILES.current)||PROFILES.profiles[0]||null;}
  catch(e){PROFILES=null;PROFILE=null;PROFILES_ERR=errText(e);}}
let PROFILES_ERR="";
const errText=e=>String(e).replace(/^Error:[ ]*/,"");

const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const hue=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))%360;return h;};
const hueClass=id=>"h"+(hue(id)%12);
function renderTop(){
  const el=document.getElementById("top");if(!el)return;
  if(!PROFILE){el.hidden=!PROFILES_ERR;el.innerHTML=PROFILES_ERR?`<div class="top-in"><span class="brand">Grade 9 Tracker</span><span class="muted" style="font-size:12.5px">Profiles unavailable: ${esc(PROFILES_ERR)}</span></div>`:"";return;}
  el.hidden=false;
  el.innerHTML=`<div class="top-in"><span class="brand">Grade 9 Tracker</span><button class="who" id="who" title="Switch profile"><span class="av ${hueClass(PROFILE.id)}">${esc(initials(PROFILE.name))}</span>${esc(PROFILE.name)}<span class="muted">▾</span></button></div>`;
  el.querySelector("#who").addEventListener("click",()=>showPicker(false));}
function showPicker(forced){pick={open:true,forced,sel:null,pin:"",msg:"",manage:false,adding:!PROFILES||!PROFILES.profiles.length,newName:"",newPin:""};renderPicker();}
function closePicker(){if(pick.forced)return;pick.open=false;renderPicker();}
async function choose(p){
  if(p.hasPin&&!pick.pin){pick.sel=p.id;pick.msg="";renderPicker();const i=document.getElementById("pinbox");if(i)i.focus();return;}
  try{await invoke("switch_profile",{id:p.id,pin:p.hasPin?pick.pin:null});}
  catch(e){pick.msg=errText(e);pick.pin="";renderPicker();const i=document.getElementById("pinbox");if(i)i.focus();return;}
  // A different person: start clean so nothing of the last one is still in memory.
  remember(p.id);location.reload();}
/* The choice holds for this run of the app, so a reload does not ask again. */
function remember(id){try{sessionStorage.setItem("g9-chosen",id);}catch(e){}}
function renderPicker(){
  const el=document.getElementById("picker");if(!el)return;
  if(!pick.open){el.hidden=true;el.innerHTML="";return;}
  el.hidden=false;

      ${pick.sel===p.id?`<div class="pkpin"><input type="password" inputmode="numeric" id="pinbox" placeholder="PIN" maxlength="8" value="${esc(pick.pin)}" autocomplete="off"><button class="btn primary small" data-go="${esc(p.id)}">Open</button></div>`:""}`).join("")+`</div>`;
    if(pick.msg)html+=`<p class="pkmsg">${esc(pick.msg)}</p>`;
    html+=`<div class="pkfoot"><button class="btn small" id="pkadd">+ New profile</button><button class="btn small" id="pkimport">Import a profile file</button><input type="file" id="pkfile" accept=".json" hidden>${ps.length?`<button class="btn small" id="pkmanage" style="margin-left:auto">Manage</button>`:""}</div>
      <p class="muted" style="font-size:12.5px;margin:12px 0 0">Each profile has its own progress, plan, known topics and cards. Everything stays on this PC. Anyone using the Save My Exams links needs their own Save My Exams login.</p>`;
  }else if(pick.adding){

      <span class="acts"><button class="btn small" data-rename="${esc(p.id)}">Rename</button><button class="btn small" data-pin="${esc(p.id)}">${p.hasPin?"Change PIN":"Set PIN"}</button><button class="btn small" data-export="${esc(p.id)}">Export</button>${ps.length>1?`<button class="btn small danger" data-delete="${esc(p.id)}">Delete</button>`:""}</span></div>`).join("")+`</div>`;

  const q=s=>el.querySelector(s);

  el.querySelectorAll("[data-rename]").forEach(b=>b.addEventListener("click",async()=>{const p=ps.find(x=>x.id===b.dataset.rename);const name=prompt("New name for "+p.name+":",p.name);if(name==null)return;
    try{await invoke("rename_profile",{id:p.id,name});await loadProfiles();renderTop();pick.msg="Saved.";renderPicker();}catch(err){pick.msg=errText(err);renderPicker();}}));

    const nw=prompt(p.hasPin?"New PIN (blank to remove):":"PIN for "+p.name+" (4 to 8 digits):");if(nw==null)return;
    try{await invoke("set_pin",{id:p.id,old,new:nw||null});await loadProfiles();pick.msg="Saved.";renderPicker();}catch(err){pick.msg=errText(err);renderPicker();}}));
  el.querySelectorAll("[data-export]").forEach(b=>b.addEventListener("click",async()=>{
    try{const path=await invoke("export_profile",{id:b.dataset.export});pick.msg="Exported to "+path+" — copy that file to the other PC and use Import there.";renderPicker();}catch(err){pick.msg=errText(err);renderPicker();}}));
  el.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",async()=>{const p=ps.find(x=>x.id===b.dataset.delete);
    if(!confirm("Delete the profile \""+p.name+"\"? Its files are moved aside, not destroyed, but the app will no longer show it."))return;
    const pin=p.hasPin?prompt("PIN for "+p.name+":"):null;if(p.hasPin&&pin==null)return;
    try{await invoke("delete_profile",{id:p.id,pin});if(PROFILE&&PROFILE.id===p.id){try{sessionStorage.removeItem("g9-chosen");}catch(e){}location.reload();return;}await loadProfiles();renderTop();pick.msg="Deleted.";renderPicker();}catch(err){pick.msg=errText(err);renderPicker();}}));
}

/* ---------- STARTUP: who is here, then their plan, then their progress ---------- */
let settings={};
const tracker={
  load:()=>invoke("load_state"), save:(s)=>invoke("save_state",{state:s}),
  statePath:()=>invoke("state_path"), backup:()=>invoke("backup")
};
window.tracker=tracker;
async function boot(){
  LS="grade9-tracker-v2:"+(PROFILE?PROFILE.id:"me");
  // This window's localStorage is the freshest copy: persist() writes it
  // synchronously on every change, then mirrors to state.json after a short
  // debounce. So localStorage wins; the file is only read to SEED a device with
  // no local copy yet (fresh install, cleared data, a new profile). Reading the
  // file back over localStorage was resurrecting ticked-off items whenever its
  // debounced write hadn't landed.
  let hasLocal=false;
  try{const raw=localStorage.getItem(LS);if(raw){state=Object.assign({...BLANK},JSON.parse(raw));hasLocal=true;}}catch(e){}
  try{const saved=await tracker.load();
    if(saved&&!hasLocal)state=Object.assign({...BLANK},saved);
    document.getElementById("sync").textContent="Saved";}catch(e){}
  if(!await reloadPlan()){
    document.getElementById("view-today").innerHTML='<div class="card"><div class="empty">Could not build the plan.</div></div>';return;}
  try{CFG=await invoke("get_config");}catch(e){}
  try{settings=await invoke("get_settings")||{};}catch(e){}
  cur=todayWeek();
  renderTop();
  render();
  loadDay(false);
  checkForUpdate();
  startUpdateWatch();
}

/* ---------- UPDATES ----------
   The backend check reads latest.json from the newest GitHub release, so it
   always offers the latest version in one jump - never one release at a time.
   We check on launch AND every few minutes while the app is open, and whenever
   the window regains focus, so a freshly pushed release shows up without having
   to reopen the app. "Install updates automatically" (Settings) installs it in
   the background as soon as it's found, waiting until you're not mid-lesson so a
   restart never interrupts you. Offline, every check fails quietly. */
let AUTO_UPD=true; try{AUTO_UPD=localStorage.getItem("g9.autoUpdate")!=="0";}catch(e){}   // on by default; off only if explicitly turned off
let UPD_BUSY=false,UPD_WATCHING=false;
function updateSafeNow(){return !lesson && !narrating && !narrPreparing;}   // don't restart mid-lesson/narration
async function startUpdate(u,auto){
  if(UPD_BUSY)return;UPD_BUSY=true;
  const el=document.getElementById("upd");if(!el)return;
  el.hidden=false;
  el.innerHTML=`<b>${auto?"Updating to":"Downloading"} version ${esc(u.version)}…</b><span class="muted">the app restarts by itself when it is done</span>`;
  try{await invoke("install_update");}                                     // installs + restarts; only returns on failure
  catch(e){UPD_BUSY=false;el.innerHTML=`<b>Update failed</b><span class="muted">${esc(errText(e))}</span><span class="spacer"></span><button class="btn small" id="updlater">Dismiss</button>`;el.querySelector("#updlater").addEventListener("click",()=>{el.hidden=true;});}
}
async function checkForUpdate(){
  if(UPD_BUSY)return;
  let u=null;try{u=await invoke("check_update");}catch(e){return;}
  if(!u)return;
  const el=document.getElementById("upd");if(!el)return;
  if(AUTO_UPD&&updateSafeNow()){return startUpdate(u,true);}               // auto: install now if it won't interrupt
  const waiting=AUTO_UPD?" · will install once you're not mid-lesson":"";
  el.innerHTML=`<b>Version ${esc(u.version)} is ready</b><span class="muted">you have ${esc(u.current)}${u.notes.trim()?" · "+esc(u.notes.trim().split(/\r?\n/)[0]).slice(0,140):""}${waiting}</span><span class="spacer"></span><button class="btn small primary" id="updgo">Update &amp; restart</button><button class="btn small" id="updlater">Later</button>`;
  el.hidden=false;
  el.querySelector("#updlater").addEventListener("click",()=>{el.hidden=true;});
  el.querySelector("#updgo").addEventListener("click",()=>startUpdate(u,false));
}
function startUpdateWatch(){
  if(UPD_WATCHING)return;UPD_WATCHING=true;
  setInterval(checkForUpdate,10*60*1000);                                  // re-check every 10 minutes
  window.addEventListener("focus",checkForUpdate);                         // and whenever you come back to the app
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkForUpdate();});
}
(async()=>{
  await loadProfiles();
  let chosen=null;try{chosen=sessionStorage.getItem("g9-chosen");}catch(e){}
  // More than one person, or a PIN on the current one: ask who is here first -
  // unless they just chose, in which case this is the reload that follows.
  if(PROFILES&&chosen!==PROFILES.current&&(PROFILES.profiles.length>1||(PROFILE&&PROFILE.hasPin))){renderTop();showPicker(true);return;}
  await boot();
})();
// Open web links in the system browser rather than inside the app window.
document.addEventListener("click",e=>{const a=e.target.closest("a[href^='http']");if(a){e.preventDefault();window.__TAURI__.opener.openUrl(a.href);}});
</script>
